<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聖誕老人送禮大冒險</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen snowy-night village — control bar, house-grid map with a tree to decorate, gift-box answer buttons; no scrolling */
:root{
  --night:#8FD3FF; --night2:#EAF7FF; --snow:#FFFFFF; --ink:#1C2440; --soft:#5C6688; --panel:#FFFFFF;
  --red:#D7263D; --green:#1E9E5A; --gold:#F2B705; --blue:#3E7BEA; --pink:#FF8CC6; --purple:#8B4FD8; --yellow:#FFD21F;
  --f-title:"Chewy","Arial Rounded MT Bold",Arial,sans-serif;
  --f-en:"Nunito","Arial Rounded MT Bold",Arial,sans-serif;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--night),var(--night2) 65%,#FFFFFF);color:var(--ink);font-family:var(--f-zh);overflow-x:hidden}
#snowbg{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(#fff 2px,transparent 2.5px),radial-gradient(#ffffffcc 3px,transparent 3.5px);background-size:60px 60px,110px 110px;background-position:0 0,30px 40px;animation:snow 14s linear infinite;opacity:.7}
@keyframes snow{to{background-position:20px 600px,60px 640px}}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,.opt:focus-visible,.ball:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px;box-sizing:border-box;gap:6px}
.en{font-family:var(--f-en)}

#topbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
#topbar button,#topbar .chip{border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:12px;padding:5px 10px;font-size:clamp(13px,3.4vmin,16px);font-weight:700;line-height:1.2}
#tbBack{background:var(--gold)!important}
#tbStar{background:var(--red)!important;color:#fff!important;border-color:#fff!important;min-width:64px;text-align:center}
#tbVoice.off{background:#FFD9DD!important}
#tbPause{background:#CFE2FF!important}

#view{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;min-height:0}

/* splash */
#splash{align-items:center;justify-content:center;text-align:center;gap:16px}
.logo{font-family:var(--f-title);font-size:clamp(42px,11vmin,96px);line-height:.95;color:var(--red);text-shadow:0 4px 0 #fff}
.logo small{display:block;font-family:var(--f-zh);font-size:.38em;font-weight:900;margin-top:.35em;letter-spacing:3px;text-shadow:none;color:var(--green)}
.splash-art{display:flex;gap:2vmin;align-items:flex-end}
.splash-art .pic{width:clamp(70px,18vmin,140px);height:auto;animation:bob 2.6s ease-in-out infinite}
.splash-art .pic:nth-child(2){animation-delay:.4s;width:clamp(90px,24vmin,180px)}.splash-art .pic:nth-child(3){animation-delay:.8s}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}
.bigbtn{border:3px solid var(--ink);background:var(--red);color:#fff;font-weight:900;font-size:clamp(22px,6vmin,40px);padding:.45em 1.4em;border-radius:20px;box-shadow:0 6px 0 #8C1124}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #8C1124}
.bigbtn.alt{background:var(--green);box-shadow:0 6px 0 #0E5C32}
.linebar{background:#FFF4C2;color:var(--ink);border:2px dashed var(--ink);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;max-width:520px}
.linebar a{display:inline-block;margin-top:6px;background:var(--blue);color:#fff;padding:6px 14px;border-radius:10px;text-decoration:none}

/* home */
#home{align-items:center;justify-content:center}
.homecard{background:var(--panel);color:var(--ink);border:4px solid var(--red);border-radius:24px;box-shadow:0 8px 0 #8C1124;padding:clamp(10px,2.5vmin,22px);width:min(100%,760px);display:grid;gap:clamp(6px,1.6vmin,14px);box-sizing:border-box;max-height:100%;overflow:auto}
.homecard h1{margin:0;text-align:center;font-family:var(--f-title);font-weight:400;font-size:clamp(28px,7vmin,52px);line-height:1;color:var(--red)}
.homecard h1 small{display:block;font-family:var(--f-zh);font-size:.42em;color:var(--soft);font-weight:700;margin-top:4px}
.lbl{font-weight:900;font-size:clamp(15px,3.8vmin,20px)}
#nameIn{width:100%;box-sizing:border-box;font-size:clamp(18px,4.6vmin,26px);padding:8px 12px;border:3px solid var(--ink);border-radius:14px;font-family:var(--f-zh);font-weight:700;background:#fff;color:var(--ink)}
#players{display:flex;flex-wrap:wrap;gap:6px}
#players button{border:2px solid var(--ink);background:#EAF2FF;color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
#chars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
#chars button{border:3px solid #DCE3F0;background:#F6F9FF;color:var(--ink);border-radius:16px;padding:4px 0;display:flex;flex-direction:column;align-items:center;font-size:clamp(11px,2.6vmin,14px);font-weight:700}
#chars button b{font-size:clamp(28px,7vmin,46px);line-height:1.15;font-weight:400}
#chars button.on{border-color:var(--red);background:#FFF1C2;transform:translateY(-3px)}
.homebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.homebtns .bigbtn{font-size:clamp(20px,5.2vmin,32px);border-color:var(--ink)}
@media (max-aspect-ratio:1/1){ #chars{grid-template-columns:repeat(4,1fr)} }

/* map: snowy village */
#map{gap:6px}
.maparea{flex:1;min-height:0;display:flex;gap:10px}
.maphead{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:clamp(16px,4.2vmin,26px)}
.maphead b{font-size:1.5em;font-weight:400}
#tiles{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(8px,2vmin,16px);padding:clamp(4px,1vmin,8px)}
.tile{position:relative;border:3px solid var(--ink);border-radius:0 0 14px 14px;background:#F5E6D0;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px;min-height:0;text-align:center;margin-top:clamp(14px,4vmin,26px)}
.tile::before{content:"";position:absolute;left:-8%;right:-8%;bottom:100%;height:clamp(16px,4.4vmin,30px);background:var(--red);clip-path:polygon(50% 0,100% 100%,0 100%);border-bottom:3px solid var(--ink)}
.tile::after{content:"";position:absolute;left:-8%;right:-8%;bottom:calc(100% + clamp(10px,3vmin,20px));height:8px;background:radial-gradient(#fff 60%,transparent 62%) 0 0/12px 8px;opacity:.9}
.tile .num{position:absolute;top:4px;left:6px;font-family:var(--f-en);font-weight:900;font-size:clamp(13px,3.2vmin,18px);color:var(--soft)}
.tile .ic{font-size:clamp(20px,5.6vmin,40px);line-height:1}
.tile .nm{font-weight:900;font-size:clamp(12px,3.2vmin,19px);line-height:1.15}
.tile .sb{font-size:clamp(10px,2.5vmin,14px);color:var(--soft);font-weight:700}
.tile.done{background:#FFF3B8;box-shadow:0 0 18px #FFD21F88}
.tile.done .got{position:absolute;right:4px;top:4px;width:clamp(20px,5vmin,34px)}
.tile.next{animation:glow 1.3s ease-in-out infinite}
.tile .me{position:absolute;bottom:2px;right:6px;font-size:clamp(20px,5vmin,36px);animation:bob 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px var(--gold)}}
.treebox{width:clamp(90px,24vmin,180px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:clamp(12px,3vmin,16px);text-align:center}
.treebox .pic{width:100%;height:auto;max-height:100%}
@media (max-aspect-ratio:1/1){ .maparea{flex-direction:column} .treebox{width:auto;height:clamp(80px,16vh,150px);flex-direction:row} .treebox .pic{height:100%;width:auto} }

/* game */
#gprog{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap;min-height:20px}
.dot{width:clamp(14px,3vmin,20px);height:clamp(14px,3vmin,20px);border-radius:3px;border:2px solid var(--ink);background:#fff!important;background:transparent;transform:rotate(45deg)}
.dot.f{background:var(--gold)!important}.dot.c{background:var(--red)!important;transform:rotate(45deg) scale(1.3)}
.sttitle{font-weight:900;font-size:clamp(13px,3.2vmin,17px);color:#3B4A72;margin-right:8px}
#gins{text-align:center;font-weight:900;font-size:clamp(16px,4.2vmin,24px);line-height:1.25;min-height:1.25em}
#gdisp{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#gopts{display:flex;gap:clamp(8px,2vmin,16px);justify-content:center;align-items:stretch;flex-wrap:wrap}
#gopts.txt{flex-direction:column;align-items:center}
@media (min-aspect-ratio:4/3){ #gopts.txt{flex-direction:row} #gopts.txt .opt.txt{min-width:0;max-width:42vw;padding:10px 18px} #gopts.txt .opt.txt .in{font-size:clamp(17px,4.4vmin,30px)} }
.gfoot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.gfoot button{border:3px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:14px;padding:6px 16px;font-weight:900;font-size:clamp(15px,3.8vmin,20px);box-shadow:0 4px 0 #0B1430}
.gfoot button:active{transform:translateY(3px);box-shadow:0 1px 0 #0B1430}
#again{background:#FFF1C2!important}

/* gift-box options */
.opt{position:relative;border:3px solid var(--ink);background:var(--panel);color:var(--ink);box-shadow:0 5px 0 #0B1430;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;cursor:pointer;transition:transform .12s,opacity .2s;border-radius:12px}
.opt::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:12%;transform:translateX(-50%);background:var(--rib,var(--red));opacity:.85;z-index:0}
.opt::after{content:"";position:absolute;top:-14px;left:50%;width:30px;height:16px;transform:translateX(-50%);background:radial-gradient(circle at 25% 60%,var(--rib,var(--red)) 0 34%,transparent 36%),radial-gradient(circle at 75% 60%,var(--rib,var(--red)) 0 34%,transparent 36%);z-index:1}
.opt:nth-child(1){--rib:var(--red)}.opt:nth-child(2){--rib:var(--green)}.opt:nth-child(3){--rib:var(--gold)}.opt:nth-child(4){--rib:var(--blue)}
.opt .in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffffffe6;border-radius:8px}
.opt.pic{width:clamp(90px,26vmin,200px);aspect-ratio:1/1;max-width:30vw}
.opt.pic .in{width:84%;height:84%}
.opt.pic .pic{width:100%;height:100%}
.opt.txt{min-width:min(80vw,260px);padding:12px 22px}
.opt.txt .in{font-family:var(--f-en);font-weight:900;font-size:clamp(20px,5.2vmin,34px);line-height:1.15;padding:2px 10px}
.opt.txt .in small{font-family:var(--f-zh);font-size:.55em;color:var(--soft);font-weight:700}
.opt .ear{position:absolute;z-index:3;right:-6px;top:-10px;font-size:13px;font-weight:900;background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:0 7px;line-height:1.5}
.opt.hl{transform:translateY(-6px) scale(1.05);box-shadow:0 10px 0 #0B1430}
.opt.dim{opacity:.4}
.opt.right{background:#DDF7E7;transform:scale(1.08)}
.opt.hint{animation:hint 1s ease-in-out infinite}
.opt.hint .in::after{content:"👇";position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:26px}
@keyframes hint{50%{box-shadow:0 0 0 7px var(--gold),0 5px 0 #0B1430}}
.opt:active{transform:translateY(3px)}

/* displays */
.pic{display:block}
.dispwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;height:100%;width:100%}
.word{font-family:var(--f-en);font-weight:900;font-size:clamp(34px,10vmin,84px);line-height:1}
.sent{font-family:var(--f-en);font-weight:900;font-size:clamp(22px,6vmin,48px);line-height:1.2;text-align:center;background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:.25em .7em}
.sent small{display:block;font-size:.85em}
.zhmean{font-weight:900;font-size:clamp(18px,5vmin,32px);color:var(--soft)}
.chimney{height:100%;max-height:46vmin;aspect-ratio:1/1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.chimney .out{width:62%;height:56%;display:grid;place-items:center;font-family:var(--f-title);font-size:clamp(46px,13vmin,100px);color:var(--gold)}
.chimney .out .pic{width:100%;height:100%;animation:popup .7s}
.chimney .stack{width:46%;height:34%;background:repeating-linear-gradient(0deg,#B5452E 0 16%,#7E2A1B 16% 18%),#B5452E;border:4px solid var(--ink);border-top-width:10px;border-radius:6px 6px 0 0;box-shadow:inset 0 10px 0 #fff}
@keyframes popup{from{transform:translateY(60%) scale(.3);opacity:0}}
.tag{position:relative;height:100%;max-height:44vmin;aspect-ratio:1/1;background:var(--panel);border:4px solid var(--ink);border-radius:14px;display:grid;place-items:center}
.tag .pic{width:74%;height:74%}
.tag .label{position:absolute;bottom:-6%;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:8px;padding:0 14px;font-family:var(--f-en);font-weight:900;font-size:clamp(18px,5vmin,34px);white-space:nowrap}
.pattern{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:clamp(4px,1.2vmin,10px);background:#F6D7C8;border:4px solid var(--ink);border-radius:18px;padding:clamp(8px,2vmin,16px);max-width:min(96%,760px);box-sizing:border-box}
.pattern .cell{width:clamp(48px,10.5vmin,84px);aspect-ratio:1;background:#fff;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;font-family:var(--f-title);font-size:clamp(28px,7vmin,52px);color:var(--red)}
.pattern .cell .pic{width:86%;height:86%}
.pattern .cell.q{border-style:dashed;background:#FFF7D6}
.pattern .cell.hl{transform:translateY(-6px);box-shadow:0 0 0 4px var(--gold)}
.countbox{position:relative;height:100%;max-height:50vmin;aspect-ratio:4/3;max-width:96%;background:linear-gradient(#6DB8F2,#BFE4FF 70%,#fff 70%);border:4px solid var(--ink);border-radius:20px;overflow:hidden}
.countbox .it{position:absolute;width:19%;height:22%}
.countbox .it .pic{width:100%;height:100%}
.sc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vmin;height:100%;width:100%}
.scpic{display:flex;align-items:center;justify-content:center;gap:2vmin;font-size:clamp(44px,12vmin,96px);line-height:1;background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:1.5vmin 3vmin;max-width:100%;box-sizing:border-box;flex-wrap:wrap}
.scpic .pic{height:1.15em;width:auto}
.bub{font-family:var(--f-en);font-size:clamp(17px,4.4vmin,28px);background:#FFF1C2;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:2px 10px;white-space:nowrap;font-weight:900}
.cap{font-weight:900;font-size:clamp(18px,5vmin,30px);text-align:center}
.emo{font-size:clamp(64px,18vmin,140px);line-height:1;background:var(--panel);border:3px solid var(--ink);border-radius:40px;padding:.2em .35em;display:flex;gap:.1em;align-items:center;white-space:nowrap}

/* learn card */
.lcard{background:var(--panel);color:var(--ink);border:4px solid var(--green);border-radius:24px;box-shadow:0 6px 0 #0E5C32;display:flex;align-items:center;justify-content:center;gap:3vmin;padding:2vmin 4vmin;height:100%;max-height:60vmin;box-sizing:border-box;max-width:100%}
.lcard .pic{height:min(100%,34vmin);width:auto}
.lcard .lw{display:flex;flex-direction:column;align-items:flex-start;gap:1vmin}
.lcard .word span{display:inline-block;transition:transform .15s,color .15s}
.lcard .word span.hl{color:var(--red);transform:translateY(-8px) scale(1.2)}
.lcard .word.hl{color:var(--green)}
@media (max-aspect-ratio:1/1){ .lcard{flex-direction:column;height:auto} .lcard .lw{align-items:center} }

/* snowball spelling */
.spell{display:flex;flex-direction:column;align-items:center;gap:1.4vmin;height:100%;width:100%}
.spelltop{display:flex;align-items:center;gap:3vmin}
.spelltop .pic{height:clamp(56px,15vmin,110px);width:auto}
.slots{display:flex;gap:6px}
.slots span{width:clamp(36px,9vmin,64px);height:clamp(44px,11vmin,76px);border:3px solid var(--ink);border-radius:12px;background:#ffffffaa;display:grid;place-items:center;font-family:var(--f-en);font-weight:900;font-size:clamp(28px,7.5vmin,54px)}
.slots span.f{background:var(--panel);color:var(--red);border-color:var(--ink);animation:pop .4s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.balls{flex:1;min-height:0;width:min(96%,640px);border-radius:26px;background:linear-gradient(transparent 55%,#ffffffcc 55%);display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;gap:clamp(8px,2vmin,16px);padding:12px;box-sizing:border-box}
.ball{width:clamp(52px,13vmin,92px);aspect-ratio:1;border:3px solid var(--ink);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 40%,#DCE7F7 75%);display:grid;place-items:center;font-family:var(--f-en);font-weight:900;font-size:clamp(28px,7.5vmin,52px);color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .55s ease,opacity .3s}
.ball.dim{opacity:.45}.ball.gone{visibility:hidden}
.ball.hint{animation:hintb 1s infinite}
@keyframes hintb{50%{box-shadow:0 0 0 7px var(--gold)}}

/* boss + teams */
.bossbar{display:flex;align-items:center;gap:6px;font-weight:900;font-size:clamp(13px,3.3vmin,18px);flex-wrap:wrap;justify-content:center}
.bossbar .hs{display:flex;gap:3px}
.bossbar .h{font-size:clamp(18px,4.6vmin,28px);filter:grayscale(1) brightness(.6)}
.bossbar .h.on{filter:none}
.bossbar .sl{font-size:clamp(22px,5.6vmin,36px)}
.teams{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.team{border:3px solid var(--ink);border-radius:12px;padding:2px 10px;font-weight:900;font-size:clamp(13px,3.3vmin,18px);background:var(--panel);color:var(--ink);display:flex;align-items:center;gap:6px}
.team.cur{transform:scale(1.12);box-shadow:0 0 0 4px var(--gold)}
.team .sc2{font-family:var(--f-en);font-size:1.2em}

/* overlays */
.ov{position:fixed;inset:0;background:#1C2440bb;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.ovbox{background:var(--panel);color:var(--ink);border:4px solid var(--red);border-radius:26px;box-shadow:0 8px 0 #8C1124;padding:clamp(14px,3vmin,28px);text-align:center;display:grid;gap:10px;justify-items:center;max-width:560px;width:100%;max-height:100%;overflow:auto;box-sizing:border-box}
.ovt{font-weight:900;font-size:clamp(28px,8vmin,54px);color:var(--red)}
.ovpic .pic{width:clamp(100px,28vmin,190px);height:auto;animation:pop .7s}
.ovs{font-weight:900;font-size:clamp(17px,4.4vmin,26px)}
.ovbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ovbtns button{border:3px solid var(--ink);border-radius:16px;padding:8px 20px;font-weight:900;font-size:clamp(17px,4.4vmin,24px);background:var(--panel);color:var(--ink);box-shadow:0 4px 0 #0B1430}
.ovbtns button.go{background:var(--green);color:#fff}
.teamsel button{font-size:clamp(20px,5vmin,30px)!important;min-width:3.5em}
.podium{display:grid;gap:6px;width:100%}
.podium div{display:flex;justify-content:space-between;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:900;font-size:clamp(17px,4.4vmin,24px)}
#pauseOv{z-index:40}#pauseOv .ovt{color:var(--blue)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:14}

#toast.show{opacity:1}
#fitHint{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--red);color:#fff;font-weight:900;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:16px;animation:bob 1.2s infinite}

.xwm{position:fixed;inset:0;z-index:9999;background:#0009;display:flex;align-items:center;justify-content:center;padding:12px}

<div id="snowbg"></div>
<div id="app">
  <div id="topbar" hidden>
    <button id="tbBack">回首頁</button>

    <button id="tbPause">暫停</button>
    <button id="tbVoice">不要語音說明</button>
    <button id="tbSlow">唸慢一點</button>
    <button id="tbFast">唸快一點</button>
  </div>
  <div id="view">
    <section id="splash" class="screen">
      <div class="logo">Merry Christmas!<small>聖誕老人送禮大冒險</small></div>
      <div class="splash-art" id="splashArt"></div>
      <button class="bigbtn" id="startBtn">點一下開始</button>
      <div class="linebar" id="lineBar" hidden>在 LINE 裡打開可能沒有聲音。<br>請按下面的按鈕，用瀏覽器打開。<br><a id="lineLink" href="#" target="_blank" rel="noopener">用瀏覽器打開</a></div>
    </section>

    <section id="home" class="screen" hidden>

        <h1>Merry Christmas!<small>聖誕節＋總複習 闖關</small></h1>

        <div id="players"></div>

        <div id="chars"></div>
        <div class="homebtns">
          <button class="bigbtn" id="goMap">開始闖關</button>
          <button class="bigbtn alt" id="goTeam">小組競賽</button>
        </div>
      </div>
    </section>

    <section id="map" class="screen" hidden>

      <div class="maparea"><div id="tiles"></div><div class="treebox" id="treebox"></div></div>

      <div id="gprog"></div>
      <div id="gins"></div>
      <div id="gdisp"></div>
      <div id="gopts"></div>
      <div class="gfoot" id="gfoot"><button id="again">再聽一次</button></div>

  </div>
</div>

    const u=new SpeechSynthesisUtterance(it.t);
    u.lang=it.l==='zh'?'zh-TW':'en-US';
    u.rate=it.l==='zh'?Math.min(1.25,T.rate*1.05+0.12):T.rate;

    const end=()=>{if(fin)return;fin=true;clearTimeout(to);if(tok!==T.tok)return;setTimeout(step,it.l==='zh'?140:300/Math.max(.6,T.rate))};
    u.onend=end;u.onerror=end;
    const to=setTimeout(end,2200+it.t.length*(it.l==='zh'?340:130)/u.rate);
    try{speechSynthesis.speak(u)}catch(e){end()}
  };
  if(justUnlocked())step();else setTimeout(step,70);/* 剛點完畫面：馬上唸，iPhone 才會出聲 */

const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],fxOn=false;
const COLS=['#D7263D','#F2B705','#1E9E5A','#FFFFFF','#3E7BEA'];
function fit(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener('resize',fit);fit();
function burst(mode,big){
  const W_=cv.width,H=cv.height,n=big?2:1;
  if(mode==='confetti')for(let i=0;i<90*n;i++)parts.push({k:'r',x:Math.random()*W_,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,c:rnd(COLS),life:200});
  if(mode==='fire')for(let b=0;b<2+n;b++){const ox=W_*(.2+Math.random()*.6),oy=H*(.15+Math.random()*.35);for(let i=0;i<40;i++){const a=Math.PI*2*i/40,s=2+Math.random()*3;parts.push({k:'c',x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:rnd(COLS),life:60+Math.random()*20,g:.05})}}
  if(mode==='flakes')for(let i=0;i<60*n;i++)parts.push({k:'f',x:Math.random()*W_,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*1.2,vy:1.5+Math.random()*2.5,sz:14+Math.random()*16,life:260});
  if(mode==='stars')for(let i=0;i<26*n;i++)parts.push({k:'s',x:Math.random()*W_,y:H+20,vx:(Math.random()-.5)*1.5,vy:-(3+Math.random()*4),life:140,sz:18+Math.random()*22});
  if(!fxOn){fxOn=true;requestAnimationFrame(loop)}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life-->0&&p.y<cv.height+80&&p.y>-200);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;if(p.g)p.vy+=p.g;
    if(p.k==='r'){cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.y/20+p.r);cx.fillRect(-5,-3,10,6);cx.restore()}
    else if(p.k==='c'){cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,3,0,7);cx.fill();cx.globalAlpha=1}
    else if(p.k==='f'){cx.font=p.sz+'px sans-serif';cx.fillStyle='#fff';cx.fillText('❄',p.x,p.y)}
    else if(p.k==='s'){cx.font=p.sz+'px sans-serif';cx.fillText('⭐',p.x,p.y)}}
  if(parts.length)requestAnimationFrame(loop);else{fxOn=false;cx.clearRect(0,0,cv.width,cv.height)}
}

  const ks=shuffle(['star','snowman','stocking','tree']);
  return [...Array(n)].map((_,i)=>{
    const k=ks[i%4],it=ITEMS[k],cnt=3+Math.floor(Math.random()*7);
    const others=IK.filter(x=>x!==k&&x!=='santa'),dn=2;
    const cells=shuffle([...Array(20)].map((_,j)=>j)).slice(0,cnt+dn);
    const things=cells.map((c,j)=>({c,k:j<cnt?k:rnd(others)}));
    const nums=shuffle([cnt].concat(pick([cnt-2,cnt-1,cnt+1,cnt+2].filter(x=>x>=1&&x<=10),2)));
    return {key:'count',ins:'數一數，有幾個？點出正確的英文數字',insS:'數一數，點出數字',ask:'有幾'+it.mw+it.zh+'？',askEn:[E('How many '+it.pl+'?')],
      disp:()=>`<div class="countbox">${things.map(t=>`<div class="it" style="left:${(t.c%5)*20+1}%;top:${Math.floor(t.c/5)*24+2}%">${P[t.k]}</div>`).join('')}</div>`,
      kind:'txt',auto:true,opts:nums.map(v=>({html:NUMW[v]+'<small>'+v+'</small>',say:NUMW[v],ok:v===cnt}))};
  });
}

const ODD=[[['thirsty','口渴'],['hungry','餓'],['doll','洋娃娃'],2],[['eight','八'],['purple','紫色'],['yellow','黃色'],0],[['pink','粉紅色'],['red','紅色'],['ball','球'],2],[['happy','開心'],['purple','紫色'],['angry','生氣'],1],[['car','汽車'],['one','一'],['six','六'],0],[['doll','洋娃娃'],['robot','機器人'],['sad','難過'],2],[['five','五'],['nine','九'],['kite','風箏'],2]];
const FEEL=[['happy','開心','😄'],['sad','難過','😢'],['angry','生氣','😠'],['hungry','餓','🍔😋'],['thirsty','口渴','🥤😫']];
const COL={red:'#D7263D',green:'#1E9E5A',blue:'#3E7BEA',yellow:'#FFD21F',pink:'#FF8CC6',purple:'#8B4FD8'};
function reviewQs(n){
  const out=[];
  pick(ODD,2).forEach(([a,b,c,odd])=>{const arr=[a,b,c];
    out.push({key:'odd',ins:'三個英文裡，有一個不是同一類。把它找出來',insS:'哪一個不一樣？',askEn:[],
      disp:()=>`<div class="dispwrap"><div class="sent">哪一個<br>不是同一類？</div></div>`,kind:'txt',auto:true,
      opts:shuffle(arr.map((x,i)=>({html:x[0]+'<small>'+x[1]+'</small>',say:x[0],ok:i===odd})))});
  });
  pick(FEEL,2).forEach(f=>{const oth=pick(FEEL.filter(x=>x!==f),2);
    out.push({key:'feel',ins:'看看他的心情，點出正確的英文',insS:'他覺得怎麼樣？',askEn:[],
      disp:()=>`<div class="emo">${f[2]}</div>`,kind:'txt',auto:true,opts:shuffle([{html:f[0],say:f[0],ok:true}].concat(oth.map(x=>({html:x[0],say:x[0]}))))});
  });
  {const a=1+Math.floor(Math.random()*8),b=10-a;const nums=shuffle([b].concat(pick([1,2,3,4,5,6,7,8,9].filter(x=>x!==b),2)));
    out.push({key:'ten',ins:'兩個數字加起來要等於十。問號是多少？',insS:'加起來是 ten',askEn:[E(NUMW[a]),W(200),Z('加多少，會等於'),E('ten')],
      disp:()=>`<div class="dispwrap"><div class="sent">${a} + ? = 10<small>${NUMW[a]} + ? = ten</small></div></div>`,kind:'txt',auto:true,opts:nums.map(v=>({html:NUMW[v]+'<small>'+v+'</small>',say:NUMW[v],ok:v===b}))});
  }
  {const toy=rnd(['robot','ball','yoyo','sun']),c=rnd(Object.keys(COL));
    const nm={robot:'a robot',ball:'a ball',yoyo:'a yo-yo',sun:'a sun'};
    const ans=toy==='ball'?null:toy;
    const T2=ans||'robot';
    const opts=shuffle([{html:"It's "+nm[T2]+".",say:"It's "+nm[T2]+".",ok:true}].concat(pick(['a doll','a kite','a car'],2).map(x=>({html:"It's "+x+".",say:"It's "+x+"."}))));
    out.push({key:'circle',ins:'圓形變成了一個玩具。這不是球，它是什麼？',insS:'它是什麼？',askEn:[E('This is not a ball.')],
      disp:()=>`<div class="sc"><div class="scpic">${P.circle}<span style="font-size:.6em">➡️</span>${P[T2](COL[c])}</div></div>`,kind:'txt',auto:true,opts});
  }
  {const pairs=[['Santa Claus','red','santa'],['Christmas tree','green','tree'],['Shining star','gold','star']];const pr=rnd(pairs);
    out.push({key:'xcol',ins:'聖誕節的顏色！它是什麼顏色？',insS:'它是什麼顏色？',askEn:[E(pr[0]+'.')],
      disp:()=>`<div class="tag">${P[pr[2]]}</div>`,kind:'txt',auto:true,opts:shuffle(['red','green','gold'].map(x=>({html:x,say:x,ok:x===pr[1]})))});
  }
  return shuffle(out).slice(0,n);
}
function mixQs(n){return shuffle([].concat(listenQs(2),readQs(2),patternQs(1),countQs(1),sceneQs(2),reviewQs(2))).slice(0,n)}

/* ---------- learn cards ---------- */
const itemCards=()=>IK.map(k=>({art:P[k],w:ITEMS[k].en,zh:ITEMS[k].zh,sp:k==='star'||k==='snowman'||k==='stocking'?k:null}));
const scnCards=()=>[{art:P.santa,phrase:'Merry Christmas!',zh:'聖誕快樂！'},{art:P.gift('#D7263D'),phrase:'This is for you.',zh:'這是給你的。'},{art:P.gift('#1E9E5A'),phrase:'Here you are.',zh:'給你。'},{art:P.santa,phrase:'Thank you, Santa Claus.',zh:'謝謝你，聖誕老人。'},{art:P.tree,phrase:'Christmas time. Happy time.',zh:'聖誕時光，快樂時光。'}];
const revCards=()=>[{emo:'😄',w:'happy',zh:'開心'},{emo:'😢',w:'sad',zh:'難過'},{emo:'😠',w:'angry',zh:'生氣'},{emo:'🍔',w:'hungry',zh:'餓'},{emo:'🥤',w:'thirsty',zh:'口渴'}].map(c=>Object.assign(c,{sp:c.w}));

function runCards(cards,title,done){
  S.cards=cards;S.ci=0;S.cardsDone=done;S.cardTitle=title;S.inCards=true;
  $('#gopts').className='';$('#gopts').innerHTML='';
  $('#gfoot').innerHTML='<button id="again">再聽一次</button><button id="cNext">下一個</button><button id="cSkip">跳過，直接玩</button>';
  $('#again').onclick=againQ;
  $('#cNext').onclick=()=>{S.ci++;showCard()};
  $('#cSkip').onclick=()=>{S.ci=S.cards.length;showCard()};
  showCard();
}
function showCard(){
  clearTimeout(S.autoT);
  if(S.ci>=S.cards.length){S.inCards=false;stopTalk();restoreFoot();S.cardsDone();return}
  const c=S.cards[S.ci];
  $('#gprog').innerHTML=`<span class="sttitle">${S.cardTitle}</span>`+S.cards.map((_,i)=>`<span class="dot ${i<S.ci?'f':i===S.ci?'c':''}"></span>`).join('');
  $('#gins').textContent=c.sp?'聽一聽，看字母一個一個亮起來':'聽一聽，跟著說';
  const left=c.emo?`<span style="font-size:clamp(70px,20vmin,150px);line-height:1">${c.emo}</span>`:c.art;
  let right;
  if(c.sp){const idx=c.w.indexOf(c.sp);right=`<div class="word" id="cw">${c.w.slice(0,idx)}${c.sp.split('').map((ch,i)=>`<span data-i="${i}">${ch}</span>`).join('')}</div>`}
  else right=`<div class="word" id="cw" style="font-size:clamp(28px,8vmin,64px)">${c.phrase||c.w}</div>`;
  $('#gdisp').innerHTML=`<div class="lcard">${left}<div class="lw">${right}<div class="zhmean">${c.zh}</div></div></div>`;
  checkFit();playCard();
}
function playCard(){
  const c=S.cards[S.ci];if(!c)return;const ci=S.ci;let seq=[];
  const say=c.phrase||c.w;
  if(c.sp){c.sp.split('').forEach((ch,i)=>{seq.push(E(LT(ch),{hl:()=>document.querySelector('#cw span[data-i="'+i+'"]')}),W(250))});seq.push(W(200),E(say,{hl:()=>$('#cw')}),W(300),Z(c.zh))}
  else seq=[E(say,{hl:()=>$('#cw')}),W(400),Z(c.zh),W(400),E(say,{hl:()=>$('#cw')})];
  clearTimeout(S.autoT);
  talk(seq,()=>{S.autoT=setTimeout(()=>{if(S.inCards&&S.ci===ci&&!S.paused){S.ci++;showCard()}},1600)});
}
function restoreFoot(){$('#gfoot').innerHTML='<button id="again">再聽一次</button>';$('#again').onclick=againQ}

/* ---------- 描單字（和 English-1-abc 同一套） ---------- */
const TRACE_W=[['star','星星'],['bell','鈴鐺'],['tree','樹'],['gift','禮物'],['ball','球'],['sun','太陽']];
const trPic=w=>({gift:P.gift('#D7263D'),ball:P.ball('#3E7BEA'),sun:P.sun('#F2B705')})[w]||P[w];
function traceStation(){
  S.qs=shuffle(TRACE_W).slice(0,2);S.qi=0;S.q=null;const first=!S.seen.trace;S.seen.trace=1;
  const step=()=>{
    const tok=++S.trTok;
    if(S.qi>=S.qs.length){S.traceStep=null;stationClear();return}
    const [w,zh]=S.qs[S.qi];
    $('#gprog').innerHTML=progHTML();$('#gins').textContent='看圖，聽單字，用手指描一描';
    $('#gopts').className='';$('#gopts').innerHTML='';
    const d=$('#gdisp');d.innerHTML='';const host=document.createElement('div');host.className='wthost';d.appendChild(host);
    const sp=it=>new Promise(r=>{if(S.paused)return r();talk([it],r)});
    WT.word(host,w,{pic:`<span class="wtp">${trPic(w)}</span>`,zhw:zh,nm:LT,first:first&&S.qi===0,
      en:t=>sp(E(t)),zh:t=>sp(Z(t,{ins:true})),mean:t=>sp(Z(t)),stop:stopTalk,pop:()=>SFX.bloop(),
      good:()=>{S.stars++;updStars();cheer()},paused:()=>S.paused,alive:()=>tok===S.trTok&&S.screen==='game'&&!S.paused,
      replay:fn=>{$('#again').onclick=fn},
      line:XLINE&&!stayHere?()=>openExt({go:'start',nm:S.name,av:S.char}):null})
    .then(ok=>{if(ok&&tok===S.trTok){S.qi++;step()}});
  };
  S.traceStep=()=>{S.trTok++;step()};step();
}

/* ---------- station flow ---------- */
function startStation(i){
  S.traceStep=null;S.trTok=(S.trTok||0)+1;stopTalk();S.mode='solo';S.si=i;S.qi=0;S.lock=false;S.boss=!!ST[i].boss;S.bossFix=0;
  show('game');restoreFoot();
  const play=qs=>{S.qs=qs;nextQ()};
  switch(i){
    case 0:runCards(itemCards(),'認識聖誕單字',()=>stationClear());$('#cSkip').hidden=true;break;
    case 1:play(listenQs(5));break;
    case 2:play(readQs(6));break;
    case 3:play(spellQs(4));break;
    case 4:play(patternQs(4));break;
    case 5:play(countQs(4));break;
    case 6:runCards(scnCards(),'先認識',()=>play(sceneQs(6)));break;
    case 7:runCards(revCards(),'先認識心情',()=>play(reviewQs(6)));break;
    case 8:traceStation();break;
    case 9:play(mixQs(8));break;
  }
}
function progHTML(){
  if(S.mode==='team')return teamBar();
  if(S.boss){const n=S.qs.length;return `<div class="bossbar"><span class="sl">🛷</span><span class="hs">${S.qs.map((_,i)=>`<span class="h ${i<S.bossFix?'on':''}">${i<S.bossFix?'🎁':'🏠'}</span>`).join('')}</span><span>送到 ${S.bossFix} / ${n} 家</span></div>`}
  return `<span class="sttitle">${ST[S.si].n}</span>`+S.qs.map((_,i)=>`<span class="dot ${i<S.qi?'f':i===S.qi?'c':''}"></span>`).join('');
}
function nextQ(){
  S.lock=false;S.wrong=0;
  if(S.qi>=S.qs.length){return S.mode==='team'?teamEnd():stationClear()}
  const q=S.qs[S.qi];S.q=q;
  $('#gprog').innerHTML=progHTML();
  if(q.spell)return renderSpell(q);
  $('#gins').textContent=q.insS;
  $('#gdisp').innerHTML=q.disp();
  const g=$('#gopts');g.className=q.kind==='txt'?'txt':'';
  g.innerHTML=q.opts.map((o,i)=>`<div class="opt ${q.kind}" role="button" tabindex="0" data-i="${i}"><span class="in">${o.html}</span>${o.say?'<span class="ear" data-ear="'+i+'">聽</span>':''}</div>`).join('');
  checkFit();
  if(S.mode==='team'){const t=S.teams[S.turn];$('#gins').innerHTML=`<span style="color:${t.c}">${t.n}</span> 回答：${q.insS}`;talk([Z(t.n+'回答'),W(200)].concat(qSeq(q,true)))}
  else talk(qSeq(q,true));
}
function optEl(i){return document.querySelector('#gopts .opt[data-i="'+i+'"]')}
function qSeq(q,withIns){
  const s=[];
  if(withIns){const long=!S.seen[q.key];S.seen[q.key]=1;s.push(Z(long?q.ins:q.insS,{ins:true}),W(200))}
  if(q.ask)s.push(Z(q.ask),W(200));
  (q.askEn||[]).forEach(x=>s.push(x));
  if(q.auto){s.push(W(350));q.opts.forEach((o,i)=>{if(o.say)s.push(E(o.say,{hl:()=>optEl(i)}),W(380))})}
  return s;
}
function againQ(){if(S.inCards)return playCard();const q=S.q;if(!q)return;if(q.spell)return spellSay(true);talk(qSeq(q,false))}
$('#again').onclick=againQ;
$('#gopts').addEventListener('click',e=>{
  const ear=e.target.closest('.ear');
  if(ear){e.stopPropagation();const o=S.q.opts[+ear.dataset.ear];if(o&&o.say)talk([E(o.say)]);return}
  const el=e.target.closest('.opt');if(!el)return;answer(+el.dataset.i,el);
});
$('#gopts').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('.opt');if(el){e.preventDefault();answer(+el.dataset.i,el)}}});
function answer(i,el){
  if(S.lock||S.paused)return;const q=S.q,o=q.opts[i];
  if(S.mode==='team')return teamAnswer(o,el);
  if(o.ok){
    S.lock=true;stopTalk();if(!S.wrong){S.stars++;updStars()}
    el.classList.add('right');if(q.onOk)q.onOk();cheer();
    if(S.boss){S.bossFix++;$('#gprog').innerHTML=progHTML()}
    setTimeout(()=>{S.qi++;nextQ()},1300);
  }else{
    S.wrong++;S.lock=true;stopTalk();SFX.no();el.classList.add('dim');
    if(S.wrong>=2){const k=q.opts.findIndex(x=>x.ok);optEl(k).classList.add('hint')}
    setTimeout(()=>{S.lock=false},1200);
    talk([Z('再聽一次',{ins:true}),W(200)].concat(qSeq(q,false)));
  }
}

/* ---------- snowball spelling ---------- */
function renderSpell(q){
  const word=q.w,letters=word.split('');
  const lower=letters.map(c=>c.toLowerCase());
  const pool='bcdfghjklmpquvxyz'.split('').filter(c=>lower.indexOf(c)<0);
  const balls=shuffle(letters.concat(pick(pool,word.length>4?2:3)));
  S.sp={word,letters,idx:0,wrong:0,anyWrong:false};
  const pk={star:'star',tree:'tree',Santa:'santa',snowman:'snowman'}[word];
  $('#gins').textContent='點雪球，把字母一個一個放進格子';
  $('#gopts').className='';$('#gopts').innerHTML='';
  $('#gdisp').innerHTML=`<div class="spell"><div class="spelltop">${P[pk]}<div class="slots" id="slots">${letters.map(()=>'<span></span>').join('')}</div></div>
    <div class="balls" id="balls">${balls.map(c=>`<div class="ball" role="button" tabindex="0" data-c="${c}">${c}</div>`).join('')}</div></div>`;
  checkFit();spellSay(false,true);
}
function spellSay(again,first){
  const c=S.sp;if(!c)return;const need=c.letters[c.idx];const seq=[];
  if(first){const long=!S.seen.spell;S.seen.spell=1;seq.push(Z(long?'看圖，用雪球拼出這個英文。點一下雪球，字母就會滾進格子裡。':'拼出這個英文',{ins:true}),W(250))}
  if(first||again){seq.push(E(c.word),W(300),Z(SPZ[c.word][1]),W(300));seq.push(...spell(c.word));seq.push(E(c.word),W(400))}
  if(need)seq.push(Z(c.idx===0?'請點':'下一個，請點',{ins:true}),E(LT(need)));
  talk(seq);
}
$('#gdisp').addEventListener('click',e=>{const b=e.target.closest('.ball');if(b)tapBall(b)});
$('#gdisp').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const b=e.target.closest('.ball');if(b){e.preventDefault();tapBall(b)}}});
function tapBall(b){
  const c=S.sp;if(S.lock||S.paused||!c||b.classList.contains('gone'))return;
  const need=c.letters[c.idx];
  if(b.dataset.c!==need){
    S.lock=true;c.wrong++;c.anyWrong=true;stopTalk();SFX.no();b.classList.add('dim');setTimeout(()=>b.classList.remove('dim'),900);
    if(c.wrong>=2)document.querySelectorAll('#balls .ball').forEach(x=>{if(x.dataset.c===need&&!x.classList.contains('gone'))x.classList.add('hint')});
    talk([Z('不是這個，請點',{ins:true}),E(LT(need))]);
    setTimeout(()=>{S.lock=false},1000);return;
  }
  S.lock=true;stopTalk();tone(880,.1,'sine',0,.12);
  const slot=document.querySelectorAll('#slots span')[c.idx];
  const r=b.getBoundingClientRect(),s=slot.getBoundingClientRect();
  b.style.transform=`translate(${s.left-r.left+(s.width-r.width)/2}px,${s.top-r.top+(s.height-r.height)/2}px) rotate(360deg) scale(.6)`;
  setTimeout(()=>{
    b.classList.add('gone');document.querySelectorAll('#balls .ball.hint').forEach(x=>x.classList.remove('hint'));
    slot.textContent=need;slot.classList.add('f');
    tone(600+c.idx*120,.15,'triangle',0,.15);
    c.idx++;c.wrong=0;
    if(c.idx>=c.letters.length){if(!c.anyWrong){S.stars++;updStars()}cheer();setTimeout(()=>{S.qi++;nextQ()},1500)}
    else{S.lock=false;spellSay(false,false)}
  },600);
}

/* ---------- station clear ---------- */

  if(firstTime){r.shelf.push(S.si);saveDB()}
  const nx=nextStation();const last=nx<0;const boss=!!st.boss;
  const pic=boss?P.star:P.gift(st.gift);
  $('#clBox').innerHTML=`<div class="ovt">${boss?'禮物全部送完了！':'禮物送到了！'}</div><div class="ovpic">${pic}</div>
   <div class="ovs">${boss?'聖誕樹頂端亮起一顆大星星！':firstTime?'你的聖誕樹多了一顆裝飾球！':'再玩一次，好棒！'}<br>⭐ ${S.stars}</div>
   <div class="ovbtns">${last?'':'<button class="go" id="clNext">下一家</button>'}<button id="clMap">回地圖</button></div>`;
  $('#clear').hidden=false;SFX.jingle();burst('fire',true);setTimeout(()=>burst('flakes',true),600);
  talk(boss?[Z('哇！禮物全部送完了！'),E('Merry Christmas!'),E('Ho, ho, ho!')]:[Z(firstTime?'禮物送到了！你的聖誕樹多了一顆裝飾球。':'禮物送到了！'),E('Merry Christmas!')]);
  let n=6;const go=()=>{clearTimeout(S.autoT);$('#clear').hidden=true;startStation(nx>=0?nx:0)};
  if(!last){const btn=$('#clNext');const tick=()=>{if(S.paused)return;btn.textContent='下一家（'+n+'）';if(n--<=0){go();return}S.autoT=setTimeout(tick,1000)};tick();btn.onclick=go}
  $('#clMap').onclick=()=>{clearTimeout(S.autoT);$('#clear').hidden=true;openMap()};
}

/* ---------- team mode ---------- */
const TEAMC=[['紅隊','#D7263D'],['綠隊','#1E9E5A'],['藍隊','#3E7BEA'],['黃隊','#F2B705']];
function teamSetup(){
  $('#clBox').innerHTML=`<div class="ovt" style="color:var(--green)">小組競賽</div><div class="ovs">有幾隊要比賽？</div><div class="ovbtns teamsel"><button data-n="2">2 隊</button><button data-n="3">3 隊</button><button data-n="4">4 隊</button></div><div class="ovbtns"><button id="tmBack">回首頁</button></div>`;
  $('#clear').hidden=false;
  talk([Z('小組競賽！老師請選有幾隊要比賽。每一隊輪流回答，答對的隊伍得一分。',{ins:true})]);
  $('#clBox').querySelector('.teamsel').onclick=e=>{const b=e.target.closest('button');if(!b)return;startTeam(+b.dataset.n)};
  $('#tmBack').onclick=()=>{$('#clear').hidden=true;openHome()};
}
function startTeam(n){
  $('#clear').hidden=true;S.mode='team';S.teams=TEAMC.slice(0,n).map(t=>({n:t[0],c:t[1],s:0}));S.turn=0;S.qi=0;S.boss=false;S.seen={};
  S.qs=shuffle([].concat(listenQs(Math.min(5,n+1)),readQs(n),countQs(n),sceneQs(n),reviewQs(n))).slice(0,n*4);show('game');restoreFoot();nextQ();
}
function teamBar(){return `<div class="teams">${S.teams.map((t,i)=>`<span class="team ${i===S.turn?'cur':''}" style="border-color:${t.c}"><span style="width:14px;height:14px;border-radius:50%;background:${t.c};border:2px solid #1C2440"></span>${t.n}<span class="sc2">${t.s}</span></span>`).join('')}</div>`}
function teamAnswer(o,el){
  S.lock=true;stopTalk();const t=S.teams[S.turn];
  if(o.ok){t.s++;el.classList.add('right');if(S.q.onOk)S.q.onOk();cheer()}
  else{SFX.no();el.classList.add('dim');const k=S.q.opts.findIndex(x=>x.ok);optEl(k).classList.add('right');const ok=S.q.opts[k];if(ok.say)talk([Z('答案是',{ins:true}),E(ok.say)])}
  $('#gprog').innerHTML=teamBar();
  setTimeout(()=>{S.turn=(S.turn+1)%S.teams.length;S.qi++;nextQ()},o.ok?1400:2600);
}
function teamEnd(){
  stopTalk();const rank=S.teams.slice().sort((a,b)=>b.s-a.s);const top=rank[0].s;const winners=rank.filter(t=>t.s===top).map(t=>t.n);
  $('#clBox').innerHTML=`<div class="ovt">比賽結束！</div><div class="ovpic">${P.star}</div><div class="ovs">冠軍：${winners.join('、')}</div><div class="podium">${rank.map(t=>`<div style="border-color:${t.c}"><span>${t.n}</span><span class="en">${t.s} 分</span></div>`).join('')}</div><div class="ovbtns"><button class="go" id="tmAgain">再比一次</button><button id="tmHome">回首頁</button></div>`;
  $('#clear').hidden=false;SFX.fanfare();burst('fire',true);burst('flakes',true);
  talk([Z('比賽結束！冠軍是'+winners.join('和')+'！大家都很棒！'),E('Merry Christmas!')]);
  $('#tmAgain').onclick=()=>startTeam(S.teams.length);
  $('#tmHome').onclick=()=>{$('#clear').hidden=true;openHome()};
}

/* ---------- 開始 ---------- */
(function(){const B=bootParams();
  if(B.nm!==null&&B.nm!==undefined){$('#nameIn').value=B.nm.slice(0,10);}
  if(B.av!==null&&B.av!==undefined&&CHARS[+B.av])S.char=+B.av;
  /* 已經試過跳到瀏覽器，卻還留在 LINE 裡：Android 直接叫 Chrome 打開；iPhone 告訴大人怎麼做 */
  if(B.failed){show('splash');if(/Android/i.test(XUA))toChrome(B.url);else extHelp(B.url);return;}
  /* 從 LINE 換過來的：不再顯示封面，直接到地圖。手機允許的話馬上出聲；不允許的話，第一次點畫面就會出聲 */
  if(B.go==='start'&&!XLINE){needUnlock=true;readName();S.stars=0;updStars();S.seen={};openMap();return;}
  show('splash');})();
})();
</script>
