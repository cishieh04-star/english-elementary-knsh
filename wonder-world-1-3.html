<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B&amp;J 玩具工廠大冒險</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen toy-factory app — top control bar, then a full-height stage; nothing should need scrolling */
:root{
  --bg:#DFF3EE; --panel:#FFFFFF; --ink:#1F2A44; --soft:#5B6782;
  --belt:#2F3B52; --red:#FF5A4E; --yellow:#FFC93C; --blue:#3D8BFF; --green:#2BB673; --pink:#FF7AB6;
  --line:#BFD8D2;
  --f-en:"Baloo 2","Arial Rounded MT Bold",Arial,sans-serif;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-zh);overflow-x:hidden;
  background-image:radial-gradient(circle at 12% 18%,#ffffff88 0 40px,transparent 41px),radial-gradient(circle at 88% 80%,#ffffff66 0 60px,transparent 61px)}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,.opt:focus-visible,.ball:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px;box-sizing:border-box;gap:6px}
.en{font-family:var(--f-en)}

/* top bar */
#topbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
#topbar button,#topbar .chip{border:2px solid var(--ink);background:var(--panel);border-radius:12px;padding:5px 10px;font-size:clamp(13px,3.4vmin,16px);font-weight:700;line-height:1.2}
#tbBack{background:var(--yellow)!important}
#tbStar{background:var(--ink)!important;color:#fff;border-color:var(--ink)!important;min-width:64px;text-align:center}
#tbVoice.off{background:#FFE0DD!important}
#tbPause{background:#FFD6A5!important}
#pauseOv{z-index:40}
#pauseOv .ovt{color:var(--blue)}

#view{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;min-height:0}

/* splash */
#splash{align-items:center;justify-content:center;text-align:center;gap:18px}
.logo{font-family:var(--f-en);font-weight:800;font-size:clamp(40px,11vmin,96px);line-height:.9;color:var(--ink);letter-spacing:-1px}
.logo span{display:inline-block;background:var(--red);color:#fff;padding:0 .18em;border-radius:.18em;transform:rotate(-4deg)}
.logo small{display:block;font-family:var(--f-zh);font-size:.36em;font-weight:900;margin-top:.35em;letter-spacing:2px}
.bigbtn{border:3px solid var(--ink);background:var(--green);color:#fff;font-weight:900;font-size:clamp(22px,6vmin,40px);padding:.45em 1.4em;border-radius:22px;box-shadow:0 6px 0 var(--ink)}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.splash-toys{display:flex;gap:2vmin}
.splash-toys .pic{width:clamp(48px,12vmin,96px);height:auto;animation:bob 2.4s ease-in-out infinite}
.splash-toys .pic:nth-child(2){animation-delay:.3s}.splash-toys .pic:nth-child(3){animation-delay:.6s}.splash-toys .pic:nth-child(4){animation-delay:.9s}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
.linebar{background:#FFF1C9;border:2px dashed var(--ink);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;max-width:520px}
.linebar a{display:inline-block;margin-top:6px;background:var(--blue);color:#fff;padding:6px 14px;border-radius:10px;text-decoration:none}

/* home */
#home{align-items:center;justify-content:center}
.homecard{background:var(--panel);border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:clamp(10px,2.5vmin,22px);width:min(100%,760px);display:grid;gap:clamp(6px,1.6vmin,14px);box-sizing:border-box;max-height:100%;overflow:auto}
.homecard h1{margin:0;text-align:center;font-family:var(--f-en);font-size:clamp(26px,6.5vmin,48px);line-height:1}
.homecard h1 small{display:block;font-family:var(--f-zh);font-size:.45em;color:var(--soft);font-weight:700;margin-top:4px}
.lbl{font-weight:900;font-size:clamp(15px,3.8vmin,20px)}
#nameIn{width:100%;box-sizing:border-box;font-size:clamp(18px,4.6vmin,26px);padding:8px 12px;border:3px solid var(--ink);border-radius:14px;font-family:var(--f-zh);font-weight:700}
#players{display:flex;flex-wrap:wrap;gap:6px}
#players button{border:2px solid var(--ink);background:#EAF6FF;border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
#chars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
#chars button{border:3px solid var(--line);background:#F7FBFA;border-radius:16px;padding:4px 0;display:flex;flex-direction:column;align-items:center;font-size:clamp(11px,2.6vmin,14px);font-weight:700}
#chars button b{font-size:clamp(28px,7vmin,46px);line-height:1.15;font-weight:400}
#chars button.on{border-color:var(--ink);background:var(--yellow);transform:translateY(-3px)}
.homebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.homebtns .bigbtn{font-size:clamp(20px,5.2vmin,32px)}
.bigbtn.alt{background:var(--blue)}
@media (max-aspect-ratio:1/1){ #chars{grid-template-columns:repeat(4,1fr)} }

/* map */
#map{gap:6px}
.maphead{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:clamp(16px,4.2vmin,26px)}
.maphead b{font-size:1.5em;font-weight:400}
#tiles{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(6px,1.5vmin,12px);
  background:repeating-linear-gradient(90deg,var(--belt) 0 18px,#3c4a64 18px 36px);border-radius:20px;padding:clamp(6px,1.5vmin,12px);border:3px solid var(--ink)}
.tile{position:relative;border:3px solid var(--ink);border-radius:16px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;min-height:0;overflow:hidden;text-align:center}
.tile .num{position:absolute;top:4px;left:6px;font-family:var(--f-en);font-weight:800;font-size:clamp(14px,3.4vmin,20px);color:var(--soft)}
.tile .ic{font-size:clamp(24px,6.5vmin,48px);line-height:1}
.tile .nm{font-weight:900;font-size:clamp(13px,3.3vmin,20px);line-height:1.15}
.tile .sb{font-size:clamp(11px,2.6vmin,14px);color:var(--soft);font-weight:700}
.tile.done{background:#E6F8EE}
.tile.done .got{position:absolute;right:4px;top:4px;width:clamp(22px,5.5vmin,40px)}
.tile.next{background:#FFF4C7;animation:glow 1.3s ease-in-out infinite}
.tile.boss{background:#FFE3E0}
.tile .me{position:absolute;bottom:2px;right:6px;font-size:clamp(22px,5.5vmin,40px);animation:bob 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px var(--yellow)}}
.shelf{display:flex;align-items:center;gap:6px;justify-content:center;background:#8A4B2A;border:3px solid var(--ink);border-radius:14px;padding:4px 8px;color:#fff;font-weight:900;font-size:clamp(12px,3vmin,16px)}
.shelf .slot{width:clamp(28px,7vmin,48px);height:clamp(28px,7vmin,48px);border-radius:10px;background:#A86A42;display:grid;place-items:center;border:2px dashed #E9C9A8;color:#E9C9A8;font-family:var(--f-en)}
.shelf .slot .pic{width:90%;height:90%}
.shelf .slot.have{border-style:solid;background:#FFF7E8}

/* game */
#gprog{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap;min-height:20px}
.dot{width:clamp(12px,2.8vmin,18px);height:clamp(12px,2.8vmin,18px);border-radius:50%;border:2px solid var(--ink);background:var(--panel)}
.dot.f{background:var(--green)}.dot.c{background:var(--yellow);transform:scale(1.25)}
.sttitle{font-weight:900;font-size:clamp(13px,3.2vmin,17px);color:var(--soft);margin-right:6px}
#gins{text-align:center;font-weight:900;font-size:clamp(16px,4.2vmin,24px);line-height:1.25;min-height:1.25em}
#gdisp{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#gopts{display:flex;gap:clamp(8px,2vmin,16px);justify-content:center;align-items:stretch}
#gopts.txt{flex-direction:column;align-items:center}
@media (min-aspect-ratio:4/3){ #gopts.txt{flex-direction:row} }
.gfoot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.gfoot button{border:3px solid var(--ink);background:var(--panel);border-radius:14px;padding:6px 16px;font-weight:900;font-size:clamp(15px,3.8vmin,20px);box-shadow:0 4px 0 var(--ink)}
.gfoot button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#again{background:#EAF6FF}

/* capsule options */
.opt{position:relative;border:3px solid var(--ink);border-radius:26px 26px 18px 18px;background:var(--panel);box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:pointer;transition:transform .12s,opacity .2s}
.opt::before{content:"";position:absolute;left:0;right:0;top:0;height:34%;background:var(--cap,var(--red));opacity:.9;border-bottom:3px solid var(--ink)}
.opt:nth-child(1){--cap:var(--red)}.opt:nth-child(2){--cap:var(--blue)}.opt:nth-child(3){--cap:var(--green)}.opt:nth-child(4){--cap:var(--pink)}
.opt .in{position:relative;z-index:1;display:flex;align-items:center;justify-content:center}
.opt.pic{width:clamp(90px,27vmin,210px);aspect-ratio:1/1;max-width:31vw}
.opt.pic .in{width:100%;height:100%;padding:24% 12% 8%;box-sizing:border-box}
.opt.pic .pic{width:100%;height:100%}
.opt.let{width:clamp(80px,22vmin,170px);aspect-ratio:1/1.05;max-width:30vw}
.opt.let .in{font-family:var(--f-en);font-weight:800;font-size:clamp(44px,13vmin,100px);line-height:1;padding-top:20%}
.opt.txt{min-width:min(78vw,240px);padding:22px 22px 8px}
.opt.txt::before{height:14px}
.opt.txt .in{font-family:var(--f-en);font-weight:800;font-size:clamp(20px,5.2vmin,34px);line-height:1.1}
.opt .ear{position:absolute;z-index:2;right:6px;top:4px;font-size:13px;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 7px;line-height:1.5}
.opt.hl{transform:translateY(-6px) scale(1.04);box-shadow:0 10px 0 var(--ink)}
.opt.dim{opacity:.4}
.opt.right{background:#D7F7E4;transform:scale(1.08)}
.opt.hint{animation:hint 1s ease-in-out infinite}
.opt.hint::after{content:"👇";position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:28px;z-index:3}
@keyframes hint{50%{box-shadow:0 0 0 7px var(--yellow),0 5px 0 var(--ink)}}
.opt:active{transform:translateY(3px)}

/* displays */
.pic{display:block}
.dispwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;height:100%;width:100%}
.bigpic{height:min(100%,38vmin);width:auto;max-width:80%}
.word{font-family:var(--f-en);font-weight:800;font-size:clamp(34px,10vmin,84px);line-height:1;letter-spacing:2px}
.blank{display:inline-block;min-width:.7em;border-bottom:6px solid var(--red);color:var(--red);text-align:center}
.sent{font-family:var(--f-en);font-weight:800;font-size:clamp(26px,7vmin,56px);line-height:1.15;text-align:center;background:var(--panel);border:3px solid var(--ink);border-radius:20px;padding:.25em .7em}
.sent small{display:block;font-size:.8em}
.zhmean{font-weight:900;font-size:clamp(18px,5vmin,32px);color:var(--soft)}

/* gacha */
.gacha{display:flex;flex-direction:column;align-items:center;height:100%;max-height:44vmin;aspect-ratio:3/4}
.gglobe{flex:1.2;width:100%;border:4px solid var(--ink);border-radius:50% 50% 12px 12px;background:#E9F7FF;position:relative;overflow:hidden}
.gglobe i{position:absolute;width:24%;aspect-ratio:1;border-radius:50%;border:3px solid var(--ink)}
.gbody{flex:1;width:86%;background:var(--red);border:4px solid var(--ink);border-top:0;border-radius:0 0 16px 16px;display:flex;align-items:center;justify-content:center}
.gout{width:52%;aspect-ratio:1;border-radius:50%;background:var(--panel);border:4px solid var(--ink);display:grid;place-items:center;font-family:var(--f-en);font-weight:800;font-size:clamp(30px,8vmin,64px);color:var(--soft)}
.gout.pop{animation:pop .5s;color:var(--ink);background:var(--yellow)}
@keyframes pop{0%{transform:scale(.2) rotate(-90deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

/* printer */
.printer{height:100%;max-height:46vmin;aspect-ratio:1/1;border:4px solid var(--ink);border-radius:18px;background:var(--blue);display:flex;flex-direction:column;padding:4%;box-sizing:border-box;gap:4%}
.pwin{flex:1;background:#EAF6FF;border:4px solid var(--ink);border-radius:10px;position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.nozzle{position:absolute;top:0;left:50%;width:18%;height:22%;background:var(--ink);border-radius:0 0 30% 30%;transform:translateX(-50%);animation:noz 1.2s ease-in-out infinite}
@keyframes noz{0%,100%{left:30%}50%{left:70%}}
.pbed{width:70%;height:62%;display:grid;place-items:center;font-family:var(--f-en);font-weight:800;font-size:clamp(30px,9vmin,70px);color:var(--soft)}
.pbed .pic{width:100%;height:100%;animation:printin .7s steps(6)}
@keyframes printin{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.pctrl{height:14%;display:flex;gap:6%;align-items:center;justify-content:center}
.pctrl i{width:10%;aspect-ratio:1;border-radius:50%;background:var(--yellow);border:3px solid var(--ink)}

/* label maker */
.box{position:relative;height:100%;max-height:44vmin;aspect-ratio:1/1;background:#E8B57A;border:4px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center}
.box .pic{width:72%;height:72%}
.box .label{position:absolute;bottom:-6%;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--panel);border:3px solid var(--ink);border-radius:8px;padding:2px 14px;font-family:var(--f-en);font-weight:800;font-size:clamp(20px,5.5vmin,40px);white-space:nowrap}

/* conveyor */
.conv{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:100%}
.conv .pic{height:min(60%,30vmin);width:auto;animation:slide .8s ease-out}
.belt{width:min(90%,520px);height:clamp(16px,4vmin,26px);border:3px solid var(--ink);border-radius:999px;background:repeating-linear-gradient(90deg,var(--belt) 0 14px,#5d6b85 14px 28px);animation:beltmove 1s linear infinite}
@keyframes beltmove{to{background-position:28px 0}}
@keyframes slide{from{transform:translateX(-60vw)}}

/* this / that scene */
.tt{position:relative;height:100%;max-height:48vmin;width:min(96%,560px);border:3px solid var(--ink);border-radius:20px;background:linear-gradient(#EAF6FF 0 62%,#F3E1C2 62%);overflow:hidden}
.tt .kid{position:absolute;left:4%;bottom:6%;font-size:clamp(54px,15vmin,120px);line-height:1}
.tt .hand{position:absolute;left:86%;top:30%;font-size:.5em}
.tt .toyN{position:absolute;left:44%;bottom:8%;height:48%}
.tt .toyN .pic,.tt .toyF .pic{height:100%;width:auto}
.tt .toyF{position:absolute;right:6%;top:8%;height:20%}
.tt .shelfline{position:absolute;right:3%;top:29%;width:22%;height:5px;background:#8A4B2A;border-radius:3px}
.tt .tag{position:absolute;font-weight:900;font-size:clamp(14px,3.6vmin,22px);background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:0 8px}
.tt .dash{position:absolute;left:30%;top:24%;width:44%;border-top:4px dashed var(--soft);transform:rotate(-14deg);transform-origin:left}

/* scenes */
.sc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vmin;height:100%;width:100%}
.scpic{display:flex;align-items:center;justify-content:center;gap:2vmin;font-size:clamp(46px,13vmin,100px);line-height:1;background:var(--panel);border:3px solid var(--ink);border-radius:20px;padding:1.5vmin 3vmin;max-width:100%;box-sizing:border-box}
.scpic .pic{height:1.1em;width:auto}
.bub{font-family:var(--f-en);font-size:clamp(18px,4.6vmin,30px);background:#FFF4C7;border:3px solid var(--ink);border-radius:16px;padding:2px 10px;white-space:nowrap;font-weight:800}
.cap{font-weight:900;font-size:clamp(18px,5vmin,30px);text-align:center}

/* learn card */
.lcard{background:var(--panel);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:3vmin;padding:2vmin 4vmin;height:100%;max-height:60vmin;box-sizing:border-box;max-width:100%}
.lcard .pic{height:min(100%,34vmin);width:auto}
.lcard .lw{display:flex;flex-direction:column;align-items:flex-start;gap:1vmin}
.lcard .word span{display:inline-block;transition:transform .15s,color .15s}
.lcard .word span.hl{color:var(--red);transform:translateY(-8px) scale(1.2)}
.lcard .word.hlw{color:var(--blue)}
@media (max-aspect-ratio:1/1){ .lcard{flex-direction:column;height:auto} .lcard .lw{align-items:center} }

/* claw machine */
.claw{display:flex;flex-direction:column;align-items:center;gap:1vmin;height:100%;width:100%}
.clawtop{display:flex;align-items:center;gap:3vmin}
.clawtop .pic{height:clamp(56px,15vmin,110px);width:auto}
.slots{display:flex;gap:6px}
.slots span{width:clamp(38px,9.5vmin,66px);height:clamp(44px,11vmin,76px);border:3px solid var(--ink);border-radius:12px;background:var(--panel);display:grid;place-items:center;font-family:var(--f-en);font-weight:800;font-size:clamp(28px,7.5vmin,54px)}
.slots span.f{background:var(--yellow);animation:pop .4s}
.slots span.dash{border-style:dashed;background:transparent}
.mach{position:relative;flex:1;min-height:0;width:min(96%,640px);border:4px solid var(--ink);border-radius:20px 20px 12px 12px;background:linear-gradient(#CFEFFF,#EAF8FF);overflow:hidden;box-shadow:inset 0 -10px 0 #9fd3ef}
.arm{position:absolute;top:0;left:50%;width:56px;transition:left .45s ease;z-index:3;pointer-events:none}
.rope{width:6px;height:14px;background:var(--ink);margin:0 auto;transition:height .4s ease}
.grab{width:56px;height:30px}
.balls{position:absolute;left:0;right:0;bottom:8px;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;gap:clamp(6px,1.6vmin,12px);padding:0 8px}
.ball{width:clamp(50px,12.5vmin,88px);aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-en);font-weight:800;font-size:clamp(28px,7.5vmin,52px);background:radial-gradient(circle at 30% 30%,#fff8 0 18%,transparent 19%),var(--bc);transition:transform .5s ease,opacity .3s;cursor:pointer;user-select:none;-webkit-user-select:none}
.ball.up{transform:translateY(var(--up)) scale(.8);opacity:0}
.ball.gone{visibility:hidden}
.ball.dim{opacity:.45}
.ball.hint{animation:hint 1s infinite}

/* boss + team bars */
.bossbar{display:flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(13px,3.3vmin,18px)}
.bossbar .pic{height:clamp(34px,8vmin,56px);width:auto;transition:filter .5s}
.bossbar .gear{font-size:clamp(14px,3.4vmin,20px);filter:grayscale(1);opacity:.5}
.bossbar .gear.on{filter:none;opacity:1}
.teams{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.team{border:3px solid var(--ink);border-radius:12px;padding:2px 10px;font-weight:900;font-size:clamp(13px,3.3vmin,18px);background:var(--panel);display:flex;align-items:center;gap:6px}
.team.cur{transform:scale(1.12);box-shadow:0 0 0 4px var(--yellow)}
.team .sc2{font-family:var(--f-en);font-size:1.2em}

/* overlays */
.ov{position:fixed;inset:0;background:#1F2A44cc;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.ovbox{background:var(--panel);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:clamp(14px,3vmin,28px);text-align:center;display:grid;gap:10px;justify-items:center;max-width:560px;width:100%;max-height:100%;overflow:auto;box-sizing:border-box}
.ovt{font-weight:900;font-size:clamp(28px,8vmin,54px);color:var(--red)}
.ovpic .pic{width:clamp(90px,26vmin,180px);height:auto;animation:pop .7s}
.ovs{font-weight:900;font-size:clamp(17px,4.4vmin,26px)}
.ovbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ovbtns button{border:3px solid var(--ink);border-radius:16px;padding:8px 18px;font-weight:900;font-size:clamp(17px,4.4vmin,24px);background:var(--panel);box-shadow:0 4px 0 var(--ink)}
.ovbtns button.go{background:var(--green);color:#fff}
.teamsel{display:flex;gap:10px}
.teamsel button{font-size:clamp(20px,5vmin,30px)!important;min-width:3.5em}
.podium{display:grid;gap:6px;width:100%}
.podium div{display:flex;justify-content:space-between;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:900;font-size:clamp(17px,4.4vmin,24px)}

#praise{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;font-family:var(--f-en);font-weight:800;font-size:clamp(40px,12vmin,96px);color:var(--yellow);-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink);opacity:0}
#praise.show{animation:praise 1.1s ease-out}
@keyframes praise{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:14}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;padding:8px 18px;border-radius:999px;z-index:30;opacity:0;transition:opacity .3s;font-size:16px}
#toast.show{opacity:1}
#fitHint{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--red);color:#fff;font-weight:900;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:16px;animation:bob 1.2s infinite}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>

<body>

<script>
(function(){

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- pictures (hand-drawn SVG so every phone shows them) ---------- */

 robot:SV(`<line x1="50" y1="6" x2="50" y2="18" ${K}/><circle cx="50" cy="6" r="4" fill="#FF5A4E"/><rect x="18" y="56" width="10" height="22" rx="5" fill="#9DB4D0" ${K}/><rect x="72" y="56" width="10" height="22" rx="5" fill="#9DB4D0" ${K}/><rect x="28" y="18" width="44" height="30" rx="8" fill="#9DB4D0" ${K}/><circle cx="41" cy="32" r="6" fill="#fff"/><circle cx="59" cy="32" r="6" fill="#fff"/><circle cx="41" cy="32" r="3" fill="#2BB673"/><circle cx="59" cy="32" r="3" fill="#2BB673"/><rect x="40" y="40" width="20" height="4" rx="2" fill="#1F2A44"/><rect x="30" y="52" width="40" height="32" rx="6" fill="#6F87A8" ${K}/><path d="M50 76c-9-6-9-14-3.5-14 1.6 0 3.5 1 3.5 3 0-2 1.9-3 3.5-3 5.5 0 5.5 8-3.5 14z" fill="#FF5A4E"/><rect x="34" y="84" width="10" height="12" rx="3" fill="#1F2A44"/><rect x="56" y="84" width="10" height="12" rx="3" fill="#1F2A44"/>`),
 yoyo:SV(`<path d="M50 32V10" stroke="#1F2A44" stroke-width="2.5"/><circle cx="50" cy="7" r="4" fill="none" stroke="#1F2A44" stroke-width="2.5"/><circle cx="50" cy="62" r="30" fill="#FF4FA0" ${K}/><circle cx="50" cy="62" r="20" fill="none" stroke="#FFC0DC" stroke-width="4"/><circle cx="50" cy="62" r="8" fill="#fff" stroke="#1F2A44" stroke-width="2.5"/>`),
 pig:SV(`<path d="M24 32L28 12L44 26Z M76 32L72 12L56 26Z" fill="#FF9CC2" ${K} stroke-linejoin="round"/><circle cx="50" cy="54" r="34" fill="#FFB8D2" ${K}/><ellipse cx="50" cy="64" rx="15" ry="11" fill="#FF8CB8" ${K}/><circle cx="45" cy="64" r="3" fill="#1F2A44"/><circle cx="55" cy="64" r="3" fill="#1F2A44"/><circle cx="38" cy="44" r="3.5" fill="#1F2A44"/><circle cx="62" cy="44" r="3.5" fill="#1F2A44"/>`),
 pan:SV(`<rect x="62" y="48" width="36" height="10" rx="5" fill="#8A4B2A" ${K}/><circle cx="36" cy="53" r="32" fill="#4A5568" ${K}/><circle cx="36" cy="53" r="24" fill="#8C97A8"/><ellipse cx="28" cy="44" rx="8" ry="4" fill="#fff" opacity=".35"/>`),
 sun:SV(`${sunRays}<circle cx="50" cy="50" r="24" fill="#FFC93C" ${K}/><circle cx="42" cy="46" r="3" fill="#1F2A44"/><circle cx="58" cy="46" r="3" fill="#1F2A44"/><path d="M41 56Q50 64 59 56" stroke="#1F2A44" stroke-width="3" fill="none" stroke-linecap="round"/>`),
 top:SV(`<rect x="46" y="6" width="8" height="16" rx="3" fill="#8A4B2A" stroke="#1F2A44" stroke-width="2.5"/><path d="M16 36Q50 14 84 36Q78 60 50 92Q22 60 16 36Z" fill="#E8A23A"/><path d="M19 44Q50 30 81 44" stroke="#FF5A4E" stroke-width="5" fill="none"/><path d="M27 58Q50 48 73 58" stroke="#3D8BFF" stroke-width="5" fill="none"/><path d="M16 36Q50 14 84 36Q78 60 50 92Q22 60 16 36Z" fill="none" ${K} stroke-linejoin="round"/>`),
 ten:SV(`<text x="50" y="74" text-anchor="middle" font-size="66" font-weight="800" font-family="Baloo 2,Arial,sans-serif" fill="#3D8BFF" stroke="#1F2A44" stroke-width="2.5">10</text>`),
 seven:SV(`<text x="50" y="80" text-anchor="middle" font-size="84" font-weight="800" font-family="Baloo 2,Arial,sans-serif" fill="#2BB673" stroke="#1F2A44" stroke-width="2.5">7</text>`),
 red:SV(`<path d="M50 14C66 14 84 24 84 44C84 56 76 60 78 70C80 82 70 88 62 82C56 78 52 88 44 86C34 84 38 74 30 72C18 70 14 58 18 46C22 28 34 14 50 14Z" fill="#FF3B30" ${K}/><ellipse cx="40" cy="34" rx="9" ry="5" fill="#fff" opacity=".45"/>`),
 hen:SV(`<path d="M80 52L94 38L90 64Z" fill="#fff" ${K} stroke-linejoin="round"/><ellipse cx="54" cy="60" rx="30" ry="24" fill="#fff" ${K}/><path d="M48 58Q58 70 70 58" stroke="#C9D3E3" stroke-width="4" fill="none"/><path d="M46 84V94M60 84V94" stroke="#FFA41B" stroke-width="4" stroke-linecap="round"/><path d="M24 26Q26 14 32 22Q35 12 40 26" fill="#FF3B30" stroke="#1F2A44" stroke-width="2"/><circle cx="32" cy="38" r="14" fill="#fff" ${K}/><path d="M18 37L8 41L18 44Z" fill="#FFA41B" stroke="#1F2A44" stroke-width="2"/><circle cx="28" cy="35" r="2.5" fill="#1F2A44"/>`),
 rabbit:SV(`<ellipse cx="38" cy="26" rx="8" ry="22" fill="#fff" ${K}/><ellipse cx="62" cy="26" rx="8" ry="22" fill="#fff" ${K}/><ellipse cx="38" cy="28" rx="3.5" ry="14" fill="#FFB8D2"/><ellipse cx="62" cy="28" rx="3.5" ry="14" fill="#FFB8D2"/><circle cx="50" cy="62" r="28" fill="#fff" ${K}/><circle cx="40" cy="58" r="3.5" fill="#1F2A44"/><circle cx="60" cy="58" r="3.5" fill="#1F2A44"/><path d="M46 68L50 72L54 68Z" fill="#FF8CB8"/><path d="M50 72V76M50 76Q45 80 42 77M50 76Q55 80 58 77" stroke="#1F2A44" stroke-width="2" fill="none"/>`),
 queen:SV(`<path d="M22 94Q24 60 50 58Q76 60 78 94Z" fill="#C8102E" ${K}/><circle cx="50" cy="46" r="17" fill="#FFD9BC" ${K}/><path d="M32 30L36 12L44 24L50 8L56 24L64 12L68 30Z" fill="#FFC93C" ${K} stroke-linejoin="round"/><circle cx="44" cy="47" r="2.4" fill="#1F2A44"/><circle cx="56" cy="47" r="2.4" fill="#1F2A44"/><path d="M45 53Q50 57 55 53" stroke="#1F2A44" stroke-width="2" fill="none"/>`),
 trophy:SV(`<path d="M30 20H16Q16 40 32 42M70 20H84Q84 40 68 42" ${K} fill="none"/><path d="M30 14H70V36Q70 58 50 60Q30 58 30 36Z" fill="#FFC93C" ${K}/><rect x="44" y="60" width="12" height="16" fill="#E8A23A" ${K}/><rect x="30" y="76" width="40" height="12" rx="3" fill="#8A4B2A" ${K}/><path d="M50 24l3 7h7l-6 4 2 7-6-4-6 4 2-7-6-4h7z" fill="#fff"/>`),
 claw:`<svg viewBox="0 0 56 30" class="grab" aria-hidden="true"><rect x="16" y="0" width="24" height="10" rx="4" fill="#9DB4D0" stroke="#1F2A44" stroke-width="2.5"/><path d="M20 10Q6 16 10 28M36 10Q50 16 46 28M28 10V24" stroke="#1F2A44" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`
};
const P=k=>PICS[k];

/* ---------- content from the lesson ---------- */
const TOYS={ball:{w:'ball',a:'a ball',zh:'皮球'},car:{w:'car',a:'a car',zh:'汽車'},doll:{w:'doll',a:'a doll',zh:'洋娃娃'},kite:{w:'kite',a:'a kite',zh:'風箏'},robot:{w:'robot',a:'a robot',zh:'機器人'},yoyo:{w:'yo-yo',a:'a yo-yo',zh:'溜溜球'}};
const TOYK=Object.keys(TOYS);
const PHON={top:{zh:'陀螺',d:['m','c']},pan:{zh:'平底鍋',d:['f','m']},sun:{zh:'太陽',d:['b','f']},hen:{zh:'母雞',d:['f','t']},ten:{zh:'十',d:['d','m']},pig:{zh:'豬',d:['b','d']},red:{zh:'紅色',d:['l','b']},rabbit:{zh:'兔子',d:['l','w']},queen:{zh:'皇后',d:['p','g']},seven:{zh:'七',d:['f','t']}};
const CONF={P:['B','R','D'],Q:['O','G','C'],R:['P','B','K'],S:['Z','C','X'],T:['F','I','L'],G:['C','Q','O'],p:['q','b','d'],q:['p','g','d'],r:['n','h','m'],s:['z','c','x'],t:['f','l','i']};
const CASEW=[['TEN',['ten','tem','fen']],['PIG',['pig','qig','piq']],['SUN',['sun','sum','nus']],['RED',['red','rad','bed']],['PAN',['pan','qan','nap']],['TOP',['top','tqp','lop']]];
const CHARS=[{e:'🤖',n:'小機器人'},{e:'🐻',n:'小熊'},{e:'🦖',n:'小恐龍'},{e:'🐰',n:'小兔子'},{e:'🐱',n:'小貓咪'},{e:'🐼',n:'熊貓'},{e:'🦊',n:'小狐狸'},{e:'🐸',n:'小青蛙'}];

/* ---------- state + storage ---------- */
const S={name:'',char:1,stars:0,voice:true,lock:false,seen:{},mode:'solo',screen:'splash'};
let DB={};
try{DB=JSON.parse(localStorage.getItem('bj3_players')||'{}')||{}}catch(e){DB={}}
const saveDB=()=>{try{localStorage.setItem('bj3_players',JSON.stringify(DB))}catch(e){}};
const me=()=>{const k=S.name||'小朋友';if(!DB[k])DB[k]={char:S.char,shelf:[]};return DB[k]};

/* ---------- speech ---------- */
const hasTTS='speechSynthesis' in window;
const T={tok:0,rate:0.85};
const E=(t,o)=>Object.assign({t,l:'en'},o||{});
const Z=(t,o)=>Object.assign({t,l:'zh'},o||{});
const W=ms=>({p:ms});
const LT=ch=>ch.toUpperCase()+'.';
const spell=w=>{const out=[];w.replace(/-/g,'').split('').forEach(c=>{out.push(E(LT(c)));out.push(W(260))});return out};
let hlEl=null;
function clearHL(){if(hlEl){hlEl.classList.remove('hl');hlEl=null}}
function stopTalk(){T.tok++;if(hasTTS){try{speechSynthesis.cancel()}catch(e){}}clearHL()}
function talk(items,done){
  if(S.paused)return;
  stopTalk();const tok=T.tok;let i=0;
  const step=()=>{
    if(tok!==T.tok)return;
    if(i>=items.length){clearHL();if(done)done();return}
    const it=items[i++];
    if(it.p){setTimeout(step,it.p/Math.max(.6,T.rate));return}
    if(it.ins&&!S.voice){step();return}
    clearHL();
    if(it.hl){const el=typeof it.hl==='function'?it.hl():it.hl;if(el){el.classList.add('hl');hlEl=el}}
    if(!hasTTS||!it.t){setTimeout(step,500);return}
    const u=new SpeechSynthesisUtterance(it.t);
    u.lang=it.l==='zh'?'zh-TW':'en-US';
    u.rate=it.l==='zh'?Math.min(1.25,T.rate*1.05+0.12):T.rate;
    let fin=false;
    const end=()=>{if(fin)return;fin=true;clearTimeout(to);if(tok!==T.tok)return;setTimeout(step,it.l==='zh'?140:300/Math.max(.6,T.rate))};
    u.onend=end;u.onerror=end;
    const to=setTimeout(end,2200+it.t.length*(it.l==='zh'?340:130)/u.rate);
    try{speechSynthesis.speak(u)}catch(e){end()}
  };
  setTimeout(step,70);
}

/* ---------- sound effects ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,when,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const t=a.currentTime+(when||0);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,when,freq,vol){const a=ac();if(!a)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||2000;const g=a.createGain();const t=a.currentTime+(when||0);g.gain.setValueAtTime(vol||.3,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f).connect(g).connect(a.destination);s.start(t)}
const SFX={
  chime(){const m=rnd([[523,659,784,1047],[587,740,880,1175],[659,784,988,1319],[392,523,659,784]]);m.forEach((f,i)=>tone(f,.25,'triangle',i*.08,.16))},
  clap(){for(let i=0;i<22;i++)noise(.06,i*.05+Math.random()*.03,1500+Math.random()*1500,.25)},
  boom(){noise(.5,0,600,.35);[0,.12,.22].forEach(t=>tone(1200+Math.random()*800,.12,'square',.25+t,.05))},
  bloop(){tone(330,.12,'sine',0,.2);tone(660,.18,'sine',.1,.18);tone(990,.2,'sine',.2,.14)},
  no(){tone(220,.18,'triangle',0,.14);tone(175,.25,'triangle',.16,.12)},
  grab(){tone(500,.08,'square',0,.06);tone(700,.08,'square',.1,.06)},
  fanfare(){[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',i*.13,.17))}
};

/* ---------- celebration canvas ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],fxOn=false;
const COLS=['#FF5A4E','#FFC93C','#3D8BFF','#2BB673','#FF7AB6'];
function fit(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener('resize',fit);fit();
function burst(mode,big){
  const W_=cv.width,H=cv.height,n=big?2:1;
  if(mode==='confetti')for(let i=0;i<90*n;i++)parts.push({k:'r',x:Math.random()*W_,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,c:rnd(COLS),life:200});
  if(mode==='fire')for(let b=0;b<2+n;b++){const ox=W_*(.2+Math.random()*.6),oy=H*(.15+Math.random()*.35);for(let i=0;i<40;i++){const a=Math.PI*2*i/40,s=2+Math.random()*3;parts.push({k:'c',x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:rnd(COLS),life:60+Math.random()*20,g:.05})}}
  if(mode==='stars')for(let i=0;i<26*n;i++)parts.push({k:'s',x:Math.random()*W_,y:H+20,vx:(Math.random()-.5)*1.5,vy:-(3+Math.random()*4),life:140,sz:18+Math.random()*22});
  if(mode==='balloon')for(let i=0;i<12*n;i++)parts.push({k:'b',x:Math.random()*W_,y:H+40+Math.random()*100,vx:(Math.random()-.5)*.6,vy:-(2+Math.random()*2),c:rnd(COLS),life:260,r:16+Math.random()*12});
  if(!fxOn){fxOn=true;requestAnimationFrame(loop)}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life-->0&&p.y<cv.height+80&&p.y>-200);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;if(p.g)p.vy+=p.g;
    if(p.k==='r'){cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.y/20+p.r);cx.fillRect(-5,-3,10,6);cx.restore()}
    else if(p.k==='c'){cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,3,0,7);cx.fill();cx.globalAlpha=1}
    else if(p.k==='s'){cx.font=p.sz+'px sans-serif';cx.fillText('⭐',p.x,p.y)}
    else if(p.k==='b'){cx.strokeStyle='#1F2A44';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(p.x,p.y+p.r*1.2);cx.lineTo(p.x+Math.sin(p.y/30)*6,p.y+p.r*1.2+30);cx.stroke();cx.fillStyle=p.c;cx.beginPath();cx.ellipse(p.x,p.y,p.r,p.r*1.2,0,0,7);cx.fill();cx.stroke()}}
  if(parts.length)requestAnimationFrame(loop);else{fxOn=false;cx.clearRect(0,0,cv.width,cv.height)}
}

/* ---------- station flow ---------- */
function startStation(i){
  stopTalk();S.mode='solo';S.si=i;S.qi=0;S.lock=false;S.boss=!!ST[i].boss;S.bossFix=0;
  show('game');restoreFoot();
  const play=qs=>{S.qs=qs;nextQ()};
  switch(i){
    case 0:runCards(toyCards(),'認識玩具',null);S.cardsDone=()=>stationClear();$('#cSkip').hidden=true;break;
    case 1:play(shuffle(letterQs(4).concat(caseQs(2))));break;
    case 2:runCards(phonCards(),'先認識',()=>play(phonQs(6)));break;
    case 3:play(listenQs(5));break;
    case 4:play(readQs(6));break;
    case 5:play(clawQs(4));break;
    case 6:runCards(ttCards(),'先認識',()=>play(ttQs(4)));break;
    case 7:runCards(scnCards(),'先認識',()=>play(sceneQs(6)));break;
    case 8:play(mixQs(8));break;
  }
}
function progHTML(){
  if(S.mode==='team')return teamBar();
  const st=ST[S.si];
  if(S.boss){return `<div class="bossbar"><span style="filter:grayscale(${1-S.bossFix/S.qs.length})">${P('robot')}</span>修好 ${S.bossFix}/${S.qs.length} ${S.qs.map((_,i)=>`<span class="gear ${i<S.bossFix?'on':''}">⚙️</span>`).join('')}</div>`}
  return `<span class="sttitle">${st.n}</span>`+S.qs.map((_,i)=>`<span class="dot ${i<S.qi?'f':i===S.qi?'c':''}"></span>`).join('');
}
function nextQ(){
  S.lock=false;S.wrong=0;
  if(S.qi>=S.qs.length){return S.mode==='team'?teamEnd():stationClear()}
  const q=S.qs[S.qi];S.q=q;
  $('#gprog').innerHTML=progHTML();
  if(q.claw)return renderClaw(q);
  $('#gins').textContent=q.insS;
  $('#gdisp').innerHTML=q.disp();
  const g=$('#gopts');g.className=q.kind==='txt'?'txt':'';
  g.innerHTML=q.opts.map((o,i)=>`<div class="opt ${q.kind}" role="button" tabindex="0" data-i="${i}"><span class="in">${o.html}</span>${o.say?'<span class="ear" data-ear="'+i+'">聽</span>':''}</div>`).join('');
  checkFit();
  if(S.mode!=='team')talk(qSeq(q,true));
}
function optEl(i){return document.querySelector('#gopts .opt[data-i="'+i+'"]')}
function qSeq(q,withIns){
  const s=[];
  if(withIns){const long=!S.seen[q.key];S.seen[q.key]=1;s.push(Z(long?q.ins:q.insS,{ins:true}),W(200))}
  if(q.ask)s.push(Z(q.ask),W(200));
  (q.askEn||[]).forEach(x=>s.push(x));
  if(q.auto){s.push(W(350));q.opts.forEach((o,i)=>{s.push(E(o.say,{hl:()=>optEl(i)}),W(380))})}
  return s;
}
function againQ(){if(S.inCards)return playCard();const q=S.q;if(!q)return;if(q.claw)return clawSay(true);talk(qSeq(q,false))}
$('#again').onclick=againQ;
$('#gopts').addEventListener('click',e=>{
  const ear=e.target.closest('.ear');
  if(ear){e.stopPropagation();const o=S.q.opts[+ear.dataset.ear];if(o&&o.say)talk([E(o.say)]);return}
  const el=e.target.closest('.opt');if(!el)return;answer(+el.dataset.i,el);
});
$('#gopts').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('.opt');if(el){e.preventDefault();answer(+el.dataset.i,el)}}});
function answer(i,el){
  if(S.lock)return;const q=S.q,o=q.opts[i];
  if(S.mode==='team')return teamAnswer(o,el);
  if(o.ok){
    S.lock=true;stopTalk();if(!S.wrong){S.stars++;updStars()}
    el.classList.add('right');if(q.onOk)q.onOk();cheer();
    if(S.boss){S.bossFix++;$('#gprog').innerHTML=progHTML()}
    setTimeout(()=>{S.qi++;nextQ()},1300);
  }else{
    S.wrong++;S.lock=true;stopTalk();SFX.no();el.classList.add('dim');
    if(S.wrong>=2){const k=q.opts.findIndex(x=>x.ok);optEl(k).classList.add('hint')}
    setTimeout(()=>{S.lock=false},1200);
    const seq=[Z('再聽一次',{ins:true}),W(200)].concat(qSeq(q,false));
    talk(seq);
  }
}

/* ---------- claw machine ---------- */
const BALLC=['#FF8A80','#FFD966','#7FB5FF','#7EDDA8','#FFA8D2','#C9B6FF','#FFB870'];
function renderClaw(q){
  const t=TOYS[q.k],word=t.w,letters=word.replace(/-/g,'').split('');
  const pool='bcdefghijklmnpqrstuvwxyz'.split('').filter(c=>letters.indexOf(c)<0);
  const balls=shuffle(letters.concat(pick(pool,word.length>4?2:3)));
  S.cl={word,letters,idx:0,wrong:0,anyWrong:false,k:q.k};
  $('#gins').textContent='用夾娃娃機，把字母一個一個夾出來';
  $('#gopts').className='';$('#gopts').innerHTML='';
  $('#gdisp').innerHTML=`<div class="claw"><div class="clawtop">${P(q.k)}<div class="slots" id="slots">${word.split('').map(c=>c==='-'?'<span class="dash">-</span>':'<span></span>').join('')}</div></div>
   <div class="mach" id="mach"><div class="arm" id="arm"><div class="rope" id="rope"></div>${PICS.claw}</div><div class="balls" id="balls">${balls.map((c,i)=>`<div class="ball" role="button" tabindex="0" data-c="${c}" style="--bc:${BALLC[i%BALLC.length]}">${c}</div>`).join('')}</div></div></div>`;
  checkFit();
  clawSay(false,true);
}
function clawSay(again,first){
  const c=S.cl;if(!c)return;const need=c.letters[c.idx];const seq=[];
  if(first){const long=!S.seen.claw;S.seen.claw=1;seq.push(Z(long?'看圖，用夾娃娃機拼出這個英文。點一下字母球，夾子就會去夾。':'拼出這個英文',{ins:true}),W(250))}
  if(first||again){seq.push(E(c.word),W(300),Z(TOYS[c.k].zh),W(300));seq.push(...spell(c.word));seq.push(E(c.word),W(400))}
  if(need){seq.push(Z(c.idx===0?'請夾':'下一個，請夾',{ins:true}),E(LT(need)))}
  talk(seq);
}
$('#gdisp').addEventListener('click',e=>{const b=e.target.closest('.ball');if(b)grab(b)});
$('#gdisp').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const b=e.target.closest('.ball');if(b){e.preventDefault();grab(b)}}});
function grab(b){
  const c=S.cl;if(S.lock||!c||b.classList.contains('gone'))return;
  const need=c.letters[c.idx];
  if(S.mode==='team')return;
  if(b.dataset.c!==need){
    S.lock=true;c.wrong++;c.anyWrong=true;stopTalk();SFX.no();b.classList.add('dim');setTimeout(()=>b.classList.remove('dim'),900);
    if(c.wrong>=2)document.querySelectorAll('#balls .ball').forEach(x=>{if(x.dataset.c===need&&!x.classList.contains('gone'))x.classList.add('hint')});
    talk([Z('不是這個，請夾',{ins:true}),E(LT(need))]);
    setTimeout(()=>{S.lock=false},1000);return;
  }
  S.lock=true;stopTalk();SFX.grab();
  const m=$('#mach').getBoundingClientRect(),r=b.getBoundingClientRect(),arm=$('#arm'),rope=$('#rope');
  arm.style.left=(r.left-m.left+r.width/2-28)+'px';
  const drop=Math.max(14,r.top-m.top-24);
  setTimeout(()=>{rope.style.height=drop+'px'},460);
  setTimeout(()=>{b.style.setProperty('--up',(-(r.top-m.top)+10)+'px');b.classList.add('up');rope.style.height='14px'},900);
  setTimeout(()=>{
    b.classList.add('gone');b.classList.remove('hint');
    document.querySelectorAll('#balls .ball.hint').forEach(x=>x.classList.remove('hint'));
    const slots=[...document.querySelectorAll('#slots span:not(.dash)')];const s=slots[c.idx];s.textContent=need;s.classList.add('f');
    tone(600+c.idx*120,.15,'triangle',0,.15);
    c.idx++;c.wrong=0;
    if(c.idx>=c.letters.length){
      if(!c.anyWrong){S.stars++;updStars()}
      cheer();if(S.boss){S.bossFix++}
      setTimeout(()=>{S.qi++;nextQ()},1500);
    }else{S.lock=false;clawSay(false,false)}
  },1450);
}

/* ---------- station clear ---------- */
function stationClear(){
  stopTalk();const st=ST[S.si],r=me();const firstTime=r.shelf.indexOf(S.si)<0;
  if(firstTime){r.shelf.push(S.si);saveDB()}
  const nx=nextStation();const last=nx<0;
  const prizeName={ball:['a ball','皮球'],yoyo:['a yo-yo','溜溜球'],top:['a top','陀螺'],robot:['a robot','機器人'],doll:['a doll','洋娃娃'],kite:['a kite','風箏'],car:['a car','汽車'],rabbit:['a rabbit','兔子'],trophy:['a trophy','獎盃']}[st.prize];
  $('#clBox').innerHTML=`<div class="ovt">${st.boss?'大機器人修好了！':'過關了！'}</div><div class="ovpic">${P(st.prize)}</div>
   <div class="ovs">${firstTime?'玩具櫃多了一個：':'再玩一次，好棒！'}<span class="en">${prizeName[0]}</span> ${prizeName[1]}<br>⭐ ${S.stars}</div>
   <div class="ovbtns">${last?'':'<button class="go" id="clNext">下一關</button>'}<button id="clMap">回地圖</button></div>`;
  $('#clear').hidden=false;SFX.fanfare();burst('fire',true);setTimeout(()=>burst('confetti',true),600);
  talk([Z(st.boss?'哇！大機器人修好了！你全部過關了！':(firstTime?'過關了！你得到一個新玩具':'過關了！')),E(prizeName[0])]);
  let n=6;const go=()=>{clearTimeout(S.autoT);$('#clear').hidden=true;startStation(S.si+1<ST.length?(nx>=0?nx:S.si+1):0)};
  if(!last){
    const btn=$('#clNext');const tick=()=>{btn.textContent='下一關（'+n+'）';if(n--<=0){go();return}S.autoT=setTimeout(tick,1000)};tick();
    btn.onclick=go;
  }
  $('#clMap').onclick=()=>{clearTimeout(S.autoT);$('#clear').hidden=true;openMap()};
}

/* ---------- team mode ---------- */
const TEAMC=[['紅隊','#FF5A4E'],['藍隊','#3D8BFF'],['綠隊','#2BB673'],['黃隊','#FFC93C']];
function teamSetup(){
  $('#clBox').innerHTML=`<div class="ovt" style="color:var(--blue)">小組競賽</div><div class="ovs">有幾隊要比賽？</div><div class="ovbtns teamsel"><button data-n="2">2 隊</button><button data-n="3">3 隊</button><button data-n="4">4 隊</button></div><div class="ovbtns"><button id="tmBack">回首頁</button></div>`;
  $('#clear').hidden=false;
  talk([Z('小組競賽！老師請選有幾隊要比賽。每一隊輪流回答，答對的隊伍得一分。',{ins:true})]);
  $('#clBox').querySelector('.teamsel').onclick=e=>{const b=e.target.closest('button');if(!b)return;startTeam(+b.dataset.n)};
  $('#tmBack').onclick=()=>{$('#clear').hidden=true;openHome()};
}
function startTeam(n){
  $('#clear').hidden=true;S.mode='team';S.teams=TEAMC.slice(0,n).map(t=>({n:t[0],c:t[1],s:0}));S.turn=0;S.qi=0;S.boss=false;S.seen={};
  S.qs=mixQs(n*4);show('game');restoreFoot();nextQ();
}
function teamBar(){return `<div class="teams">${S.teams.map((t,i)=>`<span class="team ${i===S.turn?'cur':''}" style="border-color:${t.c}"><span style="width:14px;height:14px;border-radius:50%;background:${t.c};border:2px solid #1F2A44"></span>${t.n}<span class="sc2">${t.s}</span></span>`).join('')}</div>`}
const _nextQ=nextQ;
nextQ=function(){
  if(S.mode==='team'&&S.qi<S.qs.length){
    const t=S.teams[S.turn];const q=S.qs[S.qi];
    _nextQ();
    $('#gins').innerHTML=`<span style="color:${t.c}">${t.n}</span> 回答：${q.insS}`;
    talk([Z(t.n+'回答',{}),W(200)].concat(qSeq(q,true)));
    return;
  }
  _nextQ();
};
function teamAnswer(o,el){
  S.lock=true;stopTalk();const t=S.teams[S.turn];
  if(o.ok){t.s++;el.classList.add('right');if(S.q.onOk)S.q.onOk();cheer()}
  else{SFX.no();el.classList.add('dim');const k=S.q.opts.findIndex(x=>x.ok);optEl(k).classList.add('right');const ok=S.q.opts[k];if(ok.say)talk([Z('答案是',{ins:true}),E(ok.say)])}
  $('#gprog').innerHTML=teamBar();
  setTimeout(()=>{S.turn=(S.turn+1)%S.teams.length;S.qi++;nextQ()},o.ok?1400:2600);
}
function teamEnd(){
  stopTalk();const rank=S.teams.slice().sort((a,b)=>b.s-a.s);const top=rank[0].s;const winners=rank.filter(t=>t.s===top).map(t=>t.n);
  $('#clBox').innerHTML=`<div class="ovt">比賽結束！</div><div class="ovpic">${P('trophy')}</div><div class="ovs">冠軍：${winners.join('、')}</div><div class="podium">${rank.map(t=>`<div style="border-color:${t.c}"><span>${t.n}</span><span class="en">${t.s} 分</span></div>`).join('')}</div><div class="ovbtns"><button class="go" id="tmAgain">再比一次</button><button id="tmHome">回首頁</button></div>`;
  $('#clear').hidden=false;SFX.fanfare();burst('fire',true);burst('balloon',true);
  talk([Z('比賽結束！冠軍是'+winners.join('和')+'！大家都很棒！')]);
  $('#tmAgain').onclick=()=>startTeam(S.teams.length);
  $('#tmHome').onclick=()=>{$('#clear').hidden=true;openHome()};
}

show('splash');
})();
</script>
