<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Birthday Party 闖關樂園</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
/* Layout: one-screen app. Top bar (home / voice / speed / stars) + a stage that fits without scrolling.
   Each theme swaps the whole palette (teacher picks the look), so every color is set explicitly per theme. */
:root{
  --bg:#fff3d6; --bg2:#ffe08a; --ink:#3a2a5a; --card:#ffffff;
  --accent:#ff5a5f; --accent2:#2bb3c0; --mon:#7fd0ff; --good:#21b26a; --cake:#f7b2c4;
  --en:"Andika","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  --zh:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--zh);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--accent2);outline-offset:3px}
#deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#deco span{position:absolute;font-size:34px;opacity:.22;animation:floaty 9s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-18px) rotate(8deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.screen{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}

/* top bar */
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;flex:0 0 auto}
.tb{font:700 15px/1 var(--zh);padding:9px 13px;border-radius:999px;border:2.5px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink)}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tb.home{background:var(--accent);color:#fff}
.starPill{font:700 17px/1 var(--en);padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--bg);display:inline-flex;gap:6px;align-items:center}
.starPill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35)}}

/* home */
.homeTop{text-align:center;padding-top:4px}
.homeTop h1{margin:0;font:700 clamp(30px,8vw,54px)/1.05 var(--en);color:var(--accent);text-shadow:3px 3px 0 var(--ink)}
.homeTop p{margin:4px 0 0;font-weight:700;font-size:clamp(15px,4vw,20px)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:10px}
.lbl{font-weight:800;font-size:15px}
.chip{font:700 15px/1 var(--zh);padding:10px 12px;border-radius:14px;border:2.5px solid var(--ink);background:var(--card);display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--ink);color:var(--bg)}
.bigBtn{font:800 clamp(17px,4.6vw,22px)/1 var(--zh);padding:14px 20px;border-radius:20px;border:3px solid var(--ink);background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--ink)}
.bigBtn.alt{background:var(--accent2)}
.bigBtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.mapBox{position:relative;flex:1 1 auto;min-height:190px;margin-top:14px;border-radius:26px;border:3px dashed var(--ink);background:var(--bg2);padding:10px 6px}
.mapTitle{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--bg);padding:0 10px;font-weight:800;font-size:14px;white-space:nowrap}
#mapSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#map{position:relative;height:100%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;gap:4px;align-items:center;justify-items:center}
.node{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:2px;min-width:0}
.node .ball{position:relative;width:clamp(48px,13vmin,82px);aspect-ratio:1;border-radius:50%;background:var(--card);border:3px solid var(--ink);display:grid;place-items:center;font-size:clamp(24px,6.5vmin,40px);box-shadow:0 4px 0 var(--ink)}
.node .n{position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;background:var(--accent2);color:#fff;font:700 14px/24px var(--en);text-align:center;border:2px solid var(--ink)}
.node.done .ball::after{content:"過關";position:absolute;bottom:-8px;right:-14px;background:var(--good);color:#fff;font:800 11px/1 var(--zh);padding:4px 5px;border-radius:8px;border:2px solid var(--ink)}
.node .nm{font-weight:800;font-size:clamp(11px,3vw,14px);text-align:center;line-height:1.15;max-width:7em}
.lineTip{margin-top:8px;padding:10px 12px;border-radius:14px;background:#fff3c4;color:#4a3500;border:2px solid #4a3500;font-weight:700;font-size:15px;text-align:center}
.lineTip a{color:#b3261e;font-weight:900}

/* game shell */
.head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;margin-top:8px}
#lvTitle{font-weight:900;font-size:clamp(16px,4.4vw,21px)}
.dots{display:flex;gap:5px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dots i.d{background:var(--good)} .dots i.c{background:var(--accent)}
.board{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.team{font:800 14px/1 var(--zh);padding:7px 10px;border-radius:12px;border:2.5px solid var(--ink);color:#222}
.team.now{transform:scale(1.12);box-shadow:0 0 0 4px var(--accent)}
#instr{text-align:center;font-weight:800;font-size:clamp(15px,4vw,19px);margin:6px 0 2px;min-height:1.3em}
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;position:relative}
#prompt{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
#field{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}
.foot{flex:0 0 auto;display:flex;justify-content:center;padding-bottom:4px}
.again{font:800 18px/1 var(--zh);padding:12px 22px;border-radius:999px;border:3px solid var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink)}
.fitHint{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);font-weight:800;padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap}

/* generic cards */
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:stretch;width:100%}
.opt{font:700 clamp(22px,6vmin,38px)/1.15 var(--en);background:var(--card);color:var(--ink);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:12px 18px;min-width:84px;min-height:64px;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .2s}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.opt.pic{padding:6px;width:clamp(96px,27vmin,170px)}
.opt.num{font-size:clamp(40px,12vmin,72px);min-width:clamp(80px,22vmin,120px)}
.opt.sent{font-size:clamp(19px,5vmin,30px)}
.no{opacity:.3!important;filter:grayscale(1);pointer-events:none}
.yes{background:var(--good)!important;color:#fff!important;transform:scale(1.08)}
.hint{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px var(--accent),0 6px 0 var(--ink);transform:scale(1.06)}}
.reading{outline:5px solid var(--accent);outline-offset:3px;transform:scale(1.06)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.mon{width:100%;height:auto;display:block}
.listen{font-size:clamp(46px,13vmin,80px);width:clamp(80px,20vmin,120px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--card);border:4px solid var(--ink);animation:ear 1.6s ease-in-out infinite}
@keyframes ear{50%{transform:scale(1.08)}}
.picCard{font-size:clamp(56px,16vmin,100px);line-height:1;background:var(--card);border:4px solid var(--ink);border-radius:24px;padding:10px 16px;display:grid;place-items:center;min-width:clamp(90px,24vmin,140px);min-height:clamp(90px,24vmin,140px)}
.picCard svg{width:clamp(70px,20vmin,120px);height:auto}
.word{font:700 clamp(36px,10vmin,64px)/1 var(--en);letter-spacing:2px;background:var(--card);border:4px solid var(--ink);border-radius:20px;padding:10px 18px}
.word .blank{display:inline-block;min-width:.75em;border-bottom:6px solid var(--accent);color:var(--accent);text-align:center}
.word b{color:var(--accent)}
.speech{position:relative;font:700 clamp(19px,5.4vmin,32px)/1.2 var(--en);background:var(--card);color:var(--ink);border:4px solid var(--ink);border-radius:20px;padding:8px 14px;max-width:min(80vw,420px)}
.speech.me{background:var(--accent);color:#fff}
.cake{display:block;width:100%;height:auto}
.flame{animation:flick .5s ease-in-out infinite alternate;transform-origin:center bottom;transform-box:fill-box}
@keyframes flick{to{transform:scaleY(1.18) scaleX(.85)}}

/* L1 bunting */
.bunting{position:relative;width:100%;max-width:640px;padding-top:12px}
.bunting svg{position:absolute;left:0;top:0;width:100%;height:40px}
.flags{display:flex;justify-content:space-around;align-items:flex-start;gap:6px}
.flag{width:clamp(84px,25vmin,150px);aspect-ratio:.82;border:0;padding:0 0 14%;background:var(--c);color:#2b2340;font:700 clamp(46px,14vmin,88px)/1 var(--en);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);transform-origin:50% 0;animation:swing 2.6s ease-in-out infinite;animation-delay:var(--d);display:grid;place-items:center}
.flag:nth-child(2){margin-top:22px}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.flag.hint{animation:hintf .8s infinite}
@keyframes hintf{50%{transform:scale(1.12);filter:brightness(1.25)}}
.flag.win{animation:flip .7s;background:var(--good);color:#fff}
@keyframes flip{to{transform:rotateY(360deg)}}

/* L2 cakes */
.cakes{display:flex;gap:clamp(8px,3vw,24px);justify-content:center;align-items:flex-end;flex-wrap:wrap;width:100%}
.cakeBtn{width:clamp(96px,28vmin,180px);background:var(--card);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:6px}
.puff{position:fixed;z-index:49;font-size:44px;pointer-events:none;animation:puff 1s forwards}
@keyframes puff{to{transform:translate(30px,-60px) scale(1.6);opacity:0}}

/* L4 balloons */
.balloons{display:flex;gap:clamp(12px,5vw,36px);justify-content:center;align-items:center;width:100%;padding-bottom:40px}
.balloon{position:relative;width:clamp(80px,23vmin,134px);aspect-ratio:.82;border:4px solid var(--ink);padding:0;border-radius:50% 50% 47% 47%/56% 56% 44% 44%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.85) 0 9%,var(--c) 34%);color:#2b2340;font:700 clamp(40px,12vmin,76px)/1 var(--en);animation:bob 3s ease-in-out infinite;animation-delay:var(--d)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:40px;background:var(--ink)}
.balloon::before{content:"";position:absolute;left:calc(50% - 7px);bottom:-9px;border:7px solid transparent;border-bottom-color:var(--ink)}
@keyframes bob{50%{transform:translateY(-14px)}}
.balloon.popped{animation:pop .3s forwards}
@keyframes pop{to{transform:scale(1.6);opacity:0}}

/* L5 gifts */
.gifts{display:flex;gap:clamp(12px,5vw,36px);justify-content:center;align-items:flex-end;width:100%}
.gift{position:relative;width:clamp(86px,25vmin,140px);aspect-ratio:1;background:none;border:0;padding:0}
.gift .box{position:absolute;left:6%;right:6%;bottom:0;height:70%;border:4px solid var(--ink);border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(90deg,transparent 42%,rgba(255,255,255,.75) 42% 58%,transparent 58%),var(--c)}
.gift .lt{background:#fff;color:#2b2340;border:3px solid #2b2340;border-radius:50%;width:58%;aspect-ratio:1;display:grid;place-items:center;font:700 clamp(30px,9vmin,52px)/1 var(--en)}
.gift .lid{position:absolute;left:0;right:0;top:12%;height:22%;border:4px solid var(--ink);border-radius:8px;transition:transform .6s;
  background:linear-gradient(90deg,transparent 42%,rgba(255,255,255,.75) 42% 58%,transparent 58%),var(--c)}
.gift .bow{position:absolute;left:50%;top:-95%;transform:translateX(-50%);font-size:clamp(26px,8vmin,44px);line-height:1}
.gift.open .lid{transform:translate(-30%,-140%) rotate(-28deg)}
.gift.yes{transform:none;background:none!important} .gift.yes .box{background:var(--good)}
.gift.hint .box{animation:glow 1s infinite}

/* L6 / L8 comic */
.comic{display:flex;justify-content:center;align-items:flex-end;gap:10px;width:100%;max-width:640px;flex-wrap:nowrap}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;flex:1}
.side .speech{font-size:clamp(17px,4.6vmin,28px)}
.who{width:clamp(76px,20vmin,130px)}
.kid{font-size:clamp(54px,15vmin,92px);line-height:1}
.name{font:700 clamp(18px,5vmin,26px)/1 var(--en);background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:10px}
.scene{font-size:clamp(60px,18vmin,110px);line-height:1}
.fall{display:inline-block;animation:fall 1.4s ease-in infinite}
@keyframes fall{0%{transform:translateY(-20px) rotate(0)}80%,100%{transform:translateY(30px) rotate(90deg)}}

.talking{animation:talk .45s ease-in-out infinite alternate;box-shadow:0 0 0 5px var(--accent2)}
@keyframes talk{to{transform:scale(1.07)}}
.qmark{display:inline-block;min-width:1.2em;text-align:center;border-bottom:4px solid currentColor}
/* L7 candle spelling */
.spellCake{width:clamp(180px,52vmin,320px)}
.slots{display:flex;gap:6px;justify-content:center;margin-top:4px}
.slot{width:clamp(38px,11vw,60px);height:clamp(44px,12vw,66px);border:3.5px solid var(--ink);border-radius:10px;background:var(--card);display:grid;place-items:center;font:700 clamp(26px,7.5vw,42px)/1 var(--en)}
.slot.next{box-shadow:0 0 0 4px var(--accent);animation:ear 1.2s infinite}
.slot.full{background:var(--bg2)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.tile{width:clamp(54px,15vmin,78px);height:clamp(54px,15vmin,78px);min-width:0;min-height:0;padding:0}

/* L9 memory */
.memo{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:clamp(6px,2vw,12px);width:min(100%,560px)}
.mc{aspect-ratio:4/5;border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);background:var(--accent2);color:#fff;font:700 clamp(20px,6vmin,36px)/1 var(--en);display:grid;place-items:center;padding:2px;transition:transform .25s}
.mc.up{background:var(--card);color:var(--ink);transform:rotateY(180deg) scaleX(-1)}
.mc .d{font-size:clamp(34px,10vmin,60px)}
.mc.got{background:var(--good);color:#fff;transform:none}
.mc .back{font-size:clamp(26px,8vmin,44px)}

/* L10 tower */
.bossTop{display:flex;align-items:flex-end;justify-content:center;gap:14px}
.bossTop .who{width:clamp(80px,19vmin,130px)}
.tower{width:clamp(130px,36vmin,210px);height:clamp(110px,22vh,170px);display:flex;flex-direction:column-reverse;align-items:center;border-bottom:6px solid var(--ink)}
.layer{height:16%;border:3px solid var(--ink);border-radius:8px;margin-top:-3px;animation:drop .5s cubic-bezier(.3,1.5,.6,1)}
@keyframes drop{from{transform:translateY(-120px);opacity:0}}
.topper{font-size:clamp(24px,6vmin,36px);line-height:1;animation:drop .5s}

/* overlay */
.overlay{position:fixed;inset:0;z-index:45;background:rgba(20,10,40,.55);display:grid;place-items:center;padding:16px}
.panel{background:var(--card);color:var(--ink);border:5px solid var(--ink);border-radius:30px;padding:22px 20px;text-align:center;max-width:430px;width:100%;box-shadow:0 10px 0 var(--ink);animation:in .35s}
@keyframes in{from{transform:translateY(12px);opacity:0}}
.panel .big{font-weight:900;font-size:clamp(26px,7vw,36px)}
.panel .trophy{font-size:80px;line-height:1.1;animation:bump 1s infinite}
.panel p{font-weight:800;font-size:18px;margin:8px 0}
.rank{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.rank div{font-weight:900;font-size:20px;padding:8px;border-radius:12px;border:3px solid var(--ink);color:#222}

/* 先認識單字 */
.learn{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.lcount{font-weight:900;font-size:16px}
.lcard{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:5px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:14px 24px;min-width:min(78vw,320px);max-width:100%;animation:lin .35s}
@keyframes lin{from{transform:translateY(14px) scale(.95);opacity:0}}
.lpic{font-size:clamp(60px,18vmin,110px);line-height:1;display:grid;place-items:center}
.lpic svg{width:clamp(90px,24vmin,150px);height:auto}
.lnum{font:700 clamp(70px,20vmin,120px)/1 var(--en);color:var(--accent2)}
.len{font:700 clamp(38px,11vmin,70px)/1.1 var(--en);color:var(--accent);text-align:center}
.len.small{font-size:clamp(24px,7vmin,42px)}
.lsub{font:700 clamp(22px,6vmin,32px)/1 var(--en)}
.lzh{font-weight:900;font-size:clamp(22px,6vmin,34px)}
.lnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.tb[disabled]{opacity:.35}

@media (prefers-reduced-motion:reduce){
  .flag,.balloon,.flame,#deco span,.listen,.slot.next,.fall{animation:none!important}
}

/* ===== 介面改版（依 1-3 格式）：上方工具列＋開始畫面＋首頁卡片＋大格子地圖 ===== */
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}
#topbar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;
  padding-top:max(6px,env(safe-area-inset-top,0px));padding-bottom:4px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
#topbar .tb{font-size:clamp(14px,3.6vmin,18px);padding:8px 12px}
#topbar .starPill{font-size:clamp(15px,3.8vmin,19px)}
.tb.pause{background:#ffd6a5;color:#3a2a10}
#view{flex:1 1 auto;min-height:0;position:relative}
#view .screen{padding-block:6px}
/* 開始畫面 */
#splash{align-items:center;justify-content:center;text-align:center;gap:18px}
.logo{font:700 clamp(40px,11vmin,90px)/1 var(--en);color:var(--accent);text-shadow:4px 4px 0 var(--ink)}
.logo small{display:block;font:900 clamp(18px,4.6vmin,30px)/1.2 var(--zh);color:var(--ink);text-shadow:none;margin-top:10px;letter-spacing:2px}
.splashDeco{display:flex;gap:3vmin;font-size:clamp(40px,11vmin,80px);line-height:1}
.splashDeco span{animation:hop 2.4s ease-in-out infinite}
.splashDeco span:nth-child(2){animation-delay:.3s}.splashDeco span:nth-child(3){animation-delay:.6s}.splashDeco span:nth-child(4){animation-delay:.9s}
@keyframes hop{50%{transform:translateY(-12px) rotate(5deg)}}
.bigBtn.go{background:var(--good);font-size:clamp(26px,7vmin,44px);padding:.45em 1.4em;border-radius:24px;animation:hop 1.8s ease-in-out infinite}
#splash .lineTip{max-width:520px;font-size:clamp(15px,4vmin,19px)}
#splash .lineTip a{display:inline-block;margin-top:8px;background:var(--accent2);color:#fff;padding:8px 16px;border-radius:12px;text-decoration:none}
/* 首頁卡片 */
#home{align-items:center;justify-content:center}
.homecard{background:var(--card);color:var(--ink);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:clamp(10px,2.4vmin,22px);width:min(100%,780px);box-sizing:border-box;display:grid;gap:clamp(6px,1.4vmin,12px);max-height:100%;overflow:auto}
.homecard h1{margin:0;text-align:center;font:700 clamp(28px,7vmin,50px)/1 var(--en);color:var(--accent);text-shadow:3px 3px 0 var(--ink)}
.homecard h1 small{display:block;font:900 clamp(15px,3.8vmin,20px)/1.2 var(--zh);color:var(--ink);text-shadow:none;margin-top:6px}
.homecard .lbl{font-weight:900;font-size:clamp(16px,4vmin,21px)}

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ================= THEMES ================= */
const THEMES={
  party:{name:'生日派對',ic:'🎂',v:{bg:'#fff3d6',bg2:'#ffe08a',ink:'#3a2a5a',card:'#ffffff',accent:'#ff5a5f',accent2:'#2bb3c0',mon:'#7fd0ff',cake:'#f7b2c4'},deco:['🎈','🎂','🎁','🎉','🧁'],map:'派對路線',light:true}
};
let theme='party';
function applyTheme(k){
  theme=k; store.set('u1theme',k); const t=THEMES[k], r=document.documentElement;
  for(const [n,val] of Object.entries(t.v)) r.style.setProperty('--'+n,val);
  r.style.colorScheme=t.light?'light':'dark';
  $('#deco').innerHTML=Array.from({length:14},(_,i)=>`<span style="left:${(i*37+7)%96}%;top:${(i*53+11)%92}%;animation-delay:${-i*.7}s">${t.deco[i%t.deco.length]}</span>`).join('');
  const thEl=$('#themes');if(thEl)thEl.innerHTML=Object.entries(THEMES).map(([key,th])=>`<button class="chip ${key===k?'on':''}" data-t="${key}">${th.ic} ${th.name}</button>`).join('');
  $$('#themes .chip').forEach(b=>b.onclick=()=>{applyTheme(b.dataset.t);FX.pop()});
  updMapTitle();
  drawMap();
}
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ================= SPEECH ================= */
const synth=window.speechSynthesis;
const SP={rate:1,voice:true,homeVoice:true,tok:0};
/* 一律用小寫唸，避免手機唸出 capital；a、f 用拼音字避免怪音 */
const LNAME={a:'ay',f:'eff'};
const LNM={A:'eh',B:'bee',C:'see',D:'dee',E:'ee',F:'eff',G:'gee',H:'aitch',I:'eye',J:'jay',K:'kay',L:'el',M:'em',N:'en',O:'oh',P:'pee',Q:'cue',R:'ar',S:'ess',T:'tee',U:'you',V:'vee',W:'double you',X:'ex',Y:'why',Z:'zee'}; /* 字母名稱用固定拼法，避免手機把 F. W. 唸成縮寫；A 用 eh，避免手機唸成 capital A */
const LN=c=>LNM[c.toUpperCase()]||c;
function unlock(){gestureUnlock();ac();}
function say(items,done){
  if(!synth){if(done)setTimeout(done,400);return}
  if(!justUnlocked()){try{synth.cancel()}catch(e){}}
  const tok=++SP.tok;let i=0;
  const next=()=>{
    if(tok!==SP.tok)return;
    if(i>=items.length){done&&done();return}
    let it=items[i++]; if(typeof it==='string')it={t:it};
    if(it.zh&&!SP.voice){next();return}
    it.on&&it.on();
    const u=new SpeechSynthesisUtterance(it.t);
    u.lang=(it.zh||it.mean)?'zh-TW':'en-US';
    u.rate=Math.max(.4,Math.min(1.6,((it.zh||it.mean)?1:.78)*(it.r||1)*SP.rate));
    let fired=false;
    const fin=()=>{if(fired)return;fired=true;clearTimeout(tm);it.off&&it.off();setTimeout(next,(it.gap??500)/SP.rate)};
    u.onend=fin;u.onerror=fin;
    const tm=setTimeout(fin,(1300+it.t.length*((it.zh||it.mean)?340:130))/SP.rate);
    try{synth.speak(u)}catch(e){fin()}
  };
  if(justUnlocked())next();else setTimeout(next,90);/* 剛點完畫面：馬上唸，iPhone 才會出聲 */
}
function hush(){SP.tok++;$$('.reading').forEach(e=>e.classList.remove('reading'));if(justUnlocked())return;try{synth&&synth.cancel()}catch(e){}}

/* ================= SOUND FX ================= */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}

/* ===== 和 English-1-abc 同一套：手機聲音解鎖、LINE 換到瀏覽器 =====
   iPhone 只有在「手指放開（touchend）或點一下（click）」的那一瞬間，才允許網頁開始發出聲音；
   按下（pointerdown）不算數。所以第一次點畫面時，在這一瞬間把語音、音效都先打開。
   剛打開聲音的 0.6 秒內不要取消語音，iPhone 會因此失去聲音。 */
const XUA=navigator.userAgent,XLINE=/\bLine\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(XUA);
let unlockAt=0,audioUnlocked=false,needUnlock=false,stayHere=false;
function gestureUnlock(){if(audioUnlocked)return;audioUnlocked=true;unlockAt=performance.now();
  try{const a=ac();if(a){if(a.state!=='running')a.resume();const bf=a.createBuffer(1,1,22050),src=a.createBufferSource();src.buffer=bf;src.connect(a.destination);src.start(0);}}catch(e){}
  try{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}}catch(e){}}
const justUnlocked=()=>performance.now()-unlockAt<600;
['touchend','click','keydown'].forEach(t=>document.addEventListener(t,gestureUnlock,{capture:true,passive:true}));
/* 開到瀏覽器時，網址帶著「要回到哪裡」：go=start 直接進地圖，名字和好朋友也一起帶過去 */
const XKEYS=['go','nm','av','openExternalBrowser'];
function extUrl(extra){const u=new URL(location.href.split('#')[0]);XKEYS.forEach(k=>u.searchParams.delete(k));
  if(extra)for(const [k,v] of Object.entries(extra))if(v!==undefined&&v!==null&&v!=='')u.searchParams.set(k,v);return u.toString();}
const toChrome=u=>{location.href='intent://'+u.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(u)+';end';};
function openExt(extra){const u=extUrl(extra);
  if(/\bLine\//i.test(XUA)){location.href=u+(u.indexOf('?')<0?'?':'&')+'openExternalBrowser=1';return;}
  if(/Android/i.test(XUA)){toChrome(u);return;}
  extHelp(u);}
/* 沒辦法自動跳到瀏覽器時（例如 iPhone 的 Facebook、或 LINE 沒有反應），告訴大人怎麼做 */
function extHelp(u){const ios=/iPhone|iPad|iPod/i.test(XUA);
  const m=document.createElement('div');m.className='xwm';
  m.innerHTML=`<div class="xwb"><div style="font-size:3rem">🌐</div><h2>請用瀏覽器開啟</h2><div class="xwt">${ios?'請按畫面右下角或右上角的「⋯」或「分享」，<br>選「用 Safari 開啟」或「以預設瀏覽器開啟」。':'請按右上角的「⋮」，選「用瀏覽器開啟」。'}<br>也可以按「複製網址」，貼到 Safari 或 Chrome。</div><div><button class="xg" data-x="c">複製網址</button><button class="xy" data-x="x">先在這裡玩</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('[data-x="c"]').onclick=e=>copyUrl(u,e.currentTarget);
  m.querySelector('[data-x="x"]').onclick=()=>{stayHere=true;m.remove();};}
function copyUrl(u,btn){const ok=()=>{if(btn)btn.textContent='網址已複製';};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(ok,fb);return;}}catch(e){}
  fb();function fb(){try{const t=document.createElement('textarea');t.value=u;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();ok();}catch(e){if(btn)btn.textContent='請手動複製網址';}}}
/* 在 LINE 裡按「開始闖關」：換到瀏覽器（有聲音、畫面不會亂跑）；選「先在這裡玩」就留在 LINE */
const goExt=(nm,av)=>{if(XLINE&&!stayHere){openExt({go:'start',nm,av});return true;}return false;};
function bootParams(){let q;try{q=new URLSearchParams(location.search);}catch(e){return {};}

function tone(f,t0,d,type='sine',v=.16,f2){const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(t0,d,v,freq=1800){const a=ac();if(!a)return;const b=a.createBuffer(1,Math.max(1,a.sampleRate*d|0),a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/ch.length,3);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=a.createGain();g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t0)}

function emit(x,y,n,kind){
  const cols=[cssv('--accent'),cssv('--accent2'),'#ffd23f','#21b26a','#5cc8ff','#ff8a3d'];
  const emo=THEMES[theme].deco;
  for(let i=0;i<(reduce?n/3:n);i++){

    parts.push({x:kind==='rain'?Math.random()*innerWidth:x,y:kind==='rain'?-20-Math.random()*200:y,
      vx:Math.cos(a)*s,vy:kind==='rain'?2+Math.random()*3:Math.sin(a)*s-(kind==='fire'?0:3),
      r:4+Math.random()*5,c:rnd(cols),life:kind==='rain'?160:70+Math.random()*30,rot:Math.random()*6,
      e:kind==='rain'||(kind==='emo')?rnd(['⭐',...emo]):null,sq:Math.random()<.5});

function step(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life-->0&&p.y<innerHeight+40);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.e&&p.vx===0?0.02:.18;p.vx*=.99;p.rot+=.1;
    cx.globalAlpha=Math.min(1,p.life/30);
    if(p.e){cx.font='26px serif';cx.fillText(p.e,p.x,p.y)}
    else{cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);if(p.sq)cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{cx.beginPath();cx.arc(0,0,p.r,0,7);cx.fill()}cx.restore()}}
  cx.globalAlpha=1;

}

/* ================= 先認識單字（每關開始前） ================= */
SP.learnOn=true;
const LEARNED=new Set();
const csOn=q=>{const e=$(q);if(e)e.classList.add('on')},csOff=q=>{const e=$(q);if(e)e.classList.remove('on')};
function runIntro(cards,then){
  const seen=new Set(),list=(cards||[]).filter(c=>c&&!LEARNED.has(c.en)&&!seen.has(c.en)&&seen.add(c.en));
  if(!SP.learnOn||!list.length){then();return}
  let i=0,step=0,alive=true;$('#dots').innerHTML='';
  const finish=()=>{if(!alive)return;alive=false;G.onReplay=null;hush();then()};
  const go=()=>{if(!alive)return;if(i<list.length-1){i++;card()}else{alive=false;G.onReplay=null;say([{t:'開始玩囉！',zh:1}]);later(()=>{hush();then()},1300)}};
  const card=()=>{
    G.resumeFn=card;
    const c=list[i],my=++step;LEARNED.add(c.en);
    $('#instr').textContent='先認識這些英文';P().innerHTML='';

      F().innerHTML=`<div class="learn"><div class="lcount">${i+1} / ${list.length}</div><div class="lset"><div class="lhead">認識字母 <b class="hb">${L}</b> 和 <b class="hs">${l}</b></div><div class="lrow two"><button class="lc big" id="cB" style="order:${bf?0:1}"><span class="lt">${L}</span><span class="lb">大寫 <i>big</i></span></button><button class="lc small" id="cS" style="order:${bf?1:0}"><span class="lt">${l}</span><span class="lb">小寫 <i>small</i></span></button><button class="lc word" id="cW" style="order:2"><span class="lp">${c.pic}</span><span class="lw2">${[...w].map(ch=>`<span class="${ch===l?'fl':''}">${ch}</span>`).join('')}</span><span class="lz">${c.zh}</span></button><button class="lc word" id="cW2" style="order:3"><span class="lp">${c.pic2}</span><span class="lw2">${[...c.sub2].map(ch=>`<span class="${ch===l?'fl':''}">${ch}</span>`).join('')}</span><span class="lz">${c.zh2}</span></button></div></div><div class="lnav"><button class="tb" id="lPrev" ${i?'':'disabled'}>上一個</button><button class="tb" id="lNext">下一個</button><button class="bigBtn" id="lGo">開始玩</button></div></div>`;
    }else
    F().innerHTML=`<div class="learn"><div class="lcount">${i+1} / ${list.length}</div><button class="lcard" id="lcard">${c.pic?`<span class="lpic">${c.pic}</span>`:''}${c.cs?`<span class="len cs">${c.cs}</span>`:`<span class="len ${big.length>9?'small':''}">${big}</span>`}${c.sub?`<span class="lsub">${c.sub}</span>`:''}<span class="lzh">${c.zh}</span></button><div class="lnav"><button class="tb" id="lPrev" ${i?'':'disabled'}>上一個</button><button class="tb" id="lNext">下一個</button><button class="bigBtn" id="lGo">開始玩</button></div></div>`;
    let items=c.items||[{t:c.en,gap:700},{t:c.zh,mean:1,gap:700},{t:c.en,gap:900}];
    if(c.cs){const l=c.en.slice(7),w=c.sub,on=q=>()=>csOn(q),off=q=>()=>csOff(q);
      const wordSeq=(id,w,zh)=>{const mk=k=>()=>$$(id+' .lw2 span').forEach((e,j)=>e.classList.toggle('hl',j===k));
        return [{t:w,gap:300,on:on(id)},{t:zh,mean:1,gap:600},...[...w].map((ch,k)=>({t:LN(ch),gap:350,on:mk(k)})),{t:w,gap:800,on:mk(-1),off:off(id)}]};
      items=[{t:'這是字母',mean:1,gap:150},{t:LN(l),gap:600},
        {t:'大寫',mean:1,gap:100,on:on('#cB')},{t:'big',gap:150,on:on('#cB')},{t:LN(l),gap:700,on:on('#cB'),off:off('#cB')},
        {t:'小寫',mean:1,gap:100,on:on('#cS')},{t:'small',gap:150,on:on('#cS')},{t:LN(l),gap:800,on:on('#cS'),off:off('#cS')},
        ...wordSeq('#cW',w,c.zh),...wordSeq('#cW2',c.sub2,c.zh2)];}
    G.promptItems=items;
    /* 學完以後「摸一摸」：要小朋友自己點出大寫或小寫，點對了才進下一個 */
    const check=()=>{
      if(!alive)return;const my2=step,l=c.en.slice(7),L=l.toUpperCase(),wantB=Math.random()<.5;
      const tgt=$(wantB?'#cB':'#cS'),oth=$(wantB?'#cS':'#cB');if(!tgt)return;

      let wrong=0,done=false,nag=0;
      const ask=()=>say([{t:'用手指，摸一摸'+kind,mean:1,gap:250},{t:enB,gap:150},{t:en,gap:400}]);
      G.onReplay=ask;G.promptItems=[{t:enB,gap:150},{t:en}];ask();
      const remind=()=>later(()=>{if(done||!alive||my2!==step)return;if(++nag>=2)tgt.classList.add('ask');ask();remind()},7000);remind();
      tgt.onclick=()=>{if(done||my2!==step)return;done=true;hush();tgt.classList.remove('ask','hint');tgt.classList.add('good');celebrate(tgt);if(!wrong)addStar();

        say([{t:'這是'+okind,mean:1,gap:200},{t:'要摸'+kind,mean:1,gap:200},{t:enB,gap:150},{t:en}]);if(wrong>=2)tgt.classList.add('ask')};
    };
    const play=(lead=[])=>{const m=++step;say([...lead,...items],()=>later(()=>{if(m===step&&alive)(c.cs?check:go)()},c.cs?400:800))};
    G.onReplay=()=>{hush();play()};
    play(i===0?[{t:'先認識這些英文',zh:1,gap:400}]:[]);
    if($('#lcard'))$('#lcard').onclick=()=>{hush();play()};
    if(c.cs){const l=c.en.slice(7);$('#cB').onclick=()=>say([{t:'big',gap:150,on:()=>csOn('#cB')},{t:LN(l),on:()=>csOn('#cB'),off:()=>csOff('#cB')}]);$('#cS').onclick=()=>say([{t:'small',gap:150,on:()=>csOn('#cS')},{t:LN(l),on:()=>csOn('#cS'),off:()=>csOff('#cS')}]);const tap=(id,w,zh)=>()=>{const mk=k=>()=>$$(id+' .lw2 span').forEach((e,j)=>e.classList.toggle('hl',j===k));say([{t:w,gap:300,on:()=>csOn(id)},{t:zh,mean:1,gap:500},...[...w].map((ch,k)=>({t:LN(ch),gap:350,on:mk(k)})),{t:w,on:mk(-1),off:()=>csOff(id)}])};$('#cW').onclick=tap('#cW',c.sub,c.zh);$('#cW2').onclick=tap('#cW2',c.sub2,c.zh2);}
    $('#lPrev').onclick=()=>{if(i){hush();i--;card()}};
    $('#lNext').onclick=()=>{hush();go()};
    $('#lGo').onclick=finish;
    fitCheck();
  };
  card();
}

/* 第一課的單字卡資料 */
const ZH1={fish:'魚',fan:'電風扇',goat:'山羊',hat:'帽子',ham:'火腿',ink:'墨水',igloo:'冰屋',jam:'果醬',jet:'噴射機',apple:'蘋果',bed:'床',dog:'狗',egg:'蛋',arm:'手臂',bus:'公車',door:'門',elephant:'大象',girl:'女孩',insect:'昆蟲',foot:'腳',hand:'手',jeans:'牛仔褲'};
const NUMZH=['零','一','二','三','四','五','六','七','八','九','十'];
/* 每個字母兩個單字：第二個是同一個字首、生活裡常看到的，而且不和關卡裡、English 1～4 課、其他 wonder-world 遊戲的單字重複 */
const LEXL={a:[['apple','🍎'],['arm']],b:[['bed','🛏️'],['bus']],d:[['dog','🐶'],['door']],e:[['egg','🥚'],['elephant']],f:[['fish'],['foot']],g:[['goat'],['girl']],h:[['hat'],['hand']],i:[['ink'],['insect']],j:[['jam'],['jeans']]};
const wordCard=w=>({en:w,pic:pic(w),zh:ZH1[w]});
const numCard=n=>({en:NUMW[n],pic:`<span class="lnum">${n}</span>`,zh:NUMZH[n]});
const letterCard=l=>{l=l.toLowerCase();const x=LEXL[l];if(!x)return null;const [[w,e],[w2,e2]]=x;return {en:'letter-'+l,big:l.toUpperCase()+' '+l,cs:1,pic:e?`<span>${e}</span>`:pic(w),sub:w,zh:ZH1[w],pic2:e2?`<span>${e2}</span>`:pic(w2),sub2:w2,zh2:ZH1[w2]}};
const SZH={'How old are you?':'你幾歲？',"I'm nine.":'我九歲。',"I'm nine years old.":'我九歲。','Happy birthday!':'生日快樂！','This is for you.':'這是給你的。','Thank you.':'謝謝你。',"You're welcome.":'不客氣。','Yum!':'好好吃！','Oh, no!':'糟糕！'};
const SPIC={'How old are you?':'🎂','I\'m nine.':'<span class="lnum">9</span>',"I'm nine years old.":'<span class="lnum">9</span>','Happy birthday!':'🎂','This is for you.':'🎁','Thank you.':'🙏',"You're welcome.":'😊','Yum!':'😋','Oh, no!':'😱'};
const sentCard=s=>({en:s,zh:SZH[s]||'',pic:SPIC[s]||''});
const LEARN=[
  qs=>qs.map(q=>letterCard(q.a)),
  qs=>qs.map(q=>numCard(q.n)),
  qs=>qs.map(q=>numCard(q.n)),
  qs=>qs.map(q=>wordCard(q.w)),
  qs=>qs.map(q=>wordCard(q.w)),
  ()=>['How old are you?',"I'm nine.","I'm nine years old."].map(sentCard),
  qs=>qs.map(q=>numCard(NUMW.indexOf(q.w))),
  qs=>qs.flatMap(q=>q.line?[q.line,q.ok]:[q.ok]).map(sentCard),
  qs=>qs[0].nums.map(numCard),
  null];

/* ================= FLOW ================= */
function show(id){$$('.screen').forEach(s=>s.hidden=s.id!==id);$('#ov').hidden=true;$('#pauseOv').hidden=true;G.paused=false;G.screen=id;
  $('#topbar').hidden=id==='splash';$('#bHome').hidden=id==='home';$('#bPause').hidden=id!=='game';
  $('#bHome').textContent=(id==='game'&&G.mode==='solo')?'回地圖':'回首頁';fitCheck()}
function updVoice(){$('#bVoice').textContent=SP.voice?'不要語音說明':'要語音說明';$('#vOn').classList.toggle('on',SP.homeVoice);$('#vOff').classList.toggle('on',!SP.homeVoice)}
function startLevel(i){
  G.run++;hush();G.mode='solo';G.locked=false;G.pend=null;G.resumeFn=null;G.lv=i;G.qs=LV[i].gen();G.qi=0;SP.voice=SP.homeVoice;updVoice();
  $('#board').hidden=true;$('#dots').hidden=false;
  $('#lvTitle').textContent=`第 ${i+1} 關　${LV[i].icon} ${LV[i].name}`;
  show('game');runIntro(LEARN[i]?LEARN[i](G.qs):[],nextQ);
}
function nextQ(){
  G.locked=false;G.pend=null;G.resumeFn=null;G.wrong=0;G.onReplay=null;
  if(G.qi>=G.qs.length){G.mode==='group'?groupEnd():levelClear();return}
  $('#dots').innerHTML=G.mode==='group'?'':G.qs.map((_,i)=>`<i class="${i<G.qi?'d':i===G.qi?'c':''}"></i>`).join('');
  P().innerHTML='';F().innerHTML='';
  if(G.mode==='group'){drawBoard();cardQ(G.qs[G.qi])}
  else LV[G.lv].show(G.qs[G.qi]);
  fitCheck();
}
function levelClear(){
  hush();G.cleared.add(G.lv);drawMap();
  const last=G.lv===LV.length-1;
  if(LV[G.lv].boss){
    F().innerHTML=`<div class="speech" style="font-size:clamp(28px,8vmin,48px)">Happy birthday!</div>`;
    $('#tower').insertAdjacentHTML('beforeend',`<div class="topper">🕯️🕯️🕯️</div>`);
    FX.bday();fireworks(3);
    later(()=>say([{t:'Happy birthday!',gap:400}],()=>{
      F().innerHTML=`<div class="speech" style="font-size:clamp(28px,8vmin,48px)">Yum!</div>`;FX.chomp();
      say([{t:'Yum!'}],()=>later(clearPanel,900));
    }),2700);
    return;
  }
  clearPanel();
  function clearPanel(){
    FX.fanfare();fireworks(last?8:4);
    const ov=$('#ov'),pn=$('#ovPanel');ov.hidden=false;
    if(last){
      pn.innerHTML=`<div class="big">十關全部過關！</div><div class="trophy">🏆</div><p>你拿到 ⭐ ${G.stars} 顆星星</p><div style="margin:0 auto;width:160px">${cake({n:5,lit:5})}</div><div class="row"><button class="bigBtn" id="ovHome">回地圖</button></div>`;
      say([{t:'十關全部過關！你好厲害！',zh:1}]);
    }else{
      pn.innerHTML=`<div class="big">第 ${G.lv+1} 關 過關！</div><div class="trophy">${LV[G.lv].icon}</div><p>⭐ ${G.stars} 顆星星</p><p>馬上進入下一關</p><div class="row"><button class="tb home" id="ovHome">回地圖</button></div>`;
      say([{t:'過關了！',zh:1}]);
      later(()=>startLevel(G.lv+1),4200);
    }
    $('#ovHome').onclick=openMap;
  }
}

/* ---------- 小組競賽 ---------- */
const TEAM=[{n:'紅隊',c:'#ff8a8a'},{n:'藍隊',c:'#8ac8ff'},{n:'黃隊',c:'#ffe27a'},{n:'綠隊',c:'#9be38a'}];
function groupSetup(){
  unlock();const ov=$('#ov'),pn=$('#ovPanel');ov.hidden=false;
  pn.innerHTML=`<div class="big">小組競賽</div><p>幾隊比賽？</p><div class="row">${[2,3,4].map(n=>`<button class="bigBtn" data-n="${n}">${n} 隊</button>`).join('')}</div><p style="font-size:15px">每隊輪流答題，每隊 3 題。</p><div class="row"><button class="tb" id="ovBack">回首頁</button></div>`;
  $$('#ovPanel [data-n]').forEach(b=>b.onclick=()=>startGroup(+b.dataset.n));
  $('#ovBack').onclick=()=>{ov.hidden=true;hush()};
  SP.voice=SP.homeVoice;say([{t:'請選幾隊比賽',zh:1}]);
}
function startGroup(n){
  G.run++;hush();G.mode='group';G.teams=TEAM.slice(0,n).map(t=>({...t,s:0}));G.turn=0;G.qi=0;
  G.qs=Array.from({length:n*3},()=>mixQ(['letter','start','numWord','count','howOld','dialog']));
  SP.voice=SP.homeVoice;updVoice();
  $('#lvTitle').textContent='小組競賽';$('#dots').hidden=true;$('#board').hidden=false;
  show('game');nextQ();
}
function drawBoard(){$('#board').innerHTML=G.teams.map((t,i)=>`<span class="team ${i===G.turn?'now':''}" style="background:${t.c}">${t.n} ⭐${t.s}</span>`).join('')}
function groupEnd(){
  hush();FX.fanfare();fireworks(6);
  const sorted=[...G.teams].sort((a,b)=>b.s-a.s),top=sorted[0].s,win=sorted.filter(t=>t.s===top);
  const msg=win.length>1?`${win.map(t=>t.n).join('、')}平手！`:`${win[0].n}贏了！`;
  const ov=$('#ov'),pn=$('#ovPanel');ov.hidden=false;
  pn.innerHTML=`<div class="big">${msg}</div><div class="trophy">🏆</div><div class="rank">${sorted.map(t=>`<div style="background:${t.c}">${t.n}　⭐ ${t.s}</div>`).join('')}</div><div class="row"><button class="bigBtn" id="ovAgain">再比一次</button><button class="tb home" id="ovHome">回首頁</button></div>`;
  say([{t:msg+'大家都很棒！',zh:1}]);
  $('#ovHome').onclick=goHome;$('#ovAgain').onclick=()=>startGroup(G.teams.length);
}

/* ---------- home / map ---------- */
const CHARS=[{e:'🤖',n:'小機器人'},{e:'🐻',n:'小熊'},{e:'🦖',n:'小恐龍'},{e:'🐰',n:'小兔子'},{e:'🐱',n:'小貓咪'},{e:'🐼',n:'熊貓'},{e:'🦊',n:'小狐狸'},{e:'🐸',n:'小青蛙'}];
G.char=+(store.get('wwChar')||1);if(!CHARS[G.char])G.char=1;G.name=store.get('wwName')||'';
function renderChars(){$('#chars').innerHTML=CHARS.map((c,i)=>`<button data-i="${i}" class="${i===G.char?'on':''}"><b>${c.e}</b>${c.n}</button>`).join('')}
$('#chars').onclick=e=>{const b=e.target.closest('button');if(!b)return;G.char=+b.dataset.i;store.set('wwChar',G.char);renderChars();FX.pop();say([{t:'你選了'+CHARS[G.char].n,zh:1}])};
function readName(){G.name=($('#nameIn').value||'').trim().slice(0,10);store.set('wwName',G.name)}
function updMapTitle(){const t=$('#mapTitle');if(t)t.textContent=(G.name||'小朋友')+' 的'+THEMES[theme].map}
function goHome(){G.run++;hush();G.mode='solo';$('#nameIn').value=G.name;renderChars();show('home');
  if(SP.homeVoice)say([{t:'歡迎來到生日派對！先寫你的名字，再選一個好朋友，然後按開始闖關。',zh:1}])}
function nextLevel(){for(let i=0;i<LV.length;i++)if(!G.cleared.has(i))return i;return -1}
function drawMap(){
  const m=$('#map');if(!m)return;const nx=nextLevel();
  m.innerHTML=LV.map((l,i)=>{const done=G.cleared.has(i);return `<button class="mtile ${done?'done':''} ${i===nx?'next':''}" data-i="${i}"><span class="num">${i+1}</span><span class="ic">${l.icon}</span><span class="txt"><span class="nm">${l.name}</span><span class="sb">${done?'過關了':(i===nx?'下一關':'')}</span></span>${i===nx?`<span class="me">${CHARS[G.char].e}</span>`:''}</button>`}).join('');
  $$('.mtile').forEach(b=>b.onclick=()=>{unlock();startLevel(+b.dataset.i)});
}
function openMap(){G.run++;hush();G.mode='solo';$('#mapMe').textContent=CHARS[G.char].e;updMapTitle();drawMap();show('mapScr');
  const nx=nextLevel();if(SP.homeVoice)say([{t:nx<0?'你全部過關了！每一關都可以再玩一次。':(nx===0?'點一下發亮的格子，開始闖關！':'點一下發亮的格子，繼續闖關。'),zh:1}])}
function drawPath(){}

/* ---------- 暫停 ---------- */
function pauseGame(){if(G.paused||G.screen!=='game')return;G.paused=true;G.run++;hush();$('#pauseBack').textContent=G.mode==='solo'?'回地圖':'回首頁';$('#pauseOv').hidden=false}
function resumeGame(){if(!G.paused)return;G.paused=false;$('#pauseOv').hidden=true;
  if(G.resumeFn){G.resumeFn()}else if(G.locked&&G.pend){const f=G.pend;G.pend=null;f()}else nextQ()}

/* ---------- misc ---------- */
function fitCheck(){requestAnimationFrame(()=>{const s=$$('.screen').find(x=>!x.hidden);$('#fitHint').hidden=!s||s.scrollHeight<=s.clientHeight+4})}
addEventListener('resize',()=>{fitCanvas();fitCheck();drawPath()});
$$('.screen').forEach(s=>s.addEventListener('scroll',()=>{if(s.scrollTop+s.clientHeight>=s.scrollHeight-6)$('#fitHint').hidden=true}));
$('#goSolo').onclick=()=>{unlock();readName();if(goExt(G.name,G.char)){hush();return;}openMap()};
$('#goGroup').onclick=groupSetup;
$('#vOn').onclick=()=>{SP.homeVoice=SP.voice=true;updVoice();unlock();say([{t:'要語音說明',zh:1}])};
$('#vOff').onclick=()=>{SP.homeVoice=SP.voice=false;updVoice();hush()};
$('#bHome').onclick=()=>{if(G.screen==='game'&&G.mode==='solo')openMap();else goHome()};
$('#bPause').onclick=pauseGame;$('#resumeBtn').onclick=resumeGame;
$('#pauseBack').onclick=()=>{G.paused=false;$('#pauseOv').hidden=true;G.mode==='solo'?openMap():goHome()};
$('#nameIn').addEventListener('change',readName);
$('#startBtn').onclick=()=>{unlock();FX.pop();goHome()};
$('#bVoice').onclick=()=>{SP.voice=!SP.voice;updVoice();if(!SP.voice){hush()}else say([{t:$('#instr').textContent,zh:1,gap:300},...G.promptItems])};
const replay=()=>{hush();if(G.onReplay)G.onReplay();else say(G.promptItems)};
$('#bAgain').onclick=replay;
$('#bSlow').onclick=()=>{SP.rate=Math.max(.55,+(SP.rate-.15).toFixed(2));replay()};
$('#bFast').onclick=()=>{SP.rate=Math.min(1.45,+(SP.rate+.15).toFixed(2));replay()};
if(/\bLine\//i.test(navigator.userAgent)){
  $('#lineLink').onclick=e=>{e.preventDefault();hush();openExt();};$('#lineTip').hidden=false;
}
$('#lOn').onclick=()=>{SP.learnOn=true;$('#lOn').classList.add('on');$('#lOff').classList.remove('on')};
$('#lOff').onclick=()=>{SP.learnOn=false;$('#lOff').classList.add('on');$('#lOn').classList.remove('on')};
applyTheme(theme);updVoice();renderChars();
/* ---------- 開始 ---------- */
(function(){const B=bootParams();
  if(B.nm!==null&&B.nm!==undefined){G.name=B.nm.slice(0,10);store.set('wwName',G.name);$('#nameIn').value=G.name;}
  if(B.av!==null&&B.av!==undefined&&CHARS[+B.av]){G.char=+B.av;store.set('wwChar',G.char);renderChars();}
  /* 已經試過跳到瀏覽器，卻還留在 LINE 裡：Android 直接叫 Chrome 打開；iPhone 告訴大人怎麼做 */
  if(B.failed){show('splash');if(/Android/i.test(XUA))toChrome(B.url);else extHelp(B.url);return;}
  /* 從 LINE 換過來的：不再顯示封面，直接到地圖。手機允許的話馬上出聲；不允許的話，第一次點畫面就會出聲 */
  if(B.go==='start'&&!XLINE){needUnlock=true;openMap();return;}
  show('splash');})();
</script>
