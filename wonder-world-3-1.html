<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>天氣闖關大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* 版面：固定一個畫面（不捲動），上方工具列＋中間遊戲區；三種介面用 data-skin 切換 */
:root{
  --bg1:#bfe6ff; --bg2:#fff1c9; --ink:#1d3557; --soft:#4f6787; --panel:#ffffff; --panelInk:#1d3557;
  --accent:#ff6b4a; --accentDk:#d9482a; --accent2:#2b8ef0; --good:#22a861; --line:#d3e0ee; --opt:#ffffff;
  --hint:#ffd43b; --pen:#1e3a8a;
  --f-en:"Andika","Comic Sans MS","Trebuchet MS",sans-serif;
  --f-ui:"Fredoka","PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;
  color-scheme:light;
}
:root[data-skin="sea"]{
  --bg1:#9eeaf0; --bg2:#1b6f9e; --ink:#08324b; --soft:#1f5876; --panel:#f2fdff; --panelInk:#08324b;
  --accent:#ff8a3d; --accentDk:#d9661c; --accent2:#0aa1c2; --line:#bfe3ec; --opt:rgba(255,255,255,.75); --pen:#0b4f71;
}
:root[data-skin="space"]{
  --bg1:#31237a; --bg2:#0c0a29; --ink:#ffffff; --soft:#cfc8ff; --panel:#2c2470; --panelInk:#ffffff;
  --accent:#ffb703; --accentDk:#d48f00; --accent2:#6fdcff; --line:#4c42a0; --opt:#3b3190; --pen:#1e3a8a;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:var(--bg1);color:var(--ink);font-family:var(--f-ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
#app{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg1),var(--bg2));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
#deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#bar,#stage{position:relative;z-index:1}
/* 工具列 */
#bar{display:flex;flex-direction:column;gap:4px;padding-block:6px 4px;flex:none}
.row1,.row2{display:flex;align-items:center;gap:6px}
.row2{justify-content:flex-end;flex-wrap:nowrap}
#title{flex:1;min-width:0;font-weight:700;font-size:clamp(15px,2.6vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.tb{border:0;border-radius:12px;background:var(--panel);color:var(--panelInk);font-size:clamp(13px,2.2vw,16px);font-weight:700;padding:6px 10px;box-shadow:0 3px 0 rgba(0,0,0,.18);white-space:nowrap}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
#btnHome{background:var(--accent);color:#fff}
#btnPause{background:var(--accent2);color:#fff}
#pauseBox{position:fixed;inset:0;z-index:58;background:rgba(10,20,40,.6);display:grid;place-items:center;padding:16px}
body.paused #app *{animation-play-state:paused!important}
#pauseBox .mbuddy{animation:floaty 2s ease-in-out infinite}
#pauseBox .mbox{width:auto;min-width:min(300px,84vw)}
#stars{font-family:var(--f-ui);font-weight:700;font-size:clamp(16px,3vw,24px);background:var(--panel);color:var(--panelInk);border-radius:14px;padding:4px 12px;box-shadow:0 3px 0 rgba(0,0,0,.18);white-space:nowrap}
#stars .st{color:#f5a700}
#stars.bump{animation:bump .4s}
#speedLbl{font-size:13px;font-weight:700;color:var(--soft);white-space:nowrap}
#voiceBtn.off{background:var(--accent2);color:#fff}
/* 遊戲區 */
#stage{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:6px}
#stage.scroll{overflow-y:auto}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.shead{display:flex;align-items:center;gap:8px;flex:none}
.instr{flex:1;min-width:0;font-size:clamp(14px,2.4vw,19px);font-weight:700;color:var(--ink)}
.prog{display:flex;gap:4px;flex:none}
.prog i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.prog i.on{background:var(--accent)}
.prog i.now{background:var(--accent2);transform:scale(1.3)}
.buddy{font-size:clamp(28px,6vw,44px);line-height:1;flex:none}
.buddy.dance{animation:dance .8s}
.play{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.ctrl{display:flex;gap:10px;justify-content:center;flex:none;flex-wrap:wrap}
.b1,.b2{border:0;border-radius:18px;font-weight:700;font-size:clamp(17px,3vw,24px);padding:10px 22px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.b1{background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accentDk)}
.b2{background:var(--panel);color:var(--panelInk)}
.b1:active,.b2:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.b1[disabled]{opacity:.5}
/* 圖片 */
.wx{width:100%;height:100%;display:block;overflow:visible}
.wx .spin{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite}
.wx .bob{animation:bob 3.2s ease-in-out infinite}
.wx .drop{animation:drop 1.1s linear infinite}
.wx .swirl{stroke-dasharray:14 6;animation:dash 1.2s linear infinite}
.wx .leaf{animation:leaf 2.6s linear infinite}
.wx .flake{transform-box:fill-box;transform-origin:center;animation:flake 3.5s ease-in-out infinite}
.wx .wave{animation:wave 1s ease-in-out infinite alternate}
.wx .shiver{transform-box:fill-box;transform-origin:center;animation:shiver .25s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateX(5px)}}
@keyframes drop{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(20px);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes leaf{0%{transform:translate(-10px,0) rotate(0)}100%{transform:translate(95px,-8px) rotate(540deg)}}
@keyframes flake{50%{transform:translateY(5px) rotate(60deg)}}
@keyframes wave{to{transform:translateY(-4px)}}
@keyframes shiver{25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
@keyframes bump{40%{transform:scale(1.25)}}
@keyframes dance{25%{transform:rotate(-15deg) translateY(-8px)}50%{transform:rotate(0) translateY(0)}75%{transform:rotate(15deg) translateY(-8px)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes glow{50%{box-shadow:0 0 0 8px var(--hint),0 0 24px 8px var(--hint)}}
@keyframes floaty{50%{transform:translateY(-10px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
.shake{animation:shake .45s}
.hint{animation:glow 1s ease-in-out infinite !important}
/* 首頁 */
.home{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:6px;text-align:center}
.logo{display:flex;align-items:center;gap:8px}
.logo .lp{width:clamp(48px,10vmin,90px);height:clamp(48px,10vmin,90px)}
.logo h1{margin:0;font-size:clamp(28px,6.5vmin,56px);line-height:1.05;color:var(--ink);text-shadow:0 3px 0 rgba(255,255,255,.5)}
:root[data-skin="space"] .logo h1{text-shadow:0 3px 0 rgba(0,0,0,.4)}
.logo small{display:block;font-family:var(--f-en);font-size:clamp(16px,3vmin,24px);color:var(--soft);font-weight:700}
.lab{font-weight:700;font-size:clamp(14px,2.5vmin,19px);color:var(--soft)}
.buddies{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bd{border:4px solid transparent;background:var(--panel);color:var(--panelInk);border-radius:20px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.bd span{font-size:clamp(30px,7vmin,50px);line-height:1.1}
.bd.sel{border-color:var(--accent);transform:scale(1.06)}
#nameIn{font:inherit;font-size:clamp(16px,2.8vmin,20px);padding:8px 12px;border-radius:14px;border:3px solid var(--line);width:min(260px,70vw);text-align:center;background:var(--panel);color:var(--panelInk);-webkit-user-select:text;user-select:text}
.bigbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.bigbtns .b1{font-size:clamp(22px,4.5vmin,34px);padding:12px 30px;animation:pulse 1.6s ease-in-out infinite}
.skins{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.sk{border:3px solid transparent;border-radius:14px;padding:6px 10px;font-weight:700;font-size:14px;color:#1d3557;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.sk.sel{border-color:var(--accent)}
.sk[data-s="sky"]{background:linear-gradient(#bfe6ff,#fff1c9)}
.sk[data-s="sea"]{background:linear-gradient(#9eeaf0,#4aa8cf)}
.sk[data-s="space"]{background:linear-gradient(#31237a,#0c0a29);color:#fff}
/* 地圖 */
.map{flex:1;min-height:0;display:grid;gap:10px;grid-template-columns:repeat(var(--mc,4),1fr);grid-auto-rows:1fr;padding:4px}
.node{position:relative;border:0;border-radius:22px;background:var(--panel);color:var(--panelInk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;box-shadow:0 5px 0 rgba(0,0,0,.18);min-height:0;overflow:hidden}
.node .num{position:absolute;top:6px;left:8px;width:26px;height:26px;border-radius:50%;background:var(--accent2);color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px}
.node .ic{font-size:clamp(26px,6vmin,46px);line-height:1}
.node .nm{font-weight:700;font-size:clamp(14px,2.5vmin,19px)}
.node .ns{font-size:clamp(12px,2vmin,15px);color:#f5a700;font-weight:700;min-height:1.2em}
.node.done{background:linear-gradient(var(--panel),color-mix(in srgb,var(--good) 18%,var(--panel)))}
.node.next{outline:4px solid var(--accent);animation:pulse 1.4s ease-in-out infinite}
.node .me{position:absolute;right:6px;top:4px;font-size:clamp(22px,4.5vmin,34px);animation:floaty 1.2s ease-in-out infinite}
.mapfoot{display:flex;justify-content:center;gap:10px;flex:none}
/* 選項 */
.opts{display:flex;gap:clamp(8px,2vw,18px);justify-content:center;align-items:stretch;flex-wrap:wrap;width:100%}
.card{position:relative;border:4px solid transparent;background:var(--opt);color:var(--panelInk);border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 14px}
.card.off{opacity:.35;filter:grayscale(1)}
.card.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,var(--opt))}
.wordopt{font-family:var(--f-en);font-weight:700;font-size:clamp(28px,6vmin,52px);min-width:min(40vw,200px)}
.sentopt{font-family:var(--f-en);font-weight:700;font-size:clamp(20px,4.2vmin,34px);width:min(92%,560px);flex-direction:row;justify-content:space-between}
.say{border:0;border-radius:12px;background:var(--accent2);color:#fff;font-family:var(--f-ui);font-weight:700;font-size:clamp(13px,2.2vmin,16px);padding:5px 10px}
.again{white-space:nowrap}
.bigpic{width:min(62vw,36vh,300px);height:min(62vw,36vh,300px);flex:none}
.midpic{width:min(48vw,26vh,220px);height:min(48vw,26vh,220px);flex:none}
/* 認識單字 */
.learn{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,40px);flex-wrap:wrap;width:100%}
.linfo{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.lword{font-family:var(--f-en);font-weight:700;font-size:clamp(46px,11vmin,100px);line-height:1;color:var(--ink)}
.lword .r{color:var(--accent)}
.lword .ch{display:inline-block;transition:transform .2s,color .2s;position:relative}
.lword .ch.big{transform:scale(1.7) translateY(-8%);color:var(--accent2);z-index:2;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.lword{letter-spacing:.06em}
.lzh{font-size:clamp(20px,4vmin,32px);font-weight:700}
.rootnote,.sentb{border:0;border-radius:14px;background:var(--panel);color:var(--panelInk);font-size:clamp(15px,2.6vmin,20px);font-weight:700;padding:6px 12px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.rootnote b{font-family:var(--f-en);color:var(--accent);font-size:1.15em}
.sentb{font-family:var(--f-en);font-size:clamp(20px,3.6vmin,30px)}
/* 氣球（三種介面形狀不同） */
.bals{display:flex;gap:clamp(10px,3vw,30px);justify-content:center;align-items:flex-end;width:100%}
.bal{--sz:min(29vw,34vh,230px);position:relative;width:var(--sz);height:calc(var(--sz)*1.18);border:0;background:none;padding:0;animation:floaty 2.4s ease-in-out infinite}
.bal:nth-child(2){animation-delay:.6s}.bal:nth-child(3){animation-delay:1.2s}
.bal .bin{position:absolute;inset:0 0 18% 0;border-radius:50% 50% 47% 47%/55% 55% 45% 45%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85),rgba(255,255,255,0) 30%),var(--bc,#ff8fa3);display:grid;place-items:center;box-shadow:inset -8px -10px 0 rgba(0,0,0,.08)}
.bal .bin .wx{width:70%;height:70%}
.bal::after{content:"";position:absolute;left:50%;bottom:0;width:2px;height:18%;background:rgba(60,60,60,.5)}
.bal::before{content:"";position:absolute;left:calc(50% - 7px);bottom:16%;border:7px solid transparent;border-bottom-color:var(--bc,#ff8fa3)}
:root[data-skin="sea"] .bal .bin{border-radius:50%;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.95),rgba(255,255,255,0) 22%),radial-gradient(circle,rgba(255,255,255,.35) 60%,rgba(170,240,255,.9));border:3px solid rgba(255,255,255,.9);inset:4% 0 8% 0}
:root[data-skin="sea"] .bal::after,:root[data-skin="sea"] .bal::before{display:none}
:root[data-skin="space"] .bal .bin{border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,0) 35%),var(--bc,#8b7bff);inset:8% 4% 8% 4%;box-shadow:inset -10px -12px 0 rgba(0,0,0,.18)}
:root[data-skin="space"] .bal::before{left:-6%;right:-6%;bottom:42%;height:10%;border:4px solid rgba(255,220,120,.9);border-radius:50%;transform:rotate(-14deg);width:auto;z-index:2;pointer-events:none}
:root[data-skin="space"] .bal::after{display:none}
.bal.off{opacity:.3;filter:grayscale(1)}
.bq{display:flex;align-items:center;gap:10px;flex:none}
.balcell{display:flex;flex-direction:column;align-items:center;gap:6px}
.bword{font-family:var(--f-en);font-weight:700;font-size:calc(var(--sz)*.2);color:#1d3557;text-shadow:0 0 6px #fff,0 0 3px #fff;position:relative;z-index:3}
.askbar{background:var(--panel);color:var(--panelInk);border:4px solid var(--accent);border-radius:22px;padding:8px 22px;font-weight:700;font-size:clamp(22px,5vmin,36px);animation:pulse 1.4s ease-in-out infinite}
.askbar b{font-family:var(--f-en);color:var(--accent);font-size:1.3em}
.bigpick{padding:10px}
.bigpick .wx{width:min(36vw,30vh,230px);height:min(36vw,30vh,230px)}
.listenbig{font-size:clamp(26px,6vmin,44px);padding:16px 36px}
.bal.popped{animation:popout .45s forwards}
.bal.hint .bin{animation:glow 1s ease-in-out infinite}
.bal.hint{animation:none}
@keyframes popout{40%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
/* 拼字 */
.slots{display:flex;gap:6px;justify-content:center}
.slot{width:clamp(40px,9vmin,72px);height:clamp(52px,11vmin,88px);border-bottom:5px solid var(--accent2);display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:clamp(36px,8vmin,64px);color:var(--ink)}
.slot.cur{border-bottom-color:var(--accent);animation:pulse 1s infinite}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{width:clamp(52px,12vmin,90px);height:clamp(52px,12vmin,90px);border:0;border-radius:18px;background:var(--panel);color:var(--panelInk);font-family:var(--f-en);font-weight:700;font-size:clamp(34px,7.5vmin,58px);box-shadow:0 5px 0 rgba(0,0,0,.2)}
:root[data-skin="sea"] .tile{border-radius:50%}
:root[data-skin="space"] .tile{border-radius:30% 70% 60% 40%/50% 40% 60% 50%;background:var(--opt)}
.tile.used{visibility:hidden}
/* 主播 */
.tv{background:#3a3f4a;border-radius:22px;padding:10px 10px 4px;box-shadow:0 6px 0 rgba(0,0,0,.25);flex:none}
.tvs{background:linear-gradient(#e9f6ff,#bfe2ff);border-radius:14px;display:flex;align-items:center;gap:8px;padding:6px 12px}
.city{font-family:var(--f-en);font-weight:700;font-size:clamp(22px,4.5vmin,36px);color:#1d3557;text-align:center}
.city small{display:block;font-family:var(--f-ui);font-size:.6em}
.tvl{color:#ffd43b;font-weight:700;font-size:12px;letter-spacing:.15em;text-align:center;padding-top:2px;font-family:var(--f-en)}
.qline{display:flex;flex-direction:column;align-items:center;gap:2px}
.qbtn{border:0;background:var(--panel);color:var(--panelInk);border-radius:16px;padding:6px 14px;font-family:var(--f-en);font-weight:700;font-size:clamp(22px,4.4vmin,36px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.qzh{font-size:clamp(14px,2.4vmin,18px);font-weight:700;color:var(--soft)}
/* 句子 */
.sline{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:clamp(56px,10vmin,80px);align-items:center}
.sbox{min-width:clamp(56px,11vmin,90px);height:clamp(50px,9vmin,72px);border-bottom:5px solid var(--accent2);display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:clamp(26px,5.5vmin,44px);padding:0 6px;color:var(--ink)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{border:0;border-radius:16px;background:var(--panel);color:var(--panelInk);font-family:var(--f-en);font-weight:700;font-size:clamp(26px,5.5vmin,44px);padding:6px 16px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.chip.used{visibility:hidden}
.szh{font-size:clamp(15px,2.6vmin,20px);font-weight:700;color:var(--soft)}
/* 書寫 */
.wtop{display:flex;align-items:center;gap:10px;flex:none;flex-wrap:wrap;justify-content:center}
.wpic{width:clamp(56px,12vmin,100px);height:clamp(56px,12vmin,100px)}
.wword{font-family:var(--f-en);font-weight:700;font-size:clamp(30px,6.5vmin,54px)}
.wword small{font-family:var(--f-ui);font-size:.45em;margin-left:6px}
.padhost{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none}
.pad{position:relative;touch-action:none;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.18);background:#fff;overflow:hidden;flex:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
/* 對戰 */
.teams{display:flex;gap:8px;justify-content:center;flex:none;flex-wrap:wrap}
.team{border-radius:16px;padding:4px 12px;font-weight:700;font-size:clamp(15px,2.8vmin,22px);color:#fff;background:var(--tc);opacity:.55;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.team.on{opacity:1;transform:scale(1.1);outline:3px solid #fff}
.turn{font-size:clamp(18px,3.4vmin,28px);font-weight:700;text-align:center}
.picopt{padding:6px}
.picopt .wx{width:min(25vw,24vh,170px);height:min(25vw,24vh,170px)}
/* 疊層 */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,40,.55);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);color:var(--panelInk);border-radius:28px;padding:18px 22px;max-width:min(520px,92vw);width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.mbox h2{margin:0;font-size:clamp(26px,5.5vmin,40px)}
.mstars{font-size:clamp(26px,6vmin,44px);color:#f5a700;letter-spacing:2px;word-break:break-all}
.mbuddy{font-size:clamp(56px,13vmin,100px);animation:dance 1s ease-in-out infinite}
.mbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#splash{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(180deg,var(--bg1),var(--bg2));text-align:center;padding:16px}
#splash .go{font-size:clamp(28px,7vmin,48px);padding:18px 40px;animation:pulse 1.4s infinite}
#splash h1{margin:0;font-size:clamp(30px,7vmin,56px)}
.linebox{background:#06c755;color:#fff;border-radius:20px;padding:12px 18px;font-weight:700;font-size:clamp(17px,3.4vmin,24px);text-decoration:none;box-shadow:0 5px 0 #048a3b;display:block;max-width:92vw}
.small{font-size:14px;color:var(--soft);font-weight:700}
#more{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--accent2);color:#fff;font-weight:700;border-radius:16px;padding:6px 14px;font-size:15px;pointer-events:none}
.ptext{position:fixed;z-index:61;pointer-events:none;font-weight:700;font-size:clamp(24px,5vmin,40px);color:var(--accent);text-shadow:0 2px 0 #fff,0 0 8px #fff;white-space:nowrap}
.flystar{position:fixed;z-index:62;pointer-events:none;font-size:34px;color:#f5a700}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:55;background:var(--panel);color:var(--panelInk);border:4px solid var(--accent2);border-radius:20px;padding:12px 20px;font-weight:700;font-size:clamp(18px,3.6vmin,28px);pointer-events:none;text-align:center;max-width:90vw}
/* 背景裝飾 */
.dz{position:absolute;opacity:.85}
.dcloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.drise{animation:rise linear infinite}
@keyframes rise{from{transform:translateY(110vh)}to{transform:translateY(-20vh)}}
.dtw{animation:tw 2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s !important;animation-iteration-count:1 !important}}
@media (max-height:520px){ .bigpic{width:min(34vh,240px);height:min(34vh,240px)} .midpic{width:20vh;height:20vh} .play{gap:5px} .scr{gap:4px} .slot{height:12vh;font-size:9vh;width:9vh} .tile{width:13vh;height:13vh;font-size:9vh} .sbox{height:11vh;font-size:7.5vh;min-width:9vh} .sline{min-height:11vh} .chip{font-size:7.5vh;padding:2px 12px} .sentopt{font-size:6vh;width:auto;padding:4px 10px;gap:8px} .card{padding:4px 12px} .qbtn{font-size:6.5vh;padding:2px 12px} .tv{padding:5px 5px 2px} .tvs{padding:2px 8px} .city{font-size:6vh} .tvl{display:none} .b1,.b2{padding:6px 18px;font-size:6vh} .wordopt{font-size:9vh} .bal{--sz:min(24vw,27vh)} .balcell{gap:2px} .bq .midpic{width:17vh;height:17vh} #bar{gap:2px;padding-block:3px 2px} .tb{padding:4px 8px} }

const XUA=navigator.userAgent,XLINE=/\bLine\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(XUA);

/* 開到瀏覽器時，網址帶著「要回到哪裡」：go=start 直接進地圖，名字和好朋友也一起帶過去 */
const XKEYS=['go','nm','av','openExternalBrowser'];
function extUrl(extra){const u=new URL(location.href.split('#')[0]);XKEYS.forEach(k=>u.searchParams.delete(k));
  if(extra)for(const [k,v] of Object.entries(extra))if(v!==undefined&&v!==null&&v!=='')u.searchParams.set(k,v);return u.toString();}
const toChrome=u=>{location.href='intent://'+u.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(u)+';end';};
function openExt(extra){const u=extUrl(extra);
  if(/\bLine\//i.test(XUA)){location.href=u+(u.indexOf('?')<0?'?':'&')+'openExternalBrowser=1';return;}

/* 沒辦法自動跳到瀏覽器時（例如 iPhone 的 Facebook、或 LINE 沒有反應），告訴大人怎麼做 */
function extHelp(u){const ios=/iPhone|iPad|iPod/i.test(XUA);
  const m=document.createElement('div');m.className='xwm';
  m.innerHTML=`<div class="xwb"><div style="font-size:3rem">🌐</div><h2>請用瀏覽器開啟</h2><div class="xwt">${ios?'請按畫面右下角或右上角的「⋯」或「分享」，<br>選「用 Safari 開啟」或「以預設瀏覽器開啟」。':'請按右上角的「⋮」，選「用瀏覽器開啟」。'}<br>也可以按「複製網址」，貼到 Safari 或 Chrome。</div><div><button class="xg" data-x="c">複製網址</button><button class="xy" data-x="x">先在這裡玩</button></div></div>`;
  document.body.appendChild(m);

function copyUrl(u,btn){const ok=()=>{if(btn)btn.textContent='網址已複製';};

const goExt=(nm,av)=>{if(XLINE&&!stayHere){openExt({go:'start',nm,av});return true;}return false;};
function bootParams(){let q;try{q=new URLSearchParams(location.search);}catch(e){return {};}

document.addEventListener('click',e=>{if(!needUnlock)return;needUnlock=false;gestureUnlock();

function tone(f,dur,o={}){const a=audio();if(!a)return;const t=a.currentTime+(o.at||0);const os=a.createOscillator(),g=a.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);os.connect(g).connect(a.destination);os.start(t);os.stop(t+dur+.05);}
function noise(dur,o={}){const a=audio();if(!a)return;const t=a.currentTime+(o.at||0);const s=a.createBufferSource();s.buffer=NB;const f=a.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.value=o.freq||1500;f.Q.value=o.q||1;const g=a.createGain();g.gain.setValueAtTime(o.vol||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(a.destination);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}
const SFX={
  ding(){tone(988,.18,{vol:.2});tone(1319,.4,{vol:.2,at:.1});},

  pop(){noise(.12,{vol:.6,freq:900,q:.7});tone(700,.12,{vol:.15,slide:180});},
  bubble(){tone(320,.16,{slide:1000,vol:.2});tone(420,.14,{slide:1200,vol:.15,at:.1});},
  zap(){tone(1400,.25,{slide:300,vol:.12,type:'triangle'});tone(900,.3,{slide:1800,vol:.1,at:.12});},
  wrong(){tone(200,.2,{type:'triangle',vol:.1});},
  tick(){tone(1250,.06,{vol:.12,type:'square'});},
  applause(){for(let i=0;i<45;i++)noise(.05,{vol:.22+Math.random()*.2,at:Math.random()*1.7,freq:1100+Math.random()*1600,q:1.4});},
  fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.24,{type:'square',vol:.07,at:i*.13}));tone(1047,.7,{type:'square',vol:.07,at:.55});tone(1319,.7,{type:'triangle',vol:.1,at:.55});},
  firework(at=0){tone(300,.5,{slide:1500,vol:.05,at});noise(.6,{vol:.4,at:at+.5,freq:2500,type:'highpass'});for(let i=0;i<8;i++)noise(.04,{vol:.2,at:at+.6+Math.random()*.5,freq:4000,q:2});},

/* ========== 特效（彩帶、煙火、星星） ========== */
const FX={ps:[],run:false,
  init(){this.c=$('#fx');this.g=this.c.getContext('2d');this.size();addEventListener('resize',()=>this.size());},
  size(){const d=Math.min(2,devicePixelRatio||1);this.c.width=innerWidth*d;this.c.height=innerHeight*d;this.g.setTransform(d,0,0,d,0,0);},
  add(p){this.ps.push(Object.assign({vx:0,vy:0,g:.15,drag:.985,life:90,rot:0,vr:0,s:8,shape:'rect',col:'#f00'},p));if(!this.run){this.run=true;requestAnimationFrame(()=>this.loop());}},
  loop(){const g=this.g;g.clearRect(0,0,innerWidth,innerHeight);this.ps=this.ps.filter(p=>p.life>0);
    for(const p of this.ps){p.vy+=p.g;p.vx*=p.drag;p.vy*=p.drag;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;
      g.save();g.globalAlpha=Math.min(1,p.life/25);g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.col;
      if(p.shape==='star'){starPath(g,p.s);g.fill();}
      else if(p.shape==='dot'){g.beginPath();g.arc(0,0,p.s,0,7);g.fill();}
      else if(p.shape==='balloon'){g.beginPath();g.ellipse(0,0,p.s*.8,p.s,0,0,7);g.fill();g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1.5;g.beginPath();g.moveTo(0,p.s);g.quadraticCurveTo(6,p.s*1.6,0,p.s*2.3);g.stroke();g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.arc(-p.s*.3,-p.s*.4,p.s*.18,0,7);g.fill();}
      else g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      g.restore();}
    if(this.ps.length)requestAnimationFrame(()=>this.loop());else{this.run=false;g.clearRect(0,0,innerWidth,innerHeight);}}
};
function starPath(g,r){g.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}g.closePath();}
const COLS=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c','#4cc9f0'];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(x,y,n=24,shape){for(let i=0;i<(RM?6:n);i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*6;FX.add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,col:pickOne(COLS),s:6+Math.random()*8,shape:shape||pickOne(['rect','star','dot']),vr:(Math.random()-.5)*.3,life:60+Math.random()*30});}}
function confettiRain(){for(let i=0;i<(RM?20:140);i++)FX.add({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.05,drag:.995,col:pickOne(COLS),s:8+Math.random()*8,vr:(Math.random()-.5)*.3,life:220});}
function fireworks(k=5){for(let j=0;j<k;j++)setTimeout(()=>{const x=innerWidth*(.15+Math.random()*.7),y=innerHeight*(.15+Math.random()*.35),c=pickOne(COLS);SFX.firework();for(let i=0;i<(RM?10:46);i++){const a=i/46*Math.PI*2,v=3+Math.random()*3.5;FX.add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.06,drag:.97,col:c,s:3.5,shape:'dot',life:70});}},j*420);}
function balloonsUp(){for(let i=0;i<(RM?6:26);i++)FX.add({x:Math.random()*innerWidth,y:innerHeight+30+Math.random()*200,vx:(Math.random()-.5)*.6,vy:-(2.5+Math.random()*2.5),g:0,drag:1,col:pickOne(COLS),s:16+Math.random()*10,shape:'balloon',life:260});}

/* ========== 天氣圖（會動的 SVG） ========== */
const f1=n=>Math.round(n*10)/10;
function sunG(cx,cy,r,face=true){let rays='';for(let i=0;i<12;i++){const a=i*Math.PI/6,r1=r+4,r2=r+(i%2?9:14);rays+=`<line x1="${f1(cx+r1*Math.cos(a))}" y1="${f1(cy+r1*Math.sin(a))}" x2="${f1(cx+r2*Math.cos(a))}" y2="${f1(cy+r2*Math.sin(a))}"/>`;}

  (face?`<circle cx="${f1(cx-r*.33)}" cy="${f1(cy-r*.12)}" r="${f1(r*.1)}" fill="#6b3f00"/><circle cx="${f1(cx+r*.33)}" cy="${f1(cy-r*.12)}" r="${f1(r*.1)}" fill="#6b3f00"/><path d="M${f1(cx-r*.38)} ${f1(cy+r*.2)} Q${cx} ${f1(cy+r*.6)} ${f1(cx+r*.38)} ${f1(cy+r*.2)}" stroke="#6b3f00" stroke-width="${f1(r*.1)}" fill="none" stroke-linecap="round"/>`:'');}
function cloudG(x,y,s,fill,edge,face){const sh=c=>`<circle cx="-14" cy="2" r="12" ${c}/><circle cx="2" cy="-6" r="16" ${c}/><circle cx="17" cy="3" r="11" ${c}/><rect x="-26" y="2" width="54" height="13" rx="6.5" ${c}/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="bob"><g fill="${edge}" stroke="${edge}" stroke-width="3">${sh('')}</g><g fill="${fill}">${sh('')}</g>`+
  (face?`<circle cx="-6" cy="3" r="1.6" fill="#55657a"/><circle cx="8" cy="3" r="1.6" fill="#55657a"/><path d="M-3 8 Q1 10 5 8" stroke="#55657a" stroke-width="1.3" fill="none" stroke-linecap="round"/>`:'')+`</g></g>`;}
function thermo(x,lv,c){const yt=f1(16+56*(1-lv));return `<rect x="${x-6}" y="10" width="12" height="66" rx="6" fill="#fff" stroke="#8a97ab" stroke-width="2"/><rect x="${x-3}" y="${yt}" width="6" height="${f1(80-yt)}" rx="3" fill="${c}"/><circle cx="${x}" cy="82" r="9" fill="${c}" stroke="#8a97ab" stroke-width="2"/>`;}
function flake(x,y,r,d){let l='';for(const a of [0,60,120]){const t=a*Math.PI/180;l+=`<line x1="${f1(x-r*Math.cos(t))}" y1="${f1(y-r*Math.sin(t))}" x2="${f1(x+r*Math.cos(t))}" y2="${f1(y+r*Math.sin(t))}"/>`;}return `<g class="flake" style="animation-delay:${d}s" stroke="#5aaef5" stroke-width="2.6" stroke-linecap="round">${l}</g>`;}
function pic(w){let b='';

  else if(w==='rainy'){b=cloudG(50,36,1.5,'#a6b3c4','#72839a');[28,40,52,64,76].forEach((x,i)=>{b+=`<line class="drop" style="animation-delay:${i*.22}s" x1="${x}" y1="62" x2="${x-2}" y2="71" stroke="#2f86e0" stroke-width="3.6" stroke-linecap="round"/>`;});}
  else if(w==='windy')b=`<g fill="none" stroke="#3d95e6" stroke-width="5" stroke-linecap="round"><path class="swirl" d="M6 38 H56 C72 38 74 18 61 17 C50 16 49 29 57 30"/><path class="swirl" d="M12 58 H70 C88 58 90 79 76 81 C65 82 64 70 72 69"/><path class="swirl" d="M20 76 H46"/></g><g class="leaf"><ellipse cx="6" cy="24" rx="7" ry="3.6" fill="#5fb944"/></g>`;

const sName=i=>{const n=STAGES[i].name;return typeof n==='function'?n():n;};
const sIc=i=>{const n=STAGES[i].ic;return typeof n==='function'?n():n;};
/* 下一關：從剛玩完的那一關往後找還沒過的關；後面都過了，才回頭找前面沒過的關 */
function nextStageIdx(){const s=state.lastDone>=0?state.lastDone+1:0;for(let k=0;k<STAGES.length;k++){const i=(s+k)%STAGES.length;if(!state.cleared[i])return i;}return -1;}
function showMap(){resetScreen();const who=state.name||'小勇士';setTitle(who+' 的闖關地圖');
  const st=$('#stage');st.innerHTML='';

  const nx=nextStageIdx();

  const order=[];for(let r=0;r<STAGES.length/cols;r++){const row=[];for(let c=0;c<cols;c++)if(r*cols+c<STAGES.length)row.push(r*cols+c);if(r%2)row.reverse();order.push(...row);}
  const m=el(`<div class="map" style="--mc:${cols}"></div>`);
  order.forEach(i=>{const done=state.cleared[i];const n=el(`<button class="node ${done?'done':''} ${i===nx?'next':''}"><span class="num">${i+1}</span><span class="ic">${sIc(i)}</span><span class="nm">${sName(i)}</span><span class="ns">${done?'★ '+state.best[i]:(i===nx?'下一關':'')}</span>${i===nx?`<span class="me">${BUDDIES[state.buddy].e}</span>`:''}</button>`);

  const scr=el('<div class="scr"></div>');scr.appendChild(m);

  $('#goNext').onclick=()=>{Speech.stop();if(nx>=0)STAGES[nx].run();else{state.cleared={};state.lastDone=-1;showMap();}};

function stageFrame(id,instrText,total){resetScreen();setTitle('第 '+(id+1)+' 關　'+sName(id));setBack('map');

function runStage(id,instrText,qs,render){const F=stageFrame(id,instrText,qs.length);let i=0,got=0;

    correct(target,star=true){if(star){got++;addStar(target);}smallWin(target);later(()=>{i++;next();},1350);},
    skip(){later(()=>{i++;next();},900);}

  function next(){clearAllT();curTalk=null;cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[];

/* 選項共用：答錯會變灰、不能再按；錯兩次後正確答案會發亮提示 */

/* ---------- 第4關 字母拼拼看 ---------- */
function stSpell(id){const qs=sample(WORDS,4);
  runStage(id,'聽一聽，照順序點字母',qs,(w,api,i,play)=>{
  const word=w.w;let pos=0,wrong=0,lock=false;
  let letters=shuffle(word.split(''));let guard=0;while(letters.join('')===word&&guard++<10)letters=shuffle(word.split(''));
  play.appendChild(el(`<div class="midpic">${pic(word)}</div>`));
  const slots=el(`<div class="slots">${word.split('').map((_,k)=>`<div class="slot ${k===0?'cur':''}"></div>`).join('')}</div>`);
  const tiles=el(`<div class="tiles">${letters.map(c=>`<button class="tile" data-c="${c}">${c}</button>`).join('')}</div>`);
  play.appendChild(slots);play.appendChild(tiles);
  play.appendChild(el(`<div class="ctrl"><button class="b2 again" id="ag">再聽一次</button></div>`));
  const findNext=()=>[{zh:'找'},{letter:word[pos]}];
  const talk=curTalk=()=>say(instr('spell','聽一聽，照順序點字母。','照順序點字母。'),spellItems(word),{pause:300},findNext());
  $('#ag').onclick=talk;
  let stopIdle=idleRepeat(()=>say(findNext()),8000,3);
  $$('.tile',tiles).forEach(t=>t.onclick=()=>{if(lock||t.classList.contains('used'))return;
    if(t.dataset.c===word[pos]){t.classList.add('used');$$('.tile',tiles).forEach(x=>x.classList.remove('hint'));
      const sl=$$('.slot',slots);sl[pos].textContent=word[pos];sl[pos].classList.remove('cur');SFX.tick();pos++;wrong=0;
      stopIdle();
      if(pos<word.length){sl[pos].classList.add('cur');say({letter:word[pos-1]},{pause:200},findNext());stopIdle=idleRepeat(()=>say(findNext()),8000,3);}
      else{lock=true;say(spellItems(word));api.correct(slots,t._miss!==true&&slots._miss!==true);}
    }else{wrong++;slots._miss=wrong>1||slots._miss;t.classList.add('shake');SFX.wrong();lock=true;setTimeout(()=>{lock=false;t.classList.remove('shake');},500);
      if(wrong>=2){const r=$$('.tile',tiles).find(x=>!x.classList.contains('used')&&x.dataset.c===word[pos]);r&&r.classList.add('hint');}}
  });
  talk();});}

/* ---------- 第5、8關 書寫（描描看／自己寫寫看）---------- */
const FONT_EN='"Andika","Comic Sans MS","Trebuchet MS",sans-serif';
let fontP=null;function ensureFont(){if(!fontP)fontP=Promise.race([document.fonts?document.fonts.load('100px "Andika"').catch(()=>{}):Promise.resolve(),sleep(2500)]);return fontP;}
function layoutWord(word){const c=document.createElement('canvas').getContext('2d');c.font='100px '+FONT_EN;
  const asc=c.measureText('dlhkb').actualBoundingBoxAscent||72,desc=c.measureText('gypq').actualBoundingBoxDescent||24,xh=c.measureText('xzvwn').actualBoundingBoxAscent||48;
  const sp=24,mx=36;let x=mx;const pos=[];for(const ch of word){const w=c.measureText(ch).width;pos.push({ch,x,w});x+=w+sp;}
  const W=x-sp+mx,H=(asc+desc)/.74,base=H*.13+asc;return {asc,desc,xh,pos,W,H,base,k:H/W};}
function drawLetters(g,L,s,fill,stroke,lw,dash){g.font=(100*s)+'px '+FONT_EN;g.textBaseline='alphabetic';g.lineJoin='round';g.lineCap='round';
  for(const p of L.pos){if(fill){g.fillStyle=fill;g.fillText(p.ch,p.x*s,L.base*s);}if(stroke){g.lineWidth=lw;g.strokeStyle=stroke;g.setLineDash(dash||[]);g.strokeText(p.ch,p.x*s,L.base*s);g.setLineDash([]);}}}
function makePad(host,word,mode){const L=layoutWord(word);
  const wrap=el('<div class="pad"><canvas></canvas><canvas></canvas></div>');host.appendChild(wrap);
  const [cg,ci]=wrap.children;let Wp=0,Hp=0,dpr=1,strokes=[],cur=null,pid=null,hintOn=mode==='trace',pending=false;
  const ink=getComputedStyle(document.documentElement).getPropertyValue('--pen').trim()||'#1e3a8a';
  function fit(){if(cur){pending=true;return;}pending=false;const aw=host.clientWidth-4,ah=host.clientHeight-8;if(aw<50||ah<30)return;
    const w=Math.floor(Math.min(aw,ah/L.k,1100));if(w===Wp)return;Wp=w;Hp=Math.floor(w*L.k);dpr=Math.min(2,devicePixelRatio||1);
    for(const c of [cg,ci]){c.width=Wp*dpr;c.height=Hp*dpr;}wrap.style.width=Wp+'px';wrap.style.height=Hp+'px';drawG();drawI();}
  function drawG(){const g=cg.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,Wp,Hp);g.fillStyle='#fff';g.fillRect(0,0,Wp,Hp);const s=Wp/L.W;
    const ys=[L.base-L.asc,L.base-L.xh,L.base,L.base+L.desc].map(y=>y*s);
    ys.forEach((y,k)=>{g.beginPath();g.lineWidth=Math.max(1.5,Wp/450);g.strokeStyle=k===2?'#e57373':'#9fb3c8';g.setLineDash(k===1?[Wp/90,Wp/110]:[]);g.moveTo(Wp*.02,y);g.lineTo(Wp*.98,y);g.stroke();});g.setLineDash([]);
    if(hintOn)drawLetters(g,L,s,'#dde4ee','#7f8fa6',Math.max(1.5,Wp/380),[Wp/140,Wp/110]);
    else drawLetters(g,L,s,'rgba(120,140,170,.12)');}
  function line(g,pts,scale,lw,col){g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw;g.lineCap='round';g.lineJoin='round';
    if(pts.length===1){g.beginPath();g.arc(pts[0].x*scale,pts[0].y*scale,lw/2,0,7);g.fill();return;}
    g.beginPath();g.moveTo(pts[0].x*scale,pts[0].y*scale);for(let k=1;k<pts.length-1;k++){const a=pts[k],b=pts[k+1];g.quadraticCurveTo(a.x*scale,a.y*scale,(a.x+b.x)/2*scale,(a.y+b.y)/2*scale);}const z=pts[pts.length-1];g.lineTo(z.x*scale,z.y*scale);g.stroke();}
  function drawI(){const g=ci.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,Wp,Hp);for(const s of strokes)line(g,s,Wp,Hp*.065,ink);}
  const pt=e=>{const r=ci.getBoundingClientRect();return {x:(e.clientX-r.left)/Wp,y:(e.clientY-r.top)/Wp};};
  ci.addEventListener('pointerdown',e=>{e.preventDefault();if(cur)return;pid=e.pointerId;try{ci.setPointerCapture(pid);}catch(_){}cur=[pt(e)];strokes.push(cur);drawI();api.onDraw&&api.onDraw();});
  ci.addEventListener('pointermove',e=>{if(!cur||e.pointerId!==pid)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const v of (evs.length?evs:[e]))cur.push(pt(v));drawI();});
  const end=e=>{if(!cur||e.pointerId!==pid)return;cur=null;pid=null;if(pending)fit();};
  ci.addEventListener('pointerup',end);ci.addEventListener('pointercancel',end);ci.addEventListener('lostpointercapture',end);
  const ro=new ResizeObserver(()=>fit());ro.observe(host);cleanups.push(()=>ro.disconnect());
  function score(){const SW=280,sc=SW/L.W,SH=Math.ceil(L.H*sc);const mk=()=>{const c=document.createElement('canvas');c.width=SW;c.height=SH;return c.getContext('2d',{willReadFrequently:true});};
    const tz=mode==='trace'?.17:.27,tc=mode==='trace'?.15:.23;
    const gm=mk();drawLetters(gm,L,sc,'#000');
    const zm=mk();drawLetters(zm,L,sc,'#000','#000',tz*SH);
    const ik=mk();strokes.forEach(s=>line(ik,s,SW,tc*SH,'#000'));
    const it=mk();strokes.forEach(s=>line(it,s,SW,.065*SH,'#000'));

    if(w){if(Date.now()<(SH.tapUntil||0))return;SH.tapUntil=Date.now()+900;w.classList.remove('shJump');void w.getBoundingClientRect();w.classList.add('shJump');SFX.boing();var g=fxLayer();if(g){var bb=w.getBBox();for(var k=0;k<5;k++){var a=k/5*Math.PI*2;pt(g,'⭐',bb.x+bb.width/2,bb.y,18,'pfBurst',k*40,{'--dx':(Math.cos(a)*50|0)+'px','--dy':(Math.sin(a)*40|0)+'px'})}}return}
    if(Date.now()<SH.sndUntil)return;playSfx(null)};
  $s('#shText').innerHTML='<div class="shLine"><span class="shNo '+(pg.n?'':'star')+'">'+(pg.n||'★')+'</span><span class="shWho">'+whoIcon(pg.w)+'</span><div><div class="shEn">'+pg.en.split(' ').map(function(w){return '<span class="shW">'+w+'</span>'}).join(' ')+'</div><div class="shZh">'+pg.zh+'</div></div></div><div id="shTip">💡 '+pg.tip+'</div>';
  $$s('#shText .shW').forEach(function(sp){sp.onclick=function(e){e.stopPropagation();SH.ptok++;hush();var w=sp.textContent.replace(/[.,!?]/g,'');sp.classList.add('shOn');say([{t:w,lang:'en',r:.8}],function(){sp.classList.remove('shOn')})}});
  $s('#shPrev').disabled=i===0;$s('#shNext').textContent=i===SH.pages.length-1?'看完了':'下一頁';
  if(!SH.paused)read()}
function go(d){var n=SH.page+d;if(n<0)return;if(n>=SH.pages.length){close();SH.opt.onDone&&SH.opt.onDone();return}showPage(n)}
function close(){SH.closed=true;SH.ptok++;hush();var r=$s('#shRoot');if(r)r.hidden=true}

  open:function(opt){build();SH.opt=opt;SH.pages=opt.pages;SH.closed=false;SH.paused=false;$s('#shPause').hidden=true;
    $s('#shBack').textContent=opt.backText||'回闖關地圖';$s('#shRoot').hidden=false;audioWake();pickVoices();showPage(0)},
  close:close,isOpen:function(){var r=$s('#shRoot');return !!(r&&!r.hidden)},_SH:SH,_SFX:SFX,_tip:tipItems
};
