<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>海底潛水探險・國語三年級第四課〈小丑魚和海葵〉（第 14 回）</title>
<style>:root{
  --sky1:#7fd6ff;--sky2:#c9f0ff;--grass:#7ddc6a;--grass2:#4fbf4a;--sun:#ffd84d;--sun2:#ffb703;
  --coral:#ff6b6b;--coral2:#e04848;--blue:#3b9cff;--blue2:#1f78e0;--green:#3ecf72;--green2:#22a653;
  --purple:#9b6bff;--purple2:#7647e0;--ink:#2b3a55;--ink2:#5a6b8c;--card:#ffffff;--line:#d8e6f7;
  --bg:#e8f6ff;--shadow:0 .35rem 0 rgba(30,60,110,.18);--fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(clamp(14px,calc(.6vw + 1.2vh + 6px),32px)*var(--fs));height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-weight:700;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:.22rem solid var(--purple);outline-offset:.15rem}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:scr .25s ease}
@keyframes scr{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
ruby{ruby-position:over}
rt{font-size:.46em;font-weight:700;color:#d0301f;letter-spacing:0;user-select:none}
.zy-off rt{display:none}
.zy-on ruby{ruby-align:center}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:3rem;padding:.55rem 1.3rem;border-radius:1.1rem;
  background:var(--sun);color:#5a3b00;font-size:1.15rem;font-weight:900;box-shadow:0 .3rem 0 var(--sun2);position:relative;top:0;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(.28rem);box-shadow:0 .02rem 0 var(--sun2)}
.btn.g{background:var(--green);color:#fff;box-shadow:0 .3rem 0 var(--green2)}
.btn.g:active:not(:disabled){box-shadow:0 .02rem 0 var(--green2)}
.btn.b{background:var(--blue);color:#fff;box-shadow:0 .3rem 0 var(--blue2)}
.btn.b:active:not(:disabled){box-shadow:0 .02rem 0 var(--blue2)}
.btn.r{background:var(--coral);color:#fff;box-shadow:0 .3rem 0 var(--coral2)}
.btn.r:active:not(:disabled){box-shadow:0 .02rem 0 var(--coral2)}
.btn.p{background:var(--purple);color:#fff;box-shadow:0 .3rem 0 var(--purple2)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 .3rem 0 #b9cde6}
.btn.w:active:not(:disabled){box-shadow:0 .02rem 0 #b9cde6}
.btn.big{font-size:1.3rem;min-height:3.6rem;padding:.6rem 1.3rem;border-radius:1.3rem}
.btn.sm{min-height:2.4rem;padding:.3rem .8rem;font-size:.95rem;border-radius:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{width:2.8rem;height:2.8rem;border-radius:50%;background:#fff;box-shadow:0 .22rem 0 #b9cde6;font-size:1.3rem;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:active{transform:translateY(.2rem);box-shadow:none}
.ibtn.on{background:var(--sun);box-shadow:0 .22rem 0 var(--sun2)}
/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:.5rem;padding:.55rem .7rem;flex:none;flex-wrap:wrap;background:linear-gradient(#fff,#eaf6ff);border-bottom:.2rem solid var(--line);z-index:5}
.hud .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .75rem;border-radius:999px;background:#fff;border:.15rem solid var(--line);font-size:1rem;font-weight:900;white-space:nowrap}
.pill.lv{background:var(--purple);color:#fff;border-color:var(--purple2)}
.pill.coin{background:#fff6cc;border-color:#ffe07a}
.pill.net{background:#dcfbe6;border-color:#9fe6b6}
.xpbar{width:5.5rem;height:.7rem;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden;display:inline-block}
.xpbar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.hearts{display:inline-flex;gap:.15rem;font-size:1.3rem}
.hearts .lost{filter:grayscale(1);opacity:.35}
.title-h{font-size:1.25rem;font-weight:900;display:flex;align-items:center;gap:.4rem}
/* ---------- title screen ---------- */
.title-scr{background:linear-gradient(#7fd6ff 0%,#c9f0ff 55%,#bff3c0 55%,#7ddc6a 100%);align-items:center;text-align:center;padding:1rem;overflow:auto}
.title-scr>div{position:relative;z-index:1}
.title-scr .logo{font-size:min(3.4rem,11vw);font-weight:900;color:#fff;text-shadow:0 .25rem 0 var(--blue2),0 .5rem 0 rgba(0,0,0,.12);line-height:1.15;letter-spacing:.05em}
.title-scr .sub{display:inline-block;margin:.4rem 0 .8rem;padding:.3rem 1rem;background:var(--sun);border-radius:99px;color:#5a3b00;font-weight:900;box-shadow:0 .2rem 0 var(--sun2)}
.title-card{background:#fff;border-radius:1.6rem;padding:1rem 1.2rem;box-shadow:var(--shadow);max-width:34rem;width:100%}
.avatars{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:.5rem 0}
.avatars button{width:3.1rem;height:3.1rem;border-radius:1rem;font-size:1.8rem;background:#f0f7ff;border:.2rem solid transparent}
.avatars button.sel{border-color:var(--purple);background:#efe6ff;transform:scale(1.1)}
.nameinp{width:100%;font:inherit;font-size:1.3rem;padding:.6rem 1rem;border-radius:1rem;border:.2rem solid var(--line);text-align:center;font-weight:800;color:var(--ink);background:#fff;user-select:text}
.nameinp:focus{outline:none;border-color:var(--blue)}
.cloud{pointer-events:none;z-index:0;position:absolute;font-size:3rem;opacity:.9;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
/* ---------- hub map ---------- */
.hub{background:linear-gradient(#8fdcff 0%,#d9f4ff 38%,#c4f2b8 38%,#8be07a 100%)}
.mapwrap{flex:1;position:relative;overflow:auto;min-height:0}
.map{position:relative;width:100%;height:100%;min-height:56rem;min-width:min(100%,60rem);margin:0 auto}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.deco{position:absolute;font-size:2.4rem;pointer-events:none;opacity:.95}
.node{background:none;border:0;padding:0;font:inherit;color:inherit;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.15rem;width:6.9rem;z-index:2}
.node .orb{width:4.6rem;height:4.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;
  background:radial-gradient(circle at 30% 25%,#fff8c8,var(--sun) 55%,var(--sun2));border:.28rem solid #fff;box-shadow:0 .4rem 0 rgba(30,60,110,.25);transition:transform .15s}
.node:hover .orb{transform:scale(1.08)}
.node:active .orb{transform:scale(.95)}
.node.cur .orb{animation:bob 1.1s ease-in-out infinite;box-shadow:0 0 0 .35rem rgba(255,255,255,.7),0 .4rem 0 rgba(30,60,110,.25)}
.node.lock .orb{background:radial-gradient(circle at 30% 25%,#eee,#bbb 60%,#999);filter:grayscale(.4)}
.node.boss .orb{width:5.6rem;height:5.6rem;font-size:3rem;background:radial-gradient(circle at 30% 25%,#ffd0d0,var(--coral) 60%,var(--coral2))}
.node .nm{background:#fff;border-radius:.8rem;padding:.1rem .6rem;font-size:.95rem;font-weight:900;box-shadow:0 .15rem 0 rgba(30,60,110,.18);text-align:center;line-height:1.25}
.node .sk{font-size:.72rem;color:var(--ink2);font-weight:800;text-align:center;line-height:1.1;background:rgba(255,255,255,.8);border-radius:.5rem;padding:0 .3rem}
.stars{font-size:1.05rem;letter-spacing:.05rem;filter:drop-shadow(0 .08rem 0 rgba(0,0,0,.2))}
.stars .off{filter:grayscale(1);opacity:.35}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.45rem)}}
.netty{position:absolute;z-index:3;display:flex;align-items:flex-end;gap:.4rem;pointer-events:none}
.netty .bubble{background:#fff;border-radius:1rem;padding:.45rem .8rem;font-size:.95rem;max-width:15rem;box-shadow:var(--shadow);position:relative;pointer-events:auto}
.netty svg{width:4.6rem;height:4.6rem;animation:bob 2.2s ease-in-out infinite;flex:none}
.dock{display:flex;gap:.5rem;padding:.55rem .6rem;justify-content:center;flex-wrap:wrap;flex:none;background:linear-gradient(#fff,#eaf6ff);border-top:.2rem solid var(--line)}
.dock .btn{flex:1;max-width:10rem;min-width:5.5rem;padding:.4rem .5rem;font-size:1rem}
/* ---------- generic page ---------- */
.page{flex:1;overflow:auto;padding:.9rem;min-height:0}
.wrap{max-width:60rem;margin:0 auto;width:100%}
.card{background:var(--card);border-radius:1.2rem;padding:.9rem 1rem;box-shadow:var(--shadow);margin-bottom:.8rem}
.card h3{margin:.1rem 0 .4rem;font-size:1.15rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.7rem}
.tab{padding:.45rem 1rem;border-radius:99px;background:#fff;border:.15rem solid var(--line);font-weight:900;font-size:1rem}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue2)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.55rem .2rem;border-bottom:.1rem dashed var(--line)}
.sw:last-child{border:0}
.sw small{display:block;font-size:.8rem;color:var(--ink2);font-weight:700}
.toggle{width:3.6rem;height:2rem;border-radius:99px;background:#c9d6e8;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 .1rem .2rem rgba(0,0,0,.25)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:1.8rem}
.seg{display:inline-flex;border-radius:.9rem;overflow:hidden;border:.15rem solid var(--line)}
.seg button{padding:.35rem .8rem;background:#fff;font-weight:900}
.seg button.on{background:var(--blue);color:#fff}
.hint{font-size:.9rem;color:var(--ink2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{padding:.25rem .7rem;border-radius:99px;background:#eef5ff;border:.12rem solid var(--line);font-size:.95rem;font-weight:800}
/* ---------- stage screen ---------- */
.stage{background:linear-gradient(#e9f7ff,#f6fff0)}
.stagebody{flex:1;position:relative;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:.7rem .8rem .9rem;gap:.6rem;align-items:stretch}
.inst{background:#fff;border-radius:1rem;padding:.4rem .8rem;font-size:1rem;box-shadow:0 .2rem 0 rgba(30,60,110,.12);display:flex;align-items:center;gap:.5rem;flex:none}
.inst .em{font-size:1.6rem}
.prog{height:.8rem;background:#d6e6f7;border-radius:99px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#9be564);border-radius:99px;transition:width .4s}
/* MCQ */
.qcard{background:#fff;border-radius:1.3rem;padding:1rem 1.1rem;box-shadow:var(--shadow);font-size:1.35rem;line-height:2.3;display:flex;gap:.6rem;align-items:flex-start}
.qcard .qt{flex:1;min-width:0;overflow-wrap:anywhere}
.qcard .sp{flex:none}
.opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.7rem}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{background:#fff;border-radius:1.1rem;padding:.7rem .9rem;text-align:left;font-size:1.2rem;line-height:1.9;box-shadow:0 .3rem 0 #b9cde6;border:.18rem solid transparent;display:flex;gap:.6rem;align-items:center;min-height:3.4rem;transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(.25rem);box-shadow:0 .03rem 0 #b9cde6}
.opt .k{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:900}
.opt.ok{background:#d9f9e3;border-color:var(--green);box-shadow:0 .3rem 0 var(--green2)}
.opt.ok .k{background:var(--green)}
.opt.bad{background:#ffe0e0;border-color:var(--coral);box-shadow:0 .3rem 0 var(--coral2);animation:shake .35s}
.opt.bad .k{background:var(--coral)}
.opt.gone{opacity:.25;pointer-events:none}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-.4rem)}75%{transform:translateX(.4rem)}}
@media(max-width:34rem){.opts{grid-template-columns:minmax(0,1fr)}}
.skilltag{display:inline-block;font-size:.8rem;background:#efe6ff;color:var(--purple2);border-radius:99px;padding:.05rem .6rem;font-weight:900;margin-right:.4rem;vertical-align:middle}
.mark{background:#fff0a8;border-radius:.4rem;padding:0 .15rem}
.blank{display:inline-block;min-width:2.4em;border-bottom:.18rem solid var(--ink);text-align:center;color:var(--purple2)}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(20,40,80,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:46rem;background:#fff;border-radius:1.6rem 1.6rem 0 0;padding:1rem 1.2rem 1.1rem;box-shadow:0 -.4rem 1.2rem rgba(0,0,0,.2);animation:up .28s cubic-bezier(.2,1.3,.5,1);max-height:80%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .hd{display:flex;align-items:center;gap:.6rem;font-size:1.5rem;font-weight:900;margin-bottom:.3rem}
.sheet.ok .hd{color:var(--green2)}
.sheet.bad .hd{color:var(--coral2)}
.sheet .body{font-size:1.15rem;line-height:2.2;margin:.2rem 0 .7rem}
.sheet .ans{background:#f0f7ff;border-radius:.9rem;padding:.4rem .8rem;margin:.3rem 0;font-size:1.1rem;line-height:2.1}
.modalbg{position:fixed;inset:0;background:rgba(20,40,80,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fade .2s}
.modal{background:#fff;border-radius:1.5rem;padding:1.1rem 1.3rem;max-width:30rem;width:100%;box-shadow:var(--shadow);text-align:center;max-height:92%;overflow:auto}
.modal h2{margin:.2rem 0 .4rem;font-size:1.5rem}
.modal .row{justify-content:center;margin-top:.8rem}
.toast{position:fixed;left:50%;top:5rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1.1rem;border-radius:99px;font-size:1.05rem;z-index:70;animation:toast 2.2s forwards;pointer-events:none;text-align:center;max-width:90vw}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-.8rem)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.pop{position:fixed;z-index:65;pointer-events:none;font-weight:900;font-size:1.6rem;color:var(--sun2);text-shadow:0 .1rem 0 #fff,0 0 .3rem #fff;animation:popup .9s forwards}
@keyframes popup{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-3rem) scale(1.3)}}
.conf{position:fixed;top:-2rem;font-size:1.8rem;z-index:80;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
/* result */
.result{align-items:center;justify-content:center;text-align:center;padding:1rem;background:linear-gradient(#fff7d1,#e6f7ff);overflow:auto}
.result>.big{font-size:3.2rem;margin:.2rem 0}
.result .stars{font-size:3rem}
.result .rows{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin:.6rem 0}
.result .rows .pill{font-size:1.15rem;padding:.4rem 1rem}
/* ---------- Boss ---------- */
.bosshead{display:flex;align-items:center;gap:.8rem;background:linear-gradient(#ffd6d6,#ffeaea);border-radius:1.2rem;padding:.5rem .9rem;box-shadow:var(--shadow);flex:none}
.bosshead .bossface{font-size:3.2rem}
.powers{display:flex;gap:.5rem;flex:none}
/* ---------- class mode ---------- */
.race{background:linear-gradient(#bfe9ff,#e5f8ff);border-radius:1.2rem;padding:.6rem .8rem;box-shadow:var(--shadow);flex:none}
.rtrack{display:flex;align-items:center;gap:.6rem;margin:.3rem 0}
.rtrack .tn{width:6rem;font-size:1rem;font-weight:900;flex:none;text-align:right;color:var(--ink)}
.rtrack .lane2{flex:1;height:2.4rem;background:rgba(255,255,255,.7);border-radius:99px;position:relative}
.rtrack .bal{position:absolute;top:-.5rem;font-size:2.4rem;transform:translateX(-50%);transition:left .8s cubic-bezier(.3,1.4,.5,1)}
.tpill{padding:.35rem .9rem;border-radius:99px;color:#fff;font-weight:900;font-size:1.2rem;display:inline-block}
.timerbar{height:.9rem;border-radius:99px;background:#d6e6f7;overflow:hidden;flex:none}
.timerbar i{display:block;height:100%;background:var(--green);transition:background .3s}
.teamcfg{display:flex;gap:.5rem;flex-wrap:wrap}
.teamcfg input{font:inherit;font-weight:800;padding:.4rem .7rem;border-radius:.8rem;border:.15rem solid var(--line);width:9rem;user-select:text}
/* ---------- misc ---------- */
.village{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:.5rem;background:linear-gradient(#bfe9ff,#bff3b0);border-radius:1.2rem;padding:.8rem;min-height:12rem}
.hut{font-size:2.4rem;text-align:center;line-height:1;position:relative;animation:scr .4s}
.hut::after{content:"";position:absolute;left:50%;top:-.2rem;transform:translateX(-50%);font-size:1.5rem;opacity:.85}
.cert{width:100%;max-width:40rem;border-radius:1rem;box-shadow:var(--shadow);display:block;margin:0 auto}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.6rem}
.badge{background:#fff;border-radius:1rem;padding:.6rem .4rem;text-align:center;box-shadow:0 .2rem 0 #cfdcee;font-size:.85rem;line-height:1.4}
.badge .e{font-size:2.3rem;display:block}
.badge.no{opacity:.4;filter:grayscale(1)}
.bar2{display:flex;align-items:center;gap:.5rem;margin:.3rem 0;font-size:.95rem}
.bar2 .nm{width:7.5rem;flex:none}
.bar2 .tr{flex:1;height:1.2rem;background:#e3eefb;border-radius:99px;overflow:hidden}
.bar2 .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px}
.bar2 .v{width:4.5rem;text-align:right;flex:none;font-size:.85rem;color:var(--ink2)}
.wb{background:#fff;border-radius:1rem;padding:.7rem .9rem;box-shadow:0 .2rem 0 #cfdcee;margin-bottom:.6rem;font-size:1.05rem;line-height:2.1}
.idcard{background:linear-gradient(#fff,#fff7dc);border:.18rem solid #ffe07a;border-radius:1rem;padding:.6rem .8rem;line-height:1.9}
.idcard b{font-size:1.4rem;color:var(--coral2)}
.idcard.no{opacity:.45;filter:grayscale(1);border-style:dashed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.reduce *{animation-duration:.01s!important;transition-duration:.01s!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media print{body{overflow:visible}#app{position:static}.hud,.dock,.btn,.tabs{display:none}}

#zyBtn{position:fixed;top:.5rem;right:.6rem;z-index:90;min-width:3.5rem;height:3rem;border-radius:1rem;background:#fff;border:.15rem solid var(--line);box-shadow:0 .25rem 0 #b9cde6;font-weight:900;font-size:.9rem;line-height:1.1;padding:.1rem .5rem;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center}
#zyBtn small{font-size:.62rem;letter-spacing:.02rem;color:#d0301f}
#zyBtn.on{background:var(--sun);color:#5a3b00;box-shadow:0 .25rem 0 var(--sun2);border-color:#fff}
#zyBtn:active{transform:translateY(.2rem);box-shadow:none}
.hud,.title-scr{padding-right:4.8rem}
.zy-on .qcard,.zy-on .opt,.zy-on .speech,.zy-on .sheet .body,.zy-on .sheet .ans,.zy-on .inst,.zy-on .sense,.zy-on .brick,.zy-on .ordi,.zy-on .wb,.zy-on .enemy .say,.zy-on .runq,.zy-on .gate .g,.zy-on .sorti,.zy-on .cardc,.zy-on .wtile,.zy-on .idcard,.zy-on .hint{line-height:2.7}
.zy-on .chtile{line-height:2.4;min-width:2.8rem}
.zy-on .pchar,.zy-on .slot{line-height:2.2}
.zy-on .node .nm,.zy-on .node .sk{line-height:2}
.brick .mark{color:#2b3a55}

#go{padding:.7rem .5rem;white-space:nowrap}

.inst>span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.inst>span:last-child,.opt>span:last-child,.ordi>span:last-child,.speech>div>div{min-width:0}

.zy-on .gate .g{font-size:1rem;line-height:2.5;padding:.3rem 0}.zy-on .gate .g rt{font-size:.4em}

.opt,.sense,.cardc,.ordi,.brick{overflow-wrap:anywhere;max-width:100%}

.btn{white-space:nowrap}.lanebtns .btn{white-space:normal}

.wtile.zt{font-size:1.1rem}
.wtile.sel{outline:3px solid #ffb300;background:#fff8e1}
.wtile.popped.zt{opacity:.5}

"一", "no": "9", "k": "zp", "st": ["S2"], "sk": "zy", "s": "舞臺上的小⟪丑⟫戴了一頂向日⟪葵⟫造型的帽子，並裝扮成獵人要捕捉獵物，瞄⟪準⟫目標，發⟪射⟫子彈時，不小心摔了一跤，⟪露⟫出⟪痛⟫苦的表情，誇張的模樣⟪使⟫觀眾⟪感⟫到十分有趣。", "title": "舞臺上的小丑", "qs": [], "src": "一.9（短文）"}, {"id": "z_c1", "sec": "一", "no": "10", "k": "zy", "st": ["S1"], "sk": "zy", "s": "亮芸是一個自然⟪迷⟫，喜歡⟪觀⟫察各種生物和做⟪實⟫驗。", "src": "一.10（短文分句）"}, {"id": "z_c2", "sec": "一", "no": "10", "k": "zy", "st": ["S1"], "sk": "zy", "s": "亮芸蹲在海⟪岸⟫邊，發現一隻行動緩慢的寄居蟹。", "src": "一.10（短文分句）"}, {"id": "z_c3", "sec": "一", "no": "10", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪由⟫於這隻寄居蟹身上的殼太小，看起來很不舒服。", "src": "一.10（短文分句）"}, {"id": "z_c4", "sec": "一", "no": "10", "k": "zy", "st": ["S1"], "sk": "zy", "s": "過了一會兒，寄居蟹探出頭，圍⟪繞⟫著新殼轉圈，", "src": "一.10（短文分句）"}, {"id": "z_c5", "sec": "一", "no": "10", "k": "zy", "st": ["S1"], "sk": "zy", "s": "今天的事情在亮芸的心裡⟪留⟫下了美好回憶。", "src": "一.10（短文分句）"}, {"id": "zp_c", "sec": "一", "no": "10", "k": "zp", "st": ["S2"], "sk": "zy", "s": "今年暑假，亮芸和爸爸來到海邊度假。亮芸是一個自然⟪迷⟫，喜歡⟪觀⟫察各種生物和做⟪實⟫驗。傍晚，潮水退去。亮芸蹲在海⟪岸⟫邊，發現一隻行動緩慢的寄居蟹。⟪由⟫於這隻寄居蟹身上的殼太小，看起來很不舒服。亮芸在附近找了一個大一點的殼，放在寄居蟹旁邊，接著退到一旁安靜等待。過了一會兒，寄居蟹探出頭，圍⟪繞⟫著新殼轉圈，最後真的搬家了！看到這個畫面，亮芸開心的笑了。\n夕陽西下，他們準備回家，今天的事情在亮芸的心裡⟪留⟫下了美好回憶。", "title": "寄居蟹搬新家", "qs": [], "src": "一.10（短文）"}, {"id": "z_d1", "sec": "一", "no": "12", "k": "zy", "st": ["S1"], "sk": "zy", "s": "我們的生活周遭潛藏著許多⟪危⟫機。", "src": "一.12（短文分句）"}, {"id": "z_d2", "sec": "一", "no": "12", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪遇⟫到陌生人要⟪懷⟫有戒心，提高警覺，避免被人⟪欺⟫騙。", "src": "一.12（短文分句）"}, {"id": "z_d3", "sec": "一", "no": "12", "k": "zy", "st": ["S1"], "sk": "zy", "s": "平時要做好清潔不要隨意⟪觸⟫碰東西，避免病⟪毒⟫感染。", "src": "一.12（短文分句）"}, {"id": "z_d4", "sec": "一", "no": "12", "k": "zy", "st": ["S1"], "sk": "zy", "s": "尖銳的物品要⟪擺⟫放妥當，避免受傷。", "src": "一.12（短文分句）"}, {"id": "zp_d", "sec": "一", "no": "12", "k": "zp", "st": ["S2"], "sk": "zy", "s": "我們的生活周遭潛藏著許多⟪危⟫機。⟪遇⟫到陌生人要⟪懷⟫有戒心，提高警覺，避免被人⟪欺⟫騙。平時要做好清潔不要隨意⟪觸⟫碰東西，避免病⟪毒⟫感染。尖銳的物品要⟪擺⟫放妥當，避免受傷。凡事小心，注意安全。", "title": "生活中的危機", "qs": [], "src": "一.12（短文）"}, {"id": "z_e1", "sec": "一", "no": "13", "k": "zy", "st": ["S1"], "sk": "zy", "s": "今天放學回家後，信安看見媽媽在廚房忙著⟪準⟫備晚餐。", "src": "一.13（短文分句）"}, {"id": "z_e2", "sec": "一", "no": "13", "k": "zy", "st": ["S1"], "sk": "zy", "s": "媽媽因為洋蔥的味道，⟪使⟫眼睛很⟪刺⟫⟪痛⟫，流下了眼淚，", "src": "一.13（短文分句）"}, {"id": "z_e3", "sec": "一", "no": "13", "k": "zy", "st": ["S1"], "sk": "zy", "s": "但是媽媽覺得廚房裡面太⟪危⟫險，讓信安⟪負⟫責將餐桌擦乾淨，", "src": "一.13（短文分句）"}, {"id": "z_e4", "sec": "一", "no": "13", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪擺⟫好碗筷。", "src": "一.13（短文分句）"}, {"id": "z_e5", "sec": "一", "no": "13", "k": "zy", "st": ["S1"], "sk": "zy", "s": "他帶了一束美麗的向日⟪葵⟫送給媽媽，這是媽媽最喜歡的花，", "src": "一.13（短文分句）"}, {"id": "z_e6", "sec": "一", "no": "13", "k": "zy", "st": ["S1"], "sk": "zy", "s": "她⟪露⟫出了開心的笑容。", "src": "一.13（短文分句）"}, {"id": "zp_e", "sec": "一", "no": "13", "k": "zp", "st": ["S2"], "sk": "zy", "s": "今天放學回家後，信安看見媽媽在廚房忙著⟪準⟫備晚餐。媽媽因為洋蔥的味道，⟪使⟫眼睛很⟪刺⟫⟪痛⟫，流下了眼淚，信安看見後想要協助她。但是媽媽覺得廚房裡面太⟪危⟫險，讓信安⟪負⟫責將餐桌擦乾淨，⟪擺⟫好碗筷。\n不一會兒，晚餐就煮好了，爸爸也回到家，他帶了一束美麗的向日⟪葵⟫送給媽媽，這是媽媽最喜歡的花，她⟪露⟫出了開心的笑容。全家人一起開心的吃晚餐。", "title": "信安幫媽媽", "qs": [], "src": "一.13（短文）"}, {"id": "zk_l11", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "謝謝你，在我⟪遇⟫到⟪危⟫險時，精⟪準⟫的⟪射⟫出⟪刺⟫針，", "src": "課本（課文與習作）"}, {"id": "zk_l12", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪使⟫大魚⟪痛⟫得無法⟪欺⟫⟪負⟫我。", "src": "課本（課文與習作）"}, {"id": "zk_l13", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪感⟫激的小丑魚上　十月五日", "src": "課本（課文與習作）"}, {"id": "zpk_l1", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "親愛的海葵：\n謝謝你，在我⟪遇⟫到⟪危⟫險時，精⟪準⟫的⟪射⟫出⟪刺⟫針，⟪使⟫大魚⟪痛⟫得無法⟪欺⟫⟪負⟫我。\n⟪感⟫激的小丑魚上　十月五日", "title": "習作：小丑魚寫給海葵的信", "qs": [], "src": "課本（課文與習作）"}, {"id": "zk_l21", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "我的⟪觸⟫手雖然美麗，卻是有⟪毒⟫的。", "src": "課本（課文與習作）"}, {"id": "zk_l22", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "我看見搖頭⟪擺⟫尾的大魚，臉上⟪露⟫出居心不良的笑容，", "src": "課本（課文與習作）"}, {"id": "zpk_l2", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "親愛的小丑魚：\n不用客氣！我的⟪觸⟫手雖然美麗，卻是有⟪毒⟫的。我看見搖頭⟪擺⟫尾的大魚，臉上⟪露⟫出居心不良的笑容，就知道自己該挺身而出了。\n絕技的海葵上　十月六日", "title": "習作：海葵寫給小丑魚的信", "qs": [], "src": "課本（課文與習作）"}, {"id": "zk_t11", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "在神祕的大海中，有一大片漂亮的海⟪葵⟫，有的像紅寶石，", "src": "課本（課文與習作）"}, {"id": "zk_t12", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "小⟪丑⟫魚開心自在的和朋友一起在這裡遊玩。", "src": "課本（課文與習作）"}, {"id": "zpk_t1", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "在神祕的大海中，有一大片漂亮的海⟪葵⟫，有的像紅寶石，有的像綠寶石，有的像一朵花，有的像一棵樹，形成一個巨大的花園城堡。小⟪丑⟫魚開心自在的和朋友一起在這裡遊玩。", "title": "課文：神祕的大海", "qs": [], "src": "課本（課文與習作）"}, {"id": "zk_t21", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "這一天，有條黃色的大魚在遠遠的地方就看見小⟪丑⟫魚，", "src": "課本（課文與習作）"}, {"id": "zk_t22", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "小⟪丑⟫魚笑著說：「你好！", "src": "課本（課文與習作）"}, {"id": "zpk_t2", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "這一天，有條黃色的大魚在遠遠的地方就看見小⟪丑⟫魚，心中有了一個想法。他慢慢的靠近，好聲好氣的說：「早安！這裡真熱鬧，你們在做什麼？好像很有趣，我可以參加嗎？」\n小⟪丑⟫魚笑著說：「你好！我們在玩躲貓貓，你也一起來玩吧！」", "title": "課文：黃色大魚來了", "qs": [], "src": "課本（課文與習作）"}, {"id": "zk_t41", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "大魚輕輕⟪擺⟫動尾巴游了過去。", "src": "課本（課文與習作）"}, {"id": "zk_t42", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "沒想到他一靠近，就⟪露⟫出不⟪懷⟫好意的笑容，", "src": "課本（課文與習作）"}, {"id": "zk_t43", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "海葵等到大魚靠近時，抓⟪準⟫時機，⟪射⟫出⟪刺⟫針。", "src": "課本（課文與習作）"}, {"id": "zk_t44", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "「好⟪痛⟫！」", "src": "課本（課文與習作）"}, {"id": "zk_t45", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "大魚哇哇叫，只好⟪使⟫出全力游出花園城堡。", "src": "課本（課文與習作）"}, {"id": "zpk_t4", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "大魚輕輕⟪擺⟫動尾巴游了過去。沒想到他一靠近，就⟪露⟫出不⟪懷⟫好意的笑容，張開大大的嘴巴，吸了一口氣。小丑魚意識到他居心不良，趕快找地方躲起來。\n海葵眼看小丑魚驚慌的左右閃躲，大叫一聲：「快！躲到我這裡！」海葵等到大魚靠近時，抓⟪準⟫時機，⟪射⟫出⟪刺⟫針。「好⟪痛⟫！」大魚哇哇叫，只好⟪使⟫出全力游出花園城堡。", "title": "課文：刺針趕走大魚", "qs": [], "src": "課本（課文與習作）"}, {"id": "zk_t51", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "海葵望著遠去的大魚說：「我的⟪觸⟫手雖然美麗，", "src": "課本（課文與習作）"}, {"id": "zk_t52", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "卻是有⟪毒⟫的。", "src": "課本（課文與習作）"}, {"id": "zk_t53", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "小丑魚是我的好朋友，誰都不能⟪欺⟫⟪負⟫他。」", "src": "課本（課文與習作）"}, {"id": "zk_t54", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "小丑魚⟪感⟫動的說：「謝謝你！", "src": "課本（課文與習作）"}, {"id": "zk_t55", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "每當我⟪遇⟫到⟪危⟫險，都是你出面幫忙。」", "src": "課本（課文與習作）"}, {"id": "zpk_t5", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "海葵望著遠去的大魚說：「我的⟪觸⟫手雖然美麗，卻是有⟪毒⟫的。小丑魚是我的好朋友，誰都不能⟪欺⟫⟪負⟫他。」\n小丑魚⟪感⟫動的說：「謝謝你！每當我⟪遇⟫到⟪危⟫險，都是你出面幫忙。」", "title": "課文：好朋友", "qs": [], "src": "課本（課文與習作）"}, {"id": "z4x_01", "sec": "補充", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪擺⟫動", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_02", "sec": "補充", "no": "2", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪擺⟫放", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_03", "sec": "補充", "no": "3", "k": "zy", "st": ["S1"], "sk": "zy", "s": "搖⟪擺⟫", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_04", "sec": "補充", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪露⟫出", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_05", "sec": "補充", "no": "5", "k": "zy", "st": ["S1"], "sk": "zy", "s": "透⟪露⟫", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_06", "sec": "補充", "no": "6", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪露⟫面", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_07", "sec": "補充", "no": "7", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪懷⟫念", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_08", "sec": "補充", "no": "8", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪懷⟫抱", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_09", "sec": "補充", "no": "9", "k": "zy", "st": ["S1"], "sk": "zy", "s": "關⟪懷⟫", "src": "補充題 read", "stem": "海葵在什麼時候射出刺針？", "opts": ["大魚靠近的時候", "天黑的時候", "小丑魚睡著的時候"], "ans": 0, "why": "課文說：海葵等到大魚靠近時，抓準時機，射出刺針。", "src": "課文", "bk": "b0"}, {"id": "b0q12", "sec": "課本", "no": "12", "k": "mc", "st": ["S10"], "sk": "read", "stem": "大魚被刺針刺到以後，怎麼樣？", "opts": ["哇哇叫，游出花園城堡", "很開心", "睡著了"], "ans": 0, "why": "課文說：「好痛！」大魚哇哇叫，只好使出全力游出花園城堡。", "src": "課文", "bk": "b0"}, {"id": "b0q13", "sec": "課本", "no": "13", "k": "mc", "st": ["S10"], "sk": "read", "stem": "海葵的觸手有什麼特別的地方？", "opts": ["雖然美麗，卻是有毒的", "像棉花一樣軟", "會發出歌聲"], "ans": 0, "why": "海葵說：我的觸手雖然美麗，卻是有毒的。", "src": "課文", "bk": "b0"}, {"id": "b0q14", "sec": "課本", "no": "14", "k": "mc", "st": ["S10"], "sk": "read", "stem": "海葵為什麼要趕走大魚？", "opts": ["因為小丑魚是牠的好朋友，誰都不能欺負他", "因為大魚很吵", "因為大魚不會游泳"], "ans": 0, "why": "海葵說：小丑魚是我的好朋友，誰都不能欺負他。", "src": "課文", "bk": "b0"}, {"id": "b0q15", "sec": "課本", "no": "15", "k": "mc", "st": ["S10"], "sk": "read", "stem": "小丑魚為什麼感動？", "opts": ["每當遇到危險，都是海葵出面幫忙", "海葵送牠禮物", "海葵請牠吃飯"], "ans": 0, "why": "小丑魚說：每當我遇到危險，都是你出面幫忙。", "src": "課文", "bk": "b0"}, {"id": "b0q17", "sec": "課本", "no": "17", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「有的像紅寶石，有的像綠寶石，有的像一朵花，有的像一棵樹」，是把海葵比成什麼？", "opts": ["各種漂亮的東西", "各種好吃的食物", "各種會飛的鳥"], "ans": 0, "why": "這是在形容海葵很漂亮，有的像紅寶石，有的像綠寶石，有的像花，有的像樹。", "src": "課本（句型修辭）", "bk": "b0"}, {"id": "b0q16", "sec": "三", "no": "16", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「海葵說：『我的觸手雖然美麗，卻是有毒的。小丑魚是我的好朋友，誰都不能欺負他。』」從海葵說的話，我們可以知道什麼訊息？", "opts": ["海葵提醒小丑魚有危險時可以求救，否則將有苦頭吃。", "海葵必要時會和小丑魚合作，以武器來攻擊黃色大魚。", "海葵認定和小丑魚的關係，保護小丑魚的舉動很明顯。", "海葵的武器雖有優點，但也有缺點，千萬不要輕易嘗試。"], "ans": 2, "why": "海葵說小丑魚是他的好朋友，誰都不能欺負他，所以可以知道海葵一定會保護小丑魚。", "src": "三.4", "bk": "b0"}, {"id": "b1q1", "sec": "一", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "亮芸在沙灘上發現什麼生物？", "opts": ["一隻海鳥。", "一個海螺。", "一隻水母。", "一隻寄居蟹。"], "ans": 3, "why": "文章說：亮芸蹲在海岸邊，發現一隻行動緩慢的寄居蟹。", "src": "一.10（１）", "bk": "b1"}, {"id": "b1q2", "sec": "一", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "亮芸為什麼要拿新的殼給寄居蟹？", "opts": ["她想把殼給寄居蟹吃。", "她想和寄居蟹玩遊戲。", "寄居蟹原本的殼太小了，看起來很不舒服。", "她想把寄居蟹引誘到桶子裡抓回家。"], "ans": 2, "why": "文章說：由於這隻寄居蟹身上的殼太小，看起來很不舒服，所以亮芸找了一個大一點的殼給牠。", "src": "一.10（２）", "bk": "b1"}, {"id": "b1q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "亮芸放好新殼以後，怎麼做？", "opts": ["退到一旁安靜等待", "把新殼拿走", "大聲叫寄居蟹"], "ans": 0, "why": "文章說：接著退到一旁安靜等待。", "src": "補充（短文）", "bk": "b1", "gen": 1}, {"id": "b1q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "寄居蟹最後怎麼了？", "opts": ["搬進新殼，搬家了", "不見了", "生病了"], "ans": 0, "why": "文章說：寄居蟹圍繞著新殼轉圈，最後真的搬家了！", "src": "補充（短文）", "bk": "b1", "gen": 1}, {"id": "b2q1", "sec": "一", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "媽媽為什麼會流淚？", "opts": ["因為她很疲憊。", "因為洋蔥的味道。", "因為她不小心切到手。", "因為她收到了爸爸送的花。"], "ans": 1, "why": "文章說：媽媽因為洋蔥的味道，使眼睛很刺痛，流下了眼淚。", "src": "一.13（１）", "bk": "b2"}, {"id": "b2q2", "sec": "一", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "關於信安的敘述，下列何者正確？", "opts": ["幫忙擦桌子。", "幫忙切洋蔥。", "幫忙買了一束花。", "因為洋蔥的味道而流下眼淚。"], "ans": 0, "why": "文章說：讓信安負責將餐桌擦乾淨，擺好碗筷。所以信安幫忙擦桌子。", "src": "一.13（２）", "bk": "b2"}, {"id": "b2q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "爸爸帶了什麼花送給媽媽？", "opts": ["向日葵", "玫瑰花", "百合花"], "ans": 0, "why": "文章說：他帶了一束美麗的向日葵送給媽媽。", "src": "補充（短文）", "bk": "b2", "gen": 1}, {"id": "b2q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "為什麼媽媽不讓信安幫忙切菜？", "opts": ["因為廚房裡面太危險", "因為信安很累", "因為信安不想做"], "ans": 0, "why": "文章說：媽媽覺得廚房裡面太危險。", "src": "補充（短文）", "bk": "b2", "gen": 1}, {"id": "b3q1", "sec": "十", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "標題「種下一棵□樹」，□最適合填入哪一個答案？", "opts": ["友情", "勇敢", "禮貌", "誠實"], "ans": 0, "why": "大熊先生種下蘋果樹，是為了讓好朋友開心，所以最適合填「友情」。", "src": "十.1（１）", "bk": "b3"}, {"id": "b3q2", "sec": "十", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "根據文章判斷，下列哪一個詞語最適合形容大熊先生？", "opts": ["精打細算", "努力工作", "樂於分享", "互相合作"], "ans": 2, "why": "大熊先生種樹，是為了讓好朋友都能享受，所以是樂於分享。", "src": "十.1（２）", "bk": "b3"}, {"id": "b3q3", "sec": "十", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "大熊先生請風兒找來的第一位好朋友是誰？", "opts": ["小鳥", "蝴蝶和蜜蜂", "猴子"], "ans": 0, "why": "文章說：他請風兒找來小鳥，所以第一位是小鳥。", "src": "十.1（３）①", "bk": "b3"}, {"id": "b3q4", "sec": "十", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "小鳥以後，大熊先生接著找來誰？", "opts": ["蝴蝶和蜜蜂", "猴子", "小鳥"], "ans": 0, "why": "文章說：他請小鳥找來蝴蝶和蜜蜂，所以第二位是蝴蝶和蜜蜂。", "src": "十.1（３）②", "bk": "b3"}, {"id": "b3q5", "sec": "十", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "最後找來的好朋友是誰？", "opts": ["猴子", "蝴蝶和蜜蜂", "風兒"], "ans": 0, "why": "文章說：他請蝴蝶和蜜蜂找來猴子，所以最後是猴子。", "src": "十.1（３）③", "bk": "b3"}, {"id": "b3q6", "sec": "補充", "no": "6", "k": "mc", "st": ["S10"], "sk": "read", "stem": "大熊先生最後為什麼說「為了我的好朋友呀！」？", "opts": ["因為種樹是為了讓朋友開心", "因為他想吃蘋果", "因為他想賣蘋果"], "ans": 0, "why": "大熊先生種下蘋果樹，是為了好朋友。", "src": "補充（短文）", "bk": "b3", "gen": 1}, {"id": "b4q1", "sec": "十", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "魚醫師是指誰？", "opts": ["奇形怪狀的魚", "體型龐大的魚", "凶狠的魚", "清潔魚"], "ans": 3, "why": "文章說：魚醫師的外型小巧可愛，是「清潔魚」。", "src": "十.2（１）", "bk": "b4"}, {"id": "b4q2", "sec": "十", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "為什麼所有的魚兒都喜歡清潔魚？", "opts": ["因為清潔魚可以幫他們處理身上的傷口、異物或病菌等。", "因為清潔魚可以幫他們找尋食物。", "因為清潔魚可以幫他們找到家人。", "因為清潔魚可以安慰他們難過的心。"], "ans": 0, "why": "文章說：魚醫師可以把魚的身體和鰓清潔乾淨，還可以清潔牙齒。", "src": "十.2（２）", "bk": "b4"}, {"id": "b4q3", "sec": "十", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "清潔魚與其他魚類之間的共生現象，可以用哪個詞語形容？", "opts": ["一心一意", "一舉數得", "一成不變", "一五一十"], "ans": 1, "why": "清潔魚吃到食物，其他魚也變乾淨，一件事得到雙方的好處，所以是「一舉數得」。", "src": "十.2（３）", "bk": "b4"}, {"id": "b5q1", "sec": "十", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "智方是個怎樣的人？", "opts": ["善良大方", "不講義氣", "聰明伶俐", "凶惡殘忍"], "ans": 1, "why": "智方看到熊就拋棄朋友逃跑，所以是不講義氣的人。", "src": "十.3（１）", "bk": "b5"}, {"id": "b5q2", "sec": "十", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "誰救了宏泰？", "opts": ["智方", "遊客", "獵人", "熊"], "ans": 2, "why": "文章說：傳來一聲槍響，把熊嚇跑了。獵人走過來扶起宏泰。", "src": "十.3（２）", "bk": "b5"}, {"id": "b5q3", "sec": "十", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "獵人口中真正的朋友應該是怎麼樣的呢？", "opts": ["患難與共", "公私分明", "分工合作", "共享歡樂"], "ans": 0, "why": "真正的朋友，遇到危險不會逃跑，會一起面對，所以是「患難與共」。", "src": "十.3（３）", "bk": "b5"}, {"id": "b6q1", "sec": "十一", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "為什麼魏絳拒絕接受賞賜？", "opts": ["他覺得自己沒有那麼大的功勞。", "他覺得國君送禮居心不良。", "他怕自己太沉迷於享樂。", "他堅持要攻打鄭國。"], "ans": 0, "why": "魏絳說：我個人哪有什麼貢獻呢？所以他覺得自己沒有那麼大的功勞。", "src": "十一（１）", "bk": "b6"}, {"id": "b6q2", "sec": "十一", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「居安思危」的「居」是什麼意思？", "opts": ["居住", "鄰居", "處於", "居然"], "ans": 2, "why": "「居安思危」，是處於安樂的時候，要想到危險，所以「居」是處於的意思。", "src": "十一（２）", "bk": "b6"}, {"id": "b6q3", "sec": "十一", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "為什麼魏絳要勸國君不要忘了國家大事？", "opts": ["國君十分健忘。", "國君收到樂器和歌女這樣的禮物。", "國君對國家貢獻太少。", "魏絳知道國君喜歡享樂。"], "ans": 1, "why": "國君收到樂器和歌女這樣的禮物，魏絳怕他沉迷享樂，所以才勸他。", "src": "十一（３）", "bk": "b6"}, {"id": "b6q4", "sec": "十一", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "下列有關「居安思危」的運用，何者錯誤？", "opts": ["他從沒遇過緊急狀況，卻懂得「居安思危」，準備了逃生物品。", "處在太平盛世的人們往往不知「居安思危」，以致戰爭來臨時措手不及。", "你別看現在生意興隆，「居安思危」，我們要不斷創新進取。", "他住在這樣的豪宅還不滿足，夢想家裡能有游泳池和籃球場，果然明白「居安思危」的道理。"], "ans": 3, "why": "第四句說的是不滿足，並不是處在安樂時想到危險，所以用錯了。", "src": "十一（４）", "bk": "b6"}, {"id": "b7q1", "sec": "補充", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "小丑魚住在哪裡？", "opts": ["海葵的觸手之間", "沙灘上", "大石頭上"], "ans": 0, "why": "短文說：小丑魚住在海葵的觸手之間。", "src": "補充（短文）", "bk": "b7", "gen": 1}, {"id": "b7q2", "sec": "補充", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "海葵的觸手可以做什麼？", "opts": ["趕走想吃小丑魚的大魚", "唱歌", "寫字"], "ans": 0, "why": "短文說：海葵的觸手有毒，可以趕走想吃小丑魚的大魚。", "src": "補充（短文）", "bk": "b7", "gen": 1}, {"id": "b7q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "小丑魚怎麼幫海葵？", "opts": ["幫海葵趕走小蟲，讓海葵保持乾淨", "送海葵禮物", "幫海葵搬家"], "ans": 0, "why": "短文說：小丑魚也會幫海葵趕走一些小蟲，讓海葵保持乾淨。", "src": "補充（短文）", "bk": ㄌㄡˋ。露珠、露水、透露，都讀ㄌㄨˋ。", "src": "四.2", "pO": 1}, {"id": "q4_2d", "sec": "四", "no": "2", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「露」讀ㄌㄨˋ時，可以組成哪一個詞語？", "opts": ["露珠", "露面", "露臉", "露出"], "ans": 0, "why": "「露珠」的「露」，讀ㄌㄨˋ。露面、露臉、露出，都讀ㄌㄡˋ。", "src": "四.2", "pO": 1}, {"id": "q4_3", "sec": "四", "no": "3", "k": "mc", "st": ["S7"], "sk": "zy", "stem": "「⟬擺⟭動」\n框框裡的字，怎麼讀？", "opts": ["ㄅㄞˇ", "ㄅㄞˋ", "ㄅㄞ"], "ans": 0, "why": "「擺動」的「擺」，讀ㄅㄞˇ。", "src": "四.3", "pO": 1, "say": "擺動的擺，怎麼讀？"}, {"id": "q4_3b", "sec": "四", "no": "3", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「擺」可以組成哪一個詞語？", "opts": ["擺動", "擺書", "擺花"], "ans": 0, "why": "「擺動」是一個詞語。", "src": "四.3", "pO": 1}, {"id": "q4_4", "sec": "四", "no": "4", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "數一數筆畫。\n「⟬遇⟭」一共有幾畫？", "opts": ["13 畫", "10 畫", "8 畫"], "ans": 0, "why": "「遇」一共有 13 畫。", "src": "四.4", "pO": 1}, {"id": "q4_4b", "sec": "四", "no": "4", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「遇」可以組成哪一個詞語？", "opts": ["遇見", "遇書", "遇雲"], "ans": 0, "why": "「遇見」是一個詞語。", "src": "四.4", "pO": 1}, {"id": "q6_1", "sec": "六", "no": "1", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「師長希望你□□□□，改正自己的過錯，相信你一定會有美好的未來。」\n空格要填哪一個詞語？", "opts": ["抱頭痛哭", "不痛不癢", "痛改前非", "迎頭痛擊"], "ans": 2, "why": "「痛改前非」，是深深的反省，改正以前的錯誤。", "src": "六.1", "pO": 1}, {"id": "q6_2", "sec": "六", "no": "2", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「學校定期舉辦地震演習，是要教導我們□□□□，危險真正發生時才不會慌張。」\n空格要填哪一個詞語？", "opts": ["居心叵測", "居高臨下", "居安思危", "安居樂業"], "ans": 2, "why": "「居安思危」，是處於安樂的時候，要想到危險可能會隨時出現。\n居心叵測：比喻心存險詐，難以預測。居高臨下：處於有利的地位，可控制一切。安居樂業：生活安定和樂，而且喜好自己的職業。", "src": "六.2", "pO": 1}, {"id": "q6_3", "sec": "六", "no": "3", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「弟弟不小心打破了花瓶，說話時□□□□的，媽媽一聽就知道他在撒謊。」\n空格要填哪一個詞語？", "opts": ["笑裡藏刀", "虎頭蛇尾", "臥虎藏龍", "藏頭露尾"], "ans": 3, "why": "「藏頭露尾」，形容言多隱諱，舉止畏縮的樣子。\n笑裡藏刀：形容人外貌和善可親，內心卻陰險狠毒。虎頭蛇尾：比喻做事有始無終。臥虎藏龍：比喻潛藏著人才。", "src": "六.3", "pO": 1}, {"id": "q6x_1", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「他知道錯了，決心□□□□，不再說謊。」\n空格要填哪一個成語？", "opts": ["痛改前非", "不痛不癢", "抱頭痛哭", "迎頭痛擊"], "ans": 0, "why": "「痛改前非」，是深深的反省，改正以前的錯誤。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_2", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「雖然現在天氣很好，我們也要□□□□，先準備好雨具。」\n空格要填哪一個成語？", "opts": ["居安思危", "居心不良", "安居樂業", "居高臨下"], "ans": 0, "why": "「居安思危」，是處於安樂的時候，要想到危險可能會隨時出現。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_3", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「那個壞人□□□□，想騙小孩子跟他走。」\n空格要填哪一個成語？", "opts": ["居心不良", "居安思危", "安居樂業", "用心良苦"], "ans": 0, "why": "「居心不良」，是心中存著不好的想法。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_4", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「爸爸□□□□的安慰哭泣的妹妹。」\n空格要填哪一個成語？", "opts": ["好言好語", "東張西望", "垂頭喪氣", "手舞足蹈"], "ans": 0, "why": "「好言好語」，是說話語氣親切、和善。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_5", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「老師□□□□的和我們說話，大家都覺得很溫暖。」\n空格要填哪一個成語？", "opts": ["好聲好氣", "垂頭喪氣", "手舞足蹈", "東張西望"], "ans": 0, "why": "「好聲好氣」，是說話的語氣親切、和善。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_6", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「他說話吞吞吐吐，□□□□，大家都不知道他想說什麼。」\n空格要填哪一個成語？", "opts": ["藏頭露尾", "落落大方", "神采飛揚", "口若懸河"], "ans": 0, "why": "「藏頭露尾」，形容言多隱諱，舉止畏縮的樣子。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_7", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「看到有人落水，他□□□□的跳下去救人。」\n空格要填哪一個成語？", "opts": ["奮不顧身", "垂頭喪氣", "藏頭露尾", "三心二意"], "ans": 0, "why": "「奮不顧身」，是不顧自己的安危。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_8", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「小丑魚遇到危險，海葵□□□□，趕緊保護他。」\n空格要填哪一個成語？", "opts": ["挺身而出", "垂頭喪氣", "東張西望", "悶悶不樂"], "ans": 0, "why": "「挺身而出」，是勇敢的站出來。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_9", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「看到同學被欺負，我們要□□□□，幫助他。」\n空格要填哪一個成語？", "opts": ["挺身而出", "視而不見", "袖手旁觀", "置之不理"], "ans": 0, "why": "「挺身而出」，是勇敢的站出來。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_10", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「風雨過後，海面□□□□，船又可以出海了。」\n空格要填哪一個成語？", "opts": ["風平浪靜", "波濤洶湧", "狂風暴雨", "天翻地覆"], "ans": 0, "why": "「風平浪靜」，形容沒有風浪，很平靜。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_11", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「颱風來的時候，海面□□□□，船都不能出海。」\n空格要填哪一個成語？", "opts": ["波濤洶湧", "風平浪靜", "水波不興", "平靜無波"], "ans": 0, "why": "「波濤洶湧」，形容海浪又大又猛。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_12", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「大魚被趕跑了，小丑魚和海葵□□□□，一起唱歌跳舞。」\n空格要填哪一個成語？", "opts": ["歡天喜地", "悶悶不樂", "垂頭喪氣", "愁眉苦臉"], "ans": 0, "why": "「歡天喜地」，形容非常高興。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_13", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「眼看危險靠近，他□□□□，馬上想出辦法。」\n空格要填哪一個成語？", "opts": ["臨危不亂", "驚慌失措", "手忙腳亂", "六神無主"], "ans": 0, "why": "「臨危不亂」，是遇到危險也不慌亂。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_14", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「他每天認真練習，終於□□□□，贏得比賽。」\n空格要填哪一個成語？", "opts": ["如願以償", "垂頭喪氣", "無精打采", "一籌莫展"], "ans": 0, "why": "「如願以償」，是願望終於實現。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_15", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「大家都很□□□□，沒有人敢出聲，教室裡安靜極了。」\n空格要填哪一個成語？", "opts": ["屏氣凝神", "手舞足蹈", "東張西望", "大呼小叫"], "ans": 0, "why": "「屏氣凝神」，形容非常專心，不敢出聲。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q6x_16", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「老師說的話，我都□□□□，不敢忘記。」\n空格要填哪一個成語？", "opts": ["牢記在心", "垂頭喪氣", "東張西望", "悶悶不樂"], "ans": 0, "why": "「牢記在心」，是牢牢的記在心裡。", "src": "補充（成語）", "gen": 1, "pO": 1}, {"id": "q7_1a", "sec": "七", "no": "1", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "選出對的字，放進空格。\n爺爺多采多姿的人生際（　　），使得他更有智慧。", "opts": ["遇", "偶"], "ans":  "sense", "stem": "用「一……就……」的句子，表示什麼意思？", "opts": ["後一件事緊接著前一件事發生", "兩件事同時發生", "兩件事沒有關係"], "ans": 0, "why": "用「一……就……」的句子，表示後一件事緊接著前一件事發生。", "src": "課本（認識句子）"}, {"id": "cf_8", "sec": "課本", "no": "句子", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「媽媽一打開門，就聞到香味。」\n哪一件事先發生？", "opts": ["打開門", "聞到香味"], "ans": 0, "why": "「一……就……」，前面的事先發生，所以先是打開門。", "src": "補充（一……就……）", "gen": 1}, {"id": "cf_9", "sec": "課本", "no": "句子", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「天一亮，公雞就叫了。」\n哪一件事先發生？", "opts": ["天亮了", "公雞叫了"], "ans": 0, "why": "「一……就……」，前面的事先發生，所以先是天亮了。", "src": "補充（一……就……）", "gen": 1}, {"id": "cf_10", "sec": "課本", "no": "句子", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「小狗一看到主人，就搖尾巴。」\n哪一件事先發生？", "opts": ["看到主人", "搖尾巴"], "ans": 0, "why": "「一……就……」，前面的事先發生，所以先是看到主人。", "src": "補充（一……就……）", "gen": 1}, {"id": "cf_11", "sec": "課本", "no": "句子", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「鈴聲一響，大家就跑出教室。」\n哪一件事先發生？", "opts": ["鈴聲響起", "跑出教室"], "ans": 0, "why": "「一……就……」，前面的事先發生，所以先是鈴聲響起。", "src": "補充（一……就……）", "gen": 1}, {"id": "cf_12", "sec": "課本", "no": "句子", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「我一躺到床上，就睡著了。」\n哪一件事先發生？", "opts": ["躺到床上", "睡著了"], "ans": 0, "why": "「一……就……」，前面的事先發生，所以先是躺到床上。", "src": "補充（一……就……）", "gen": 1}, {"id": "cs_1", "sec": "課本", "no": "修辭", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「有的像紅寶石，有的像綠寶石，有的像一朵花，有的像一棵樹。」\n這句話是在說什麼？", "opts": ["海葵的樣子很多，也很漂亮", "海葵很臭", "海葵很吵"], "ans": 0, "why": "這是用寶石、花、樹來形容海葵，說明海葵有很多漂亮的樣子。", "src": "課本（句型修辭）"}, {"id": "cs_2", "sec": "課本", "no": "修辭", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「有的像一朵花」，是把海葵比成什麼？", "opts": ["一朵花", "一棵樹", "一條魚"], "ans": 0, "why": "「有的像一朵花」，是把海葵比成一朵花。", "src": "課本（句型修辭）"}, {"id": "cs_3", "sec": "課本", "no": "修辭", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "下面哪一句，也是用「像」來比喻？", "opts": ["太陽像一顆大火球", "太陽出來了", "我喜歡太陽"], "ans": 0, "why": "「太陽像一顆大火球」，是把太陽比成大火球。", "src": "課本（句型修辭）"}, {"id": "cs_4", "sec": "課本", "no": "修辭", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「巨大的花園城堡」指的是什麼？", "opts": ["一大片漂亮的海葵", "真正的城堡", "一座公園"], "ans": 0, "why": "課文用「花園城堡」，來形容一大片漂亮的海葵。", "src": "課本（句型修辭）"}, {"id": "cl_1", "sec": "課本", "no": "書信", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "小丑魚寫信給海葵，最主要想說什麼？", "opts": ["謝謝海葵在危險時幫忙", "請海葵搬家", "問海葵吃了什麼"], "ans": 0, "why": "小丑魚寫信，是要感謝海葵在他遇到危險時幫忙。", "src": "課本（寫國字或注音：書信）"}, {"id": "cl_2", "sec": "課本", "no": "書信", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "信裡說「不用客氣」，是在回答什麼？", "opts": ["別人對自己說謝謝", "別人對自己說再見", "別人對自己說對不起"], "ans": 0, "why": "「不用客氣」，是別人說謝謝的時候，我們的回答。", "src": "課本（寫國字或注音：書信）"}, {"id": "cl_3", "sec": "課本", "no": "書信", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "寫信的最後，通常會寫什麼？", "opts": ["自己的名字和日期", "數學題目", "天氣預報"], "ans": 0, "why": "信的最後，通常會寫上自己的名字和日期。", "src": "課本（寫國字或注音：書信）"}, {"id": "cl_4", "sec": "課本", "no": "書信", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "信的開頭寫「親愛的海葵」，「親愛的」是表示什麼？", "opts": ["親切、喜歡對方", "生氣", "害怕"], "ans": 0, "why": "「親愛的」，是表示親切、喜歡對方。", "src": "課本（寫國字或注音：書信）"}, {"id": "g4_1", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "亮芸發現什麼？", "opts": ["寄居蟹", "海龜", "海鳥"], "ans": 0, "why": "短文說：亮芸發現一隻寄居蟹。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "亮芸蹲在海岸邊，發現一隻寄居蟹。"}, {"id": "g4_2", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "為什麼不要碰海葵的觸手？", "opts": ["因為有毒", "因為很燙", "因為很臭"], "ans": 0, "why": "短文說：因為有毒。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "媽媽叫弟弟小心，不要碰海葵的觸手，因為有毒。"}, {"id": "g4_3", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "哥哥寫完功課以後，做什麼？", "opts": ["到公園打籃球", "睡覺", "看電視"], "ans": 0, "why": "短文說：就到公園打籃球。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "哥哥一寫完功課，就到公園打籃球。"}, {"id": "g4_4", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "大魚心裡怎麼想？", "opts": ["不懷好意", "很開心", "很害怕"], "ans": 0, "why": "短文說：他心裡不懷好意。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "黃色大魚好聲好氣的說話，但是他心裡不懷好意。"}, {"id": "g4_5", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "大魚為什麼游走？", "opts": ["因為被刺針刺痛", "因為想睡覺", "因為天黑了"], "ans": 0, "why": "短文說：大魚痛得游走了。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "海葵射出刺針，大魚痛得游走了。"}, {"id": "g4_6", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "誰幫弟弟擦藥？", "opts": ["媽媽", "爸爸", "老師"], "ans": 0, "why": "短文說：媽媽趕快幫他擦藥。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "弟弟不小心被針刺到，媽媽趕快幫他擦藥。"}, {"id": "g4_7", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "向日葵的花朵像什麼？", "opts": ["小太陽", "小月亮", "小星星"], "ans": 0, "why": "短文說：像一個小太陽。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "向日葵的花朵又大又黃，像一個小太陽。"}, {"id": "g4_8", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "誰煮菜？", "opts": ["媽媽", "信安", "爸爸"], "ans": 0, "why": "短文說：媽媽煮菜。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "信安負責擦桌子，媽媽煮菜。"}, {"id": "g4_9", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "小魚遇到危險，躲到哪裡？", "opts": ["海葵裡", "沙子裡", "船上"], "ans": 0, "why": "短文說：躲進海葵裡。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "小魚遇到危險，躲進海葵裡，才安全。"}, {"id": "g4_10", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "老師是怎麼說話的？", "opts": ["語氣親切、和善", "很生氣", "很大聲"], "ans": 0, "why": "短文說：好聲好氣，就是語氣親切、和善。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "老師好聲好氣的說：「請大家排好隊。」"}], "books": [{"id": "b0", "title": "小丑魚和海葵（課文）", "src": "課本 第四課", "e": "🐠", "paras": ["在神祕的大海中，有一大片漂亮的海葵，有的像紅寶石，有的像綠寶石，有的像一朵花，有的像一棵樹，形成一個巨大的花園城堡。", "小丑魚開心自在的和朋友一起在這裡遊玩。", "這一天，有條黃色的大魚在遠遠的地方就看見小丑魚，心中有了一個想法。", "他慢慢的靠近，好聲好氣的說：「早安！這裡真熱鬧，你們在做什麼？好像很有趣，我可以參加嗎？」", "小丑魚笑著說：「你好！我們在玩躲貓貓，你也一起來玩吧！」", "大魚輕輕擺動尾巴游了過去。沒想到他一靠近，就露出不懷好意的笑容，張開大大的嘴巴，吸了一口氣。", "小丑魚意識到他居心不良，趕快找地方躲起來。", "海葵眼看小丑魚驚慌的左右閃躲，大叫一聲：「快！躲到我這裡！」", "海葵等到大魚靠近時，抓準時機，射出刺針。「好痛！」大魚哇哇叫，只好使出全力游出花園城堡。", "海葵望著遠去的大魚說：「我的觸手雖然美麗，卻是有毒的。小丑魚是我的好朋友，誰都不能欺負他。」", "小丑魚感動的說：「謝謝你！每當我遇到危險，都是你出面幫忙。」"], "notes": []}, {"id": "b1", "title": "寄居蟹搬新家", "src": "一.10（閱讀）", "e": "🦀", "paras": ["今年暑假，亮芸和爸爸來到海邊度假。亮芸是一個自然迷，喜歡觀察各種生物和做實驗。", "傍晚，潮水退去。亮芸蹲在海岸邊，發現一隻行動緩慢的寄居蟹。", "由於這隻寄居蟹身上的殼太小，看起來很不舒服。亮芸在附近找了一個大一點的殼，放在寄居蟹旁邊，接著退到一旁安靜等待。", "過了一會兒，寄居蟹探出頭，圍繞著新殼轉圈，最後真的搬家了！看到這個畫面，亮芸開心的笑了。", "夕陽西下，他們準備回家，今天的事情在亮芸的心裡留下了美好回憶。"], "notes": []}, {"id": "b2", "title": "信安幫媽媽", "src": "一.13（閱讀）", "e": "🥕", "paras": ["今天放學回家後，信安看見媽媽在廚房忙著準備晚餐。媽媽因為洋蔥的味道，使眼睛很刺痛，流下了眼淚，信安看見後想要協助她。", "但是媽媽覺得廚房裡面太危險，讓信安負責將餐桌擦乾淨，擺好碗筷。", "不一會兒，晚餐就煮好了，爸爸也回到家，他帶了一束美麗的向日葵送給媽媽，這是媽媽最喜歡的花，她露出了開心的笑容。全家人一起開心的吃晚餐。"], "notes": []}, {"id": "b3", "title": "種下一棵友情樹", "src": "十.1（閱讀）", "e": "🌳", "paras": ["大熊先生種下一棵蘋果樹，蘋果樹一天一天的長大。", "有一天，蘋果樹說：「我的樹枝夠粗壯了，你可以來我這裡盪秋千。」", "大熊先生笑了，他請風兒找來小鳥，小鳥在樹上築起了鳥窩。", "一段時間後，蘋果樹上開出了漂亮的花。蘋果樹說：「你可以用花瓣編織美麗的花環。」", "大熊先生笑了，他請小鳥找來蝴蝶和蜜蜂。蝴蝶和蜜蜂天天都來採花蜜和跳舞。", "大熊先生每天都來看蘋果樹，溫柔的說：「快結果子吧！」沒多久，樹上結出一顆顆的蘋果。", "大熊先生笑了，他請蝴蝶和蜜蜂找來猴子。猴子開心的爬上樹，一邊吃蘋果，一邊盪秋千，笑個不停。", "蘋果樹覺得很奇怪，問：「你不來我這裡盪秋千，不用我的花瓣做花環，也不吃我結出來的蘋果，為什麼要種下我呢？」", "「為了我的好朋友呀！」大熊先生舉起手指著樹上，開心的說。"], "notes": []}, {"id": "b4", "title": "有你真好", "src": "十.2（閱讀）", "e": "🐟", "paras": ["當魚受傷、生病或身上長蟲的時候該怎麼辦呢？這時就要請魚醫師出面幫忙了。", "魚醫師是許多魚類的好朋友，他的外型小巧可愛，最大時的體型不會超過十公分。他的食量驚人，一天能吃掉近百隻魚身上的寄生蟲，可以把魚的身體和鰓清潔乾淨，讓魚兒通體舒暢，還可以清潔魚兒的牙齒，將齒縫間的殘渣一一清除，使魚兒有一口乾淨的牙齒。所以，不管多麼奇怪、渺小或凶狠的大魚，都可以成為魚醫師的病患。", "魚醫師對任何魚類沒有威脅，不懂得偽裝①自己，他會利用幫大魚治病的時候狐假虎威②，嚇阻③想要攻擊他的敵人。他默默的為其他魚服務，樂在其中，而清理的病菌、寄生蟲等則成為魚醫師的美食。", "這種「醫師」和「病患」之間的關係就是「清潔魚」與「其他魚類」在自然界之間的共生現象。"], "notes": ["偽裝：為達某種目的，隱藏真實情況所實施的變裝、隱蔽等作業。", "狐假虎威：比喻憑恃有權者的威勢恐嚇他人、作威作福。", "嚇阻：利用手段使人害怕而停止某種行為或言語。"]}, {"id": "b5", "title": "熊和旅人", "src": "十.3（閱讀）", "e": "🐻", "paras": ["風和日麗的好天氣，一對好友智方和宏泰相約去爬山。", "兩人愉快的邊走邊聊天，智方突然發現遠處有一隻熊出沒，他嚇了一大跳，不顧一切①就頭也不回的拋棄朋友，快速的逃離現場，躲了起來。", "宏泰根本來不及反應，當他發現為時已晚，熊已近在咫尺②。宏泰靈機一動，立刻倒在地上裝死，熊走到他身邊聞了聞，此時傳來一聲槍響，把熊嚇跑了。", "獵人走過來扶起了宏泰，而遠處的智方也跑過來，關心的對宏泰說：「你還好嗎？剛才實在太驚險了！」只見宏泰不疾不徐③的說：「你知道嗎？剛剛熊對我說話呢！」智方滿臉疑惑④，宏泰接著說：「熊說絕對不要和臨危⑤就逃跑的人在一起。」", "獵人聽了，點點頭說：「我知道什麼是真正的朋友了。」"], "notes": ["不顧一切：不考慮事情的狀況和後果。", "近在咫尺：形容距離很近。", "不疾不徐：不快不慢，形容能掌握事情進展的適當節奏。", "疑惑：懷疑、不明白。", "臨危：置身險境。"]}, {"id": "b6", "title": "居安思危", "src": "十一（閱讀）", "e": "🏰", "paras": ["根據左傳記載：春秋時諸侯國聯合攻打鄭國，鄭國人非常害怕，便準備了兵車、樂師、樂器和歌女等禮物，想以財物買通其中最大的晉國，用來求和止戰。", "晉國的國君很高興，把一半的樂器和歌女都賞賜給大臣魏絳，感謝他對國家的貢獻①。但是魏絳拒絕了，還藉機②向國君進諫③，說：「今天國家這樣的強盛，是因國君您的才能以及眾臣的同心協力，我個人哪有什麼貢獻呢？只是臣希望您在享樂的同時，不要忘了國家大事。書經裡說：『居安思危』，這樣才能及早做防備，有了防備就不怕災難。」晉國國君聽了，說：「您的教訓我豈敢不接受？但要是沒有您，我不可能有今日這樣的成就。賞賜臣子禮物是國家的常規，不可廢除，您就收下吧！」", "於是魏絳也就遵循④禮制收下賞賜。後來「居安思危」這個成語，便是用來指處於安樂的時候，要想到危險可能會隨時出現。"], "notes": ["貢獻：對社會公眾有所助益的行為。", "藉機：利用機會。", "進諫：以直言規勸。多用於下對上。", "遵循：遵守依從。"]}, {"id": "b7", "title": "海底的好朋友", "src": "補充", "e": "🌊", "paras": ["小丑魚住在海葵的觸手之間。", "海葵的觸手有毒，可以趕走想吃小丑魚的大魚。", "小丑魚也會幫海葵趕走一些小蟲，讓海葵保持乾淨。", "牠們互相幫忙，是海底世界的好朋友。"], "notes": []}], "img": {}, "cover": [["一", "國字注音（詞語與句子 8 題、短文 5 篇）", ["z4_1", "z4_2", "z4_3", "z4_4", "z4_6", "z4_7", "z4_8", "z4_11", "z_a1", "z_a2", "z_a3", "zp_a", "z_b1", "z_b2", "z_b3", "z_b4", "zp_b", "z_c1", "z_c2", "z_c3", "z_c4", "z_c5", "zp_c", "z_d1", "z_d2", "z_d3", "z_d4", "zp_d", "z_e1", "z_e2", "z_e3", "z_e4", "z_e5", "z_e6", "zp_e"]], ["一", "閱讀測驗：寄居蟹搬新家、信安幫媽媽（完整短文）", ["b1q1", "b1q2", "b1q3", "b1q4", "b2q1", "b2q2", "b2q3", "b2q4"]], ["二", "造詞（刺、擺、毒、痛、遇、負、射；改成選出正確的詞語，共 14 題）", ["q2_01", "q2_02", "q2_03", "q2_04", "q2_05", "q2_06", "q2_07", "q2_08", "q2_09", "q2_10", "q2_11", "q2_12", "q2_13", "q2_14"]], ["三", "課文敘述：海葵說的話，可以知道什麼訊息？（讀完課文再答）", ["b0q16"]], ["三", "選擇題（露的讀音、部首、射與刺、部首和「擺」不同；課文敘述見閱讀；共 4 題）", ["q3_1", "q3_2", "q3_3", "q3_5"]], ["四", "先寫總筆畫數、注音，再造詞（擺、露、遇；共 10 題）", ["q4_1", "q4_1b", "q4_2a", "q4_2b", "q4_2c", "q4_2d", "q4_3", "q4_3b", "q4_4", "q4_4b"]], ["五", "改錯題（3 題，共 7 個錯字）", ["ty5_1", "ty5_2", "ty5_3"]], ["六", "選擇題：生字延伸成語（痛改前非、居安思危、藏頭露尾；共 3 題）", ["q6_1", "q6_2", "q6_3"]], ["七", "圈圈看：部首是「手」、部首是「刀」的字（找一找）", ["ft7_2", "ft7_3"]], ["七", "圈圈看：偶／遇、史／使（2 題）；部首是「手」、部首是「刀」見「海圖找一找」", ["q7_1a", "q7_1b"]], ["八", "連連看（組成方式相同的短語：動作＋疊字＋的＋東西）", ["m4a"]], ["八", "照樣寫短語（1 題）", ["pl_1"]], ["九", "選擇題：字詞義及運用（感覺、想法、痛的意思；共 3 題）", ["q9_1", "q9_2", "q9_3"]], ["十", "閱讀測驗：種下一棵友情樹、有你真好、熊和旅人（完整短文）", ["b3q1", "b3q2", "b3q3", "b3q4", "b3q5", "b3q6", "b4q1", "b4q2", "b4q3", "b5q1", "b5q2", "b5q3"]], ["十一", "閱讀測驗：居安思危（完整短文）", ["b6q1", "b6q2", "b6q3", "b6q4"]], ["十二", "排出正確的順序（2 題）", ["o12a", "o12b"]], ["十三", "造句：一……就……（情境與看圖 3 題）", ["sn_1", "sn_2", "sn_3" /* ====== 排序造句共用：S6 小魚排排隊 ====== */
const CODES=['①','②','③','④','⑤','⑥'];

  if(it.pre){const q=MQ(it.pre.q,it.pre.opts,it.pre.ans,it.pre.why,{pO:0});q.id=id;q.sk='sent';q.say=it.pre.q+optSay(q);

'use strict';
function mixIds(n){const ks=Object.keys(SK);const out=[];let g=0,guard=0;
  while(out.length<n&&guard++<400){const k=ks[g%ks.length];const id=pickN(ALLIDS[k].filter(x=>!out.includes(x)&&mcq(x)),1)[0];if(id)out.push(id);g++}return shuffle(out)}
function gBoss(){quizRun({stage:'S12',ids:mixIds(NQ(10)),title:'🦈 黃色大魚',hearts:5,boss:true})}
function quizRun(o){const N=o.ids.length;if(!N){toast('目前沒有可以練習的題目');return notebook('wrong')}
  startSession(o.stage,o.hearts||0);const el=go(`${hudHTML({title:o.title,hearts:!!o.hearts,prog:'0/'+N})}<div class="stagebody" id="sb"></div>`,'stage');bindBack();const sb=$('#sb',el);
  let i=0,hint=2,coil=2;
  function next(){if(SES.max&&SES.hearts<=0)return endStage({dead:true});if(i>=N)return endStage({extra:o.boss?'<div class="card" style="max-width:26rem">🐠 大魚被趕跑了，小丑魚和海葵一起歡呼！大家為你歡呼！🎉</div>':''});
    setProg(i,N);const q=mcq(o.ids[i]);q.say=qSay(q);
    sb.innerHTML=(o.boss?`<div class="bosshead"><div class="bossface" id="bf">${i>=N-1?'😵':'🦈'}</div><div style="flex:1"><div style="font-weight:900">${T('大魚')}　${T('力氣')}</div><div class="hpbar" style="max-width:none"><i id="hp" style="width:${(N-i)/N*100}%"></i></div></div></div>`:progBar())+`<div class="powers"><button class="btn p sm" id="pc" ${coil?'':'disabled'}>🛡️ 刪去 2 個×${coil}</button><button class="btn b sm" id="ph" ${hint?'':'disabled'}>🔍 提示 ×${hint}</button></div><div class="hint" id="th" style="min-height:1.6rem"></div><div id="qh"></div>`;
    if(!o.boss)setPB(i/N);
    const h=renderMCQ($('#qh',sb),q,{retry:!!o.retry,onAnswer:ok=>{if(ok){const bf=$('#bf');if(bf)bf.classList.add('hit');const hp=$('#hp');if(hp)hp.style.width=((N-i-1)/N*100)+'%';if(o.boss){popEl($('#bf'),'🎯 射出刺針！')}}else{loseHeart();const bf=$('#bf');if(bf)bf.classList.add('atk')}},onDone:()=>{i++;next()}});
    $('#pc').onclick=()=>{if(!coil)return;if(h.remove2()){coil--;$('#pc').textContent='🛡️ 刪去 2 個×'+coil;if(!coil)$('#pc').disabled=true;sfx('pop')}};
    $('#ph').onclick=()=>{if(!hint)return;hint--;$('#ph').textContent='🔍 提示 ×'+hint;if(!hint)$('#ph').disabled=true;$('#th').innerHTML='💡 '+T(q.tip||'仔細讀題目，把每個選項讀一讀。');sfx('pop')}}
  next()}

  <div class="hint" style="margin-bottom:.6rem">${T('玩法：各組輪流回答。答對的組別，潛水員就往前游一格；先游到終點、或題目結束時游得最遠的組別獲勝！每題答完都會顯示解析，老師可以順便講解。可用鍵盤 1～4 或 A～D 選答案。答題不會計入個人學習紀錄。')}</div>
  <div class="row" style="justify-content:center"><button class="btn g big" id="st">🐠 開始比賽</button></div></div></div>`,'stage');
  bindBack(hub);
  const drawT=()=>{$('#tc',el).innerHTML=Array.from({length:CL.teams},(_,i)=>`<label class="tpill" style="background:${TCOL[i]}">🐠<input data-i="${i}" value="${esc(CL.names[i])}" maxlength="6" style="width:6rem;margin-left:.3rem"></label>`).join('');$$('#tc input',el).forEach(x=>x.oninput=()=>{CL.names[+x.dataset.i]=x.value.trim()||('第'+(+x.dataset.i+1)+'組')})};drawT();
  const seg=(id,key,cb)=>$$('#'+id+' button',el).forEach(b=>b.onclick=()=>{CL[key]=+b.dataset.v;$$('#'+id+' button',el).forEach(x=>x.classList.toggle('on',x===b));if(cb)cb()});
  seg('tn','teams',drawT);seg('qn','n');seg('qs','sec');
  $$('#ty button',el).forEach(b=>b.onclick=()=>{const k=b.dataset.k;const cnt=Object.values(CL.types).filter(Boolean).length;if(CL.types[k]&&cnt<=1){toast('至少要選一種題型');return}CL.types[k]=CL.types[k]?0:1;b.classList.toggle('on',!!CL.types[k])});
  $('#st').onclick=()=>{getAC();classPlay()}}
function classPlay(){
  const pool=shuffle([].concat(...Object.keys(CL.types).filter(k=>CL.types[k]).map(k=>ALLIDS[k]))).filter(id=>mcq(id));
  const ids=pool.slice(0,CL.n);
  const N=ids.length,T_=CL.teams,teams=Array.from({length:T_},(_,i)=>({n:CL.names[i],c:TCOL[i],s:0}));let i=0,tm=null;
  const el=go(`<div class="hud"><button class="ibtn" id="hBack">⬅️</button><div class="title-h">🐠 全班潛水競賽</div><div class="grow"></div><span class="pill" id="prog">0/${N}</span></div><div class="stagebody" id="sb" style="font-size:1.15em"></div>`,'stage');
  bindBack(()=>confirmBox('結束比賽？','目前的比分不會保留。','結束',classSetup));const sb=$('#sb',el);
  function race(){return`<div class="race">${teams.map((t,k)=>`<div class="rtrack"><span class="tn" style="color:${t.c}">${esc(t.n)}</span><div class="lane2"><span class="bal" id="bal${k}" style="left:${4+t.s/N*88}%">🐠</span></div><b style="width:2.4rem">${t.s}</b></div>`).join('')}</div>`}
  function next(){if(i>=N)return finish();setProg(i,N);const t=teams[i%T_],q=mcq(ids[i]);q.say='輪到'+t.n+'。'+qSay(q);
    sb.innerHTML=race()+`<div style="text-align:center"><span class="tpill" style="background:${t.c}">🎯 輪到：${esc(t.n)}</span></div>${CL.sec?'<div class="timerbar"><i id="tb" style="width:100%"></i></div>':''}<div id="qh"></div>`;
    const h=renderMCQ($('#qh'),q,{norec:true,tag:true,noauto:false,onAnswer:ok=>{if(tm)tm();if(ok){t.s++;const b=$('#bal'+(i%T_));if(b)b.style.left=(4+t.s/N*88)+'%';sfx('win')}},onDone:()=>{i++;if(teams.some(x=>x.s>=N))i=N;next()}});
    if(CL.sec){let left=CL.sec;const tb=$('#tb');tm=loop(dt=>{left-=dt;tb.style.width=Math.max(0,left/CL.sec*100)+'%';tb.style.background=left<CL.sec*.25?'var(--coral)':left<CL.sec*.5?'var(--sun2)':'var(--green)';if(left<=0){tm();tm=null;h.timeout()}})}}
  function finish(){const rk=teams.slice().sort((a,b)=>b.s-a.s);const top=rk[0].s;S.cls++;saveNow();checkBadges();sfx('win');confetti(40);
    sb.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3.4rem">🏆</div><h2>比賽結束！</h2>${rk.map((t,k)=>`<div class="tpill" style="background:${t.c};margin:.2rem;font-size:${1.6-k*.1}rem">${['🥇','🥈','🥉','4️⃣'][k]} ${esc(t.n)}　${t.s} 分${t.s===top?'　👑':''}</div><br>`).join('')}<div class="row" style="justify-content:center;margin-top:.6rem"><button class="btn w" id="mp">🗺️ 回海底地圖</button><button class="btn g big" id="ag">🔁 再比一場</button><button class="btn b" id="cf">⚙️ 重新設定</button></div></div>`;
    $('#mp').onclick=hub;$('#ag').onclick=classPlay;$('#cf').onclick=classSetup}
  next()}

(function(){const cue=document.createElement('button');cue.className='scrollcue';cue.innerHTML='👇 還有喔，往下看';document.body.appendChild(cue);let sc=null;
  function find(){const scr=[...document.querySelectorAll('#app .screen')].pop();if(!scr)return null;let best=null;

  cue.onclick=()=>{if(sc)sc.scrollBy({top:Math.max(160,sc.clientHeight*.7),behavior:'smooth'})};
