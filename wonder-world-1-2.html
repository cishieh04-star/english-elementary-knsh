<title>Are You Hungry? 闖關樂園</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
/* Layout: one-screen app. Top bar (home / voice / speed / stars) + a stage that fits the screen without scrolling.
   Each theme swaps the whole palette, so colors are set explicitly per theme (single look, chosen by the teacher). */
:root{
  --bg:#fff1f6; --bg2:#ffd9e8; --ink:#3a1f4d; --soft:#7a5f8a; --card:#ffffff;
  --accent:#ff4f86; --accent2:#7b5cff; --mon:#5cc8ff; --good:#21b26a; --pond1:#8fdcff; --pond2:#2e8fd6;
  --en:"Andika","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  --zh:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--zh);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--accent2);outline-offset:3px}
#deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#deco span{position:absolute;font-size:34px;opacity:.22;animation:floaty 9s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-18px) rotate(8deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

.screen{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.screen[hidden]{display:none!important}

/* ---------- top bar ---------- */
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;flex:0 0 auto}
.tb{font:700 15px/1 var(--zh);padding:9px 13px;border-radius:999px;border:2.5px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink)}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tb.home{background:var(--accent);color:#fff;border-color:var(--ink)}
.starPill{font:700 17px/1 var(--en);padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--bg);display:inline-flex;gap:6px;align-items:center}
.starPill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35)}}

/* ---------- home ---------- */
.homeTop{text-align:center;padding-top:4px}
.homeTop h1{margin:0;font:700 clamp(30px,8vw,54px)/1.05 var(--en);color:var(--accent);text-shadow:3px 3px 0 var(--ink);letter-spacing:.5px}
.homeTop p{margin:4px 0 0;font-weight:700;font-size:clamp(15px,4vw,20px)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:10px}
.lbl{font-weight:800;font-size:15px}
.chip{font:700 15px/1 var(--zh);padding:10px 12px;border-radius:14px;border:2.5px solid var(--ink);background:var(--card);display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--ink);color:var(--bg)}
.bigBtn{font:800 clamp(17px,4.6vw,22px)/1 var(--zh);padding:14px 20px;border-radius:20px;border:3px solid var(--ink);background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--ink)}
.bigBtn.alt{background:var(--accent2)}
.bigBtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.mapBox{position:relative;flex:1 1 auto;min-height:190px;margin-top:10px;border-radius:26px;border:3px dashed var(--ink);background:var(--bg2);padding:10px 6px}
.mapTitle{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--bg);padding:0 10px;font-weight:800;font-size:14px;white-space:nowrap}
#mapSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#map{position:relative;height:100%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;gap:4px;align-items:center;justify-items:center}
.node{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:2px;min-width:0}
.node .ball{position:relative;width:clamp(48px,13vmin,82px);aspect-ratio:1;border-radius:50%;background:var(--card);border:3px solid var(--ink);display:grid;place-items:center;font-size:clamp(24px,6.5vmin,40px);box-shadow:0 4px 0 var(--ink)}
.node .n{position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;background:var(--accent2);color:#fff;font:700 14px/24px var(--en);text-align:center;border:2px solid var(--ink)}
.node.done .ball::after{content:"過關";position:absolute;bottom:-8px;right:-14px;background:var(--good);color:#fff;font:800 11px/1 var(--zh);padding:4px 5px;border-radius:8px;border:2px solid var(--ink)}
.node .nm{font-weight:800;font-size:clamp(11px,3vw,14px);text-align:center;line-height:1.15;max-width:7em}
.lineTip{margin-top:8px;padding:10px 12px;border-radius:14px;background:#fff3c4;color:#4a3500;border:2px solid #4a3500;font-weight:700;font-size:15px;text-align:center}
.lineTip a{color:#b3261e;font-weight:900}

/* ---------- game ---------- */
.head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;margin-top:8px}
#lvTitle{font-weight:900;font-size:clamp(16px,4.4vw,21px)}
.dots{display:flex;gap:5px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dots i.d{background:var(--good)} .dots i.c{background:var(--accent)}
.board{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.team{font:800 14px/1 var(--zh);padding:7px 10px;border-radius:12px;border:2.5px solid var(--ink);background:var(--card);color:#222}
.team.now{transform:scale(1.12);box-shadow:0 0 0 4px var(--accent)}
#instr{text-align:center;font-weight:800;font-size:clamp(15px,4vw,19px);margin:6px 0 2px;min-height:1.3em}
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;position:relative}
#prompt{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
#field{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}
.foot{flex:0 0 auto;display:flex;justify-content:center;padding-bottom:4px}
.again{font:800 18px/1 var(--zh);padding:12px 22px;border-radius:999px;border:3px solid var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink)}
.fitHint{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);font-weight:800;padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap}

/* generic option cards */
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:stretch;width:100%}
.opt{font:700 clamp(22px,6vmin,38px)/1.15 var(--en);background:var(--card);color:var(--ink);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:12px 18px;min-width:84px;min-height:64px;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .2s}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.opt.pic{padding:6px;width:clamp(96px,27vmin,170px)}
.opt.sent{font-size:clamp(19px,5vmin,30px)}
.no{opacity:.3!important;filter:grayscale(1);pointer-events:none}
.yes{background:var(--good)!important;color:#fff!important;transform:scale(1.08)}
.hint{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px var(--accent),0 6px 0 var(--ink);transform:scale(1.06)}}
.reading{outline:5px solid var(--accent);outline-offset:3px;transform:scale(1.06)}
.mon{width:100%;height:auto;display:block}
.bigMon{width:clamp(130px,34vmin,240px)}
.listen{font-size:clamp(46px,13vmin,80px);width:clamp(80px,20vmin,120px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--card);border:4px solid var(--ink);animation:ear 1.6s ease-in-out infinite}
@keyframes ear{50%{transform:scale(1.08)}}
.picCard{font-size:clamp(56px,16vmin,100px);line-height:1;background:var(--card);border:4px solid var(--ink);border-radius:24px;padding:10px 16px}
.word{font:700 clamp(36px,10vmin,64px)/1 var(--en);letter-spacing:2px;background:var(--card);border:4px solid var(--ink);border-radius:20px;padding:10px 18px}
.word .blank{display:inline-block;min-width:.75em;border-bottom:6px solid var(--accent);color:var(--accent);text-align:center}
.word b{color:var(--accent)}

/* L1 bubbles */
.bubbles{display:flex;gap:clamp(10px,4vw,30px);justify-content:center;align-items:center;flex-wrap:wrap;width:100%}
.bubble{width:clamp(88px,26vmin,170px);aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.95);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,.35) 20%,rgba(150,215,255,.45) 62%,rgba(150,120,255,.6) 100%);
  box-shadow:inset -8px -10px 18px rgba(90,60,200,.25),0 6px 14px rgba(0,0,0,.15);font:700 clamp(46px,14vmin,92px)/1 var(--en);color:var(--ink);animation:bob 3s ease-in-out infinite;animation-delay:var(--d)}
@keyframes bob{50%{transform:translateY(-14px)}}
.bubble.popped{animation:pop .35s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}

/* L2 fishing */
.pond{position:relative;width:100%;max-width:720px;height:100%;min-height:200px;border-radius:30px;border:4px solid var(--ink);background:linear-gradient(var(--pond1),var(--pond2));overflow:hidden;display:flex;flex-direction:column;justify-content:space-around;padding:8px 0}
.pond::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 20% 30%,rgba(255,255,255,.12) 0 6px,transparent 6px 40px);pointer-events:none}
.lane{position:relative;height:30%}
.fish{position:absolute;top:50%;left:4%;transform:translateY(-50%);height:100%;max-height:96px;aspect-ratio:1.9;border:0;background:none;padding:0;animation:swim var(--t) ease-in-out infinite alternate;animation-delay:var(--d)}
.fish .body{position:absolute;inset:0 0 0 22%;border-radius:50% 60% 60% 50%/55% 50% 50% 45%;background:var(--fc);border:3.5px solid #2b2340;display:grid;place-items:center;font:700 clamp(30px,9vmin,56px)/1 var(--en);color:#2b2340}
.fish .tail{position:absolute;left:0;top:18%;width:28%;height:64%;background:var(--fc);border:3.5px solid #2b2340;clip-path:polygon(0 0,100% 50%,0 100%);}
.fish .eye{position:absolute;right:12%;top:26%;width:9%;aspect-ratio:1;border-radius:50%;background:#2b2340}
@keyframes swim{from{left:3%}to{left:52%}}
.fish.hooked{animation:hook 1s forwards}
@keyframes hook{to{transform:translateY(-260%) rotate(-25deg)}}
.rod{position:absolute;top:4px;right:10px;font-size:40px;z-index:2}

/* L3 claw machine */
.machine{position:relative;width:100%;max-width:520px;height:100%;min-height:210px;border:6px solid var(--ink);border-radius:26px 26px 12px 12px;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.3)),var(--bg2);overflow:hidden}
.machine .rail{position:absolute;top:0;left:0;right:0;height:14px;background:var(--ink)}
.claw{position:absolute;top:10px;left:50%;width:70px;margin-left:-35px;display:flex;flex-direction:column;align-items:center;transition:left .6s ease;z-index:3}
.rope{width:5px;height:20px;background:var(--ink);transition:height .6s ease}
.tip{position:relative;width:70px;height:46px}
.tip svg{width:100%;height:100%}
.hole{position:absolute;left:3%;bottom:0;width:17%;height:26%;background:var(--ink);border-radius:12px 12px 0 0;color:var(--bg);font-weight:800;font-size:13px;display:grid;place-items:center}
.cball{position:absolute;bottom:14px;width:clamp(64px,17vmin,100px);aspect-ratio:1;margin-left:calc(clamp(64px,17vmin,100px) / -2);border-radius:50%;border:4px solid var(--ink);font:700 clamp(32px,9vmin,54px)/1 var(--en);color:#2b2340;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--bc) 45%);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.cball.held{position:absolute;bottom:auto;top:30px;left:50%!important}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* L4 Ferris wheel */
.wheelWrap{position:relative;width:min(86vw,52vh,440px);aspect-ratio:1;max-width:100%}
.stand{position:absolute;inset:0;width:100%;height:100%}
.wheel{position:absolute;inset:0;animation:spin 34s linear infinite}
.wheel svg{width:100%;height:100%}
.gon{position:absolute;width:33%;aspect-ratio:1;animation:spin 34s linear infinite reverse;border:0;background:none;padding:0}
.gon .cab{position:absolute;inset:8% 4% 0;background:var(--card);border:4px solid var(--ink);border-radius:18px 18px 30px 30px;box-shadow:0 5px 0 var(--ink);padding:4%;transition:transform .15s}
.gon .cab::before{content:"";position:absolute;left:50%;top:-14%;width:4px;height:14%;background:var(--ink)}
.gon.yes .cab{background:var(--good)} .gon.hint .cab{animation:glow 1s infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* L5/L8 monster with speech */
.monRow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.speech{position:relative;font:700 clamp(22px,6vmin,36px)/1.2 var(--en);background:var(--card);border:4px solid var(--ink);border-radius:22px;padding:10px 16px;max-width:min(80vw,420px)}
.speech.me{background:var(--accent);color:#fff}

/* L6 spelling train */
.train{display:flex;align-items:flex-end;gap:4px;justify-content:center;transition:transform 1.4s ease-in}
.train.go{transform:translateX(120vw)}
.engine{font-size:clamp(40px,11vmin,64px);line-height:1}
.car{position:relative;width:clamp(36px,10.5vw,62px);height:clamp(44px,12vw,70px);border:3.5px solid var(--ink);border-radius:10px;background:var(--card);display:grid;place-items:center;font:700 clamp(26px,7.5vw,44px)/1 var(--en);margin-bottom:10px}
.car::after{content:"";position:absolute;bottom:-12px;left:12%;right:12%;height:14px;background:radial-gradient(circle,var(--ink) 0 5px,transparent 6px) 0 0/50% 100% repeat-x}
.car.next{box-shadow:0 0 0 4px var(--accent);animation:ear 1.2s infinite}
.car.full{background:var(--bg2)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.tile{width:clamp(54px,15vmin,78px);height:clamp(54px,15vmin,78px);min-width:0;min-height:0;padding:0}

/* L7 feeding */
.items{display:flex;gap:14px;justify-content:center}
.item{font-size:clamp(46px,13vmin,80px);width:clamp(82px,22vmin,130px);aspect-ratio:1;padding:0;transition:transform .7s cubic-bezier(.5,-0.3,.6,1),opacity .7s}

/* L9 chat */
.phone{width:100%;max-width:480px;height:100%;min-height:240px;border:6px solid var(--ink);border-radius:30px;background:var(--card);display:flex;flex-direction:column;overflow:hidden}
.phone .top{background:var(--ink);color:var(--bg);font-weight:800;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:15px}
.phone .top .av{width:34px}
.msgs{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:10px;overflow:hidden}
.msg{font:700 clamp(20px,5.4vmin,30px)/1.2 var(--en);padding:9px 14px;border-radius:20px;max-width:85%;border:3px solid var(--ink);animation:in .3s}
.msg.l{align-self:flex-start;background:var(--bg2);color:var(--ink);border-bottom-left-radius:4px}
.msg.r{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
@keyframes in{from{transform:translateY(12px);opacity:0}}
.replies{display:flex;flex-direction:column;gap:8px;padding:10px;border-top:3px dashed var(--ink)}
.replies .opt{justify-content:flex-start;min-height:52px;padding:8px 14px;font-size:clamp(19px,5vmin,28px);box-shadow:0 4px 0 var(--ink)}

/* L10 boss */
.bossTop{display:flex;align-items:center;justify-content:center;gap:12px}
.bossTop .mon{width:clamp(90px,22vmin,150px)}
.heat{width:clamp(120px,40vw,240px)}
.heat .lab{font-weight:900;font-size:15px;margin-bottom:4px}
.heat .tube{height:22px;border:3px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.heat .lv{height:100%;width:100%;background:linear-gradient(90deg,#ffb020,#ff3b30);transition:width .6s}
.count{font:700 clamp(70px,24vmin,150px)/1 var(--en);color:var(--accent);text-shadow:4px 4px 0 var(--ink);animation:bump .8s}

/* overlay */
.overlay{position:fixed;inset:0;z-index:45;background:rgba(20,10,40,.55);display:grid;place-items:center;padding:16px}
.panel{background:var(--card);color:var(--ink);border:5px solid var(--ink);border-radius:30px;padding:22px 20px;text-align:center;max-width:430px;width:100%;box-shadow:0 10px 0 var(--ink);animation:in .35s}
.panel .big{font-weight:900;font-size:clamp(26px,7vw,36px)}
.panel .trophy{font-size:80px;line-height:1.1;animation:bump 1s infinite}
.panel p{font-weight:800;font-size:18px;margin:8px 0}
.panel .row{margin-top:12px}
.rank{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.rank div{font-weight:900;font-size:20px;padding:8px;border-radius:12px;border:3px solid var(--ink);color:#222}

@media (prefers-reduced-motion:reduce){
  .wheel,.gon,.bubble,.fish,#deco span,.listen,.car.next{animation:none!important}
}
</style>

<div id="deco"></div>
<canvas id="fx"></canvas>

<!-- HOME -->
<section id="home" class="screen">
  <div class="homeTop">
    <h1>Are You Hungry?</h1>
    <p>英文第二課　闖關樂園</p>
  </div>
  <div class="row"><span class="lbl">選畫面主題</span><span id="themes" class="row" style="margin:0"></span></div>
  <div class="row">
    <button class="bigBtn" id="goSolo">從第一關開始闖關</button>
    <button class="bigBtn alt" id="goGroup">小組競賽</button>
  </div>
  <div class="row">
    <span class="lbl">語音說明</span>
    <button class="chip on" id="vOn">要</button>
    <button class="chip" id="vOff">不要</button>
  </div>
  <div id="lineTip" class="lineTip" hidden>在 LINE 裡面可能聽不到聲音。<a id="lineLink" href="#" target="_blank" rel="noopener">請按這裡，用瀏覽器打開</a></div>
  <div class="mapBox"><span class="mapTitle" id="mapTitle">闖關地圖（點一關也可以直接玩）</span><svg id="mapSvg"></svg><div id="map"></div></div>
</section>

<!-- GAME -->
<section id="game" class="screen" hidden>
  <div class="bar">
    <button class="tb home" id="bHome">回首頁</button>
    <button class="tb" id="bVoice">不要語音說明</button>
    <button class="tb" id="bSlow">唸慢一點</button>
    <button class="tb" id="bFast">唸快一點</button>
    <span class="starPill" id="starPill">⭐ <b id="starN">0</b></span>
  </div>
  <div class="head"><span id="lvTitle"></span><span class="dots" id="dots"></span><div class="board" id="board" hidden></div></div>
  <div id="instr"></div>
  <div id="stage">
    <div id="prompt"></div>
    <div id="field"></div>
    <div class="foot"><button class="again" id="bAgain">再聽一次</button></div>
  </div>
</section>

<div id="fitHint" class="fitHint" hidden>下面還有，請往下滑</div>

<div id="ov" class="overlay" hidden><div class="panel" id="ovPanel"></div></div>

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ================= THEMES ================= */
const THEMES={
  party:{name:'怪獸派對',ic:'🎉',v:{bg:'#fff1f6',bg2:'#ffd9e8',ink:'#3a1f4d',soft:'#7a5f8a',card:'#ffffff',accent:'#ff4f86',accent2:'#7b5cff',mon:'#5cc8ff',pond1:'#8fdcff',pond2:'#2e8fd6'},deco:['🎈','🎉','🧁','🎊','🍭'],map:'派對地圖',light:true},
  sea:{name:'海底探險',ic:'🐠',v:{bg:'#e2f6ff',bg2:'#b6e5fa',ink:'#0b3553',soft:'#3d6a88',card:'#ffffff',accent:'#ff7a2f',accent2:'#1497c4',mon:'#ff86b0',pond1:'#7fe3d8',pond2:'#147a9e'},deco:['🐠','🫧','🐚','🪸','🐡'],map:'海底地圖',light:true},

/* 一律用小寫唸，避免手機唸出 capital；a、f 用拼音字避免怪音 */

function say(items,done){
  if(!synth){if(done)setTimeout(done,400);return}
  try{synth.cancel()}catch(e){}
  const tok=++SP.tok;let i=0;
  const next=()=>{
    if(tok!==SP.tok)return;
    if(i>=items.length){done&&done();return}
    let it=items[i++]; if(typeof it==='string')it={t:it};
    if(it.zh&&!SP.voice){next();return}
    it.on&&it.on();
    const u=new SpeechSynthesisUtterance(it.t);
    u.lang=it.zh?'zh-TW':'en-US';
    u.rate=Math.max(.45,Math.min(1.6,(it.zh?1:.78)*SP.rate));
    let fired=false;
    const fin=()=>{if(fired)return;fired=true;clearTimeout(tm);it.off&&it.off();setTimeout(next,(it.gap??500)/SP.rate)};
    u.onend=fin;u.onerror=fin;
    const tm=setTimeout(fin,(1300+it.t.length*(it.zh?340:130))/SP.rate);
    try{synth.speak(u)}catch(e){fin()}
  };
  setTimeout(next,90);
}

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,type='sine',v=.16,f2){const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(t0,d,v,freq=1800){const a=ac();if(!a)return;const b=a.createBuffer(1,Math.max(1,a.sampleRate*d|0),a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/ch.length,3);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=a.createGain();g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t0)}
const FX={
  ding(){tone(988,0,.22);tone(1319,.1,.4)},
  arp(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.07,.3,'triangle',.14))},
  boop(){tone(200,0,.2,'sine',.07)},
  pop(){tone(500,0,.1,'sine',.2,1500)},
  clap(){for(let i=0;i<16;i++)noise(i*.055+Math.random()*.04,.09,.55,1500+Math.random()*900)},
  coin(){tone(988,0,.08,'square',.06);tone(1319,.08,.3,'square',.06)},
  boing(){tone(180,0,.4,'triangle',.18,520)},
  fanfare(){[[523,0],[659,.12],[784,.24],[1047,.4],[784,.58],[1047,.7]].forEach(([f,t])=>tone(f,t,.35,'triangle',.15));FX.clap()},
  choo(){noise(0,.35,.4,600);noise(.4,.35,.4,600);tone(740,.1,.5,'square',.05);tone(880,.1,.5,'square',.04)},
  whir(){tone(110,0,.55,'sawtooth',.035)},

const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fitCanvas(){const d=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
fitCanvas();
function emit(x,y,n,kind){
  const cols=[cssv('--accent'),cssv('--accent2'),'#ffd23f','#21b26a','#5cc8ff','#ff8a3d'];
  const emo=THEMES[theme].deco;
  for(let i=0;i<(reduce?n/3:n);i++){
    const a=Math.random()*Math.PI*2,s=kind==='rain'?0:2+Math.random()*6;
    parts.push({x:kind==='rain'?Math.random()*innerWidth:x,y:kind==='rain'?-20-Math.random()*200:y,
      vx:Math.cos(a)*s,vy:kind==='rain'?2+Math.random()*3:Math.sin(a)*s-(kind==='fire'?0:3),
      r:4+Math.random()*5,c:rnd(cols),life:kind==='rain'?160:70+Math.random()*30,rot:Math.random()*6,
      e:kind==='rain'||(kind==='emo')?rnd(['⭐',...emo]):null,sq:Math.random()<.5});
  }
  if(!raf)raf=requestAnimationFrame(step);
}
function step(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life-->0&&p.y<innerHeight+40);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.e&&p.vx===0?0.02:.18;p.vx*=.99;p.rot+=.1;
    cx.globalAlpha=Math.min(1,p.life/30);
    if(p.e){cx.font='26px serif';cx.fillText(p.e,p.x,p.y)}
    else{cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);if(p.sq)cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{cx.beginPath();cx.arc(0,0,p.r,0,7);cx.fill()}cx.restore()}}
  cx.globalAlpha=1;
  raf=parts.length?requestAnimationFrame(step):0;
}
function celebrate(el){
  let x=innerWidth/2,y=innerHeight/2;
  if(el&&el.getBoundingClientRect){const r=el.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2}
  const k=Math.random()*5|0;
  if(k===0){emit(x,y,40,'conf');FX.ding()}
  else if(k===1){emit(x,y,14,'emo');FX.arp()}
  else if(k===2){emit(0,0,24,'rain');FX.coin()}
  else if(k===3){emit(x,y,30,'conf');FX.clap()}
  else{emit(x*0.6,y*0.7,26,'fire');setTimeout(()=>emit(x*1.3,y*0.6,26,'fire'),180);FX.arp()}
}
function fireworks(times){for(let i=0;i<times;i++)setTimeout(()=>{emit(innerWidth*(.2+Math.random()*.6),innerHeight*(.15+Math.random()*.4),40,'fire');FX.pop()},i*420)}

/* ---------- mixed card questions (boss + 小組競賽) ---------- */
function mixQ(types){
  const t=rnd(types);
  if(t==='letter'){const q=rnd(LETTER_Q);return {ins:'聽字母，點一下對的字母。',p:`<div class="listen">👂</div>`,say:[{t:LN(q.a),gap:900},{t:LN(q.a)}],o:shuffle(q.o).map(l=>({h:l,ok:l===q.a}))}}
  if(t==='start'){const q=rnd(START_Q);return {ins:'聽單字，點一下第一個字母。',p:`<div class="picCard">${q.e}</div>`,say:[{t:q.w,gap:900},{t:q.w}],o:shuffle(q.o).map(l=>({h:l,ok:l===q.a}))}}
  if(t==='listenFeel'){const f=rnd(FEELS);const s=Math.random()<.5?f:`I'm ${f}.`;return {ins:'聽英文，點一下對的怪獸。',p:`<div class="listen">👂</div>`,say:[{t:s,gap:900},{t:s}],o:shuffle([f,...others(f)]).map(x=>({h:monster(x),ok:x===f,pic:1}))}}
  if(t==='lookWord'){const f=rnd(FEELS);return {ins:'看怪獸的臉，選出對的英文。',p:`<div class="bigMon" style="width:clamp(100px,24vmin,170px)">${monster(f)}</div>`,read:1,o:shuffle([f,...others(f)]).map(x=>({h:x,s:x,ok:x===f}))}}
  if(t==='yesno'){const f=rnd(FEELS),a=Math.random()<.5?f:rnd(others(f,4)),y=a===f;return {ins:'看怪獸的臉，幫怪獸回答。',p:`<div class="monRow"><div class="bigMon" style="width:clamp(100px,24vmin,170px)">${monster(f)}</div><div class="speech me">Are you ${a}?</div></div>`,lead:{t:`Are you ${a}?`,gap:800},read:1,o:[{h:'Yes, I am.',s:'Yes, I am.',ok:y,sent:1},{h:"No, I'm not.",s:"No, I'm not.",ok:!y,sent:1}]}}
  const q=rnd(CHAT_Q);return {ins:'聽朋友說的話，選一個對的回答。',p:`<div class="speech">${q.pic} ${q.line}</div>`,lead:{t:q.line,gap:900},read:1,o:shuffle([q.ok,...q.bad]).map(x=>({h:x,s:x,ok:x===q.ok,sent:1}))};
}
function cardQ(q,onRight){
  const box=F();
  box.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%"><div>${q.p}</div><div class="opts">${q.o.map(o=>`<button class="opt ${o.pic?'pic':''} ${o.sent?'sent':''}" ${o.s?`data-say="${o.s.replace(/"/g,'&quot;')}"`:''} data-ok="${o.ok?1:''}">${o.h}</button>`).join('')}</div></div>`;
  const bs=[...box.querySelectorAll('.opt')];
  bs.forEach(b=>b.onclick=()=>{if(b.dataset.ok){if(G.locked)return;onRight&&onRight();good(b)}else bad(b)});
  const lead=[];
  if(G.mode==='group'){const tm=G.teams[G.turn];$('#instr').textContent=`輪到${tm.n}：${q.ins}`;lead.push({t:`輪到${tm.n}`,zh:1,gap:300})}
  else lead.push(instrItem('mix'+q.ins,q.ins,q.ins));
  if(G.mode==='group')lead.push({t:q.ins,zh:1,gap:300});
  const items=[...(q.lead?[q.lead]:[]),...(q.say||[]),...(q.read?readOpts(bs):[])];
  begin(lead,items);
}
