<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小龍彩虹畫室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen paint-studio app — control bar on top, a wooden-palette level map, paint-blob answer buttons; no scrolling */
:root{
  --bg:#FDEFF4; --panel:#FFFFFF; --ink:#2B2340; --soft:#6E6385; --wood:#C98F55; --wood2:#A86F3B; --line:#EBCFDB;
  --red:#E8322B; --yellow:#FFD21F; --blue:#2F7DF6; --green:#2BAA4A; --pink:#FF8CC6; --purple:#8B4FD8; --orange:#FF8A1F;
  --f-en:"Fredoka","Arial Rounded MT Bold",Arial,sans-serif;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-zh);overflow-x:hidden;
  background-image:radial-gradient(circle at 8% 90%,#FFD21F33 0 70px,transparent 71px),radial-gradient(circle at 94% 12%,#2F7DF622 0 90px,transparent 91px),radial-gradient(circle at 70% 96%,#2BAA4A22 0 50px,transparent 51px)}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,.opt:focus-visible,.drop:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px;box-sizing:border-box;gap:6px}
.en{font-family:var(--f-en)}
.rainbow-text span:nth-child(6n+1){color:var(--red)}.rainbow-text span:nth-child(6n+2){color:var(--orange)}.rainbow-text span:nth-child(6n+3){color:#E0B000}.rainbow-text span:nth-child(6n+4){color:var(--green)}.rainbow-text span:nth-child(6n+5){color:var(--blue)}.rainbow-text span:nth-child(6n){color:var(--purple)}

#topbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
#topbar button,#topbar .chip{border:2px solid var(--ink);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:clamp(13px,3.4vmin,16px);font-weight:700;line-height:1.2}
#tbBack{background:var(--yellow)!important}
#tbStar{background:var(--ink)!important;color:#fff;min-width:64px;text-align:center}
#tbVoice.off{background:#FFE0DD!important}
#tbPause{background:#C9E7FF!important}

#view{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;min-height:0}

/* splash */
#splash{align-items:center;justify-content:center;text-align:center;gap:16px}
.logo{font-family:var(--f-en);font-weight:700;font-size:clamp(38px,10vmin,88px);line-height:.95}
.logo small{display:block;font-family:var(--f-zh);font-size:.4em;font-weight:900;margin-top:.3em;letter-spacing:3px;color:var(--ink)}
.splash-art .pic{width:clamp(120px,32vmin,240px);height:auto;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}
.bigbtn{border:3px solid var(--ink);background:var(--purple);color:#fff;font-weight:900;font-size:clamp(22px,6vmin,40px);padding:.45em 1.4em;border-radius:999px;box-shadow:0 6px 0 var(--ink)}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.bigbtn.alt{background:var(--blue)}
.linebar{background:#FFF4C2;border:2px dashed var(--ink);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;max-width:520px}
.linebar a{display:inline-block;margin-top:6px;background:var(--blue);color:#fff;padding:6px 14px;border-radius:10px;text-decoration:none}

/* home */
#home{align-items:center;justify-content:center}
.homecard{background:var(--panel);border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:clamp(10px,2.5vmin,22px);width:min(100%,760px);display:grid;gap:clamp(6px,1.6vmin,14px);box-sizing:border-box;max-height:100%;overflow:auto}
.homecard h1{margin:0;text-align:center;font-family:var(--f-en);font-size:clamp(26px,6.5vmin,48px);line-height:1}
.homecard h1 small{display:block;font-family:var(--f-zh);font-size:.45em;color:var(--soft);font-weight:700;margin-top:4px}
.lbl{font-weight:900;font-size:clamp(15px,3.8vmin,20px)}
#nameIn{width:100%;box-sizing:border-box;font-size:clamp(18px,4.6vmin,26px);padding:8px 12px;border:3px solid var(--ink);border-radius:14px;font-family:var(--f-zh);font-weight:700}
#players{display:flex;flex-wrap:wrap;gap:6px}
#players button{border:2px solid var(--ink);background:#F3EAFF;border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
#chars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
#chars button{border:3px solid var(--line);background:#FFF8FB;border-radius:18px;padding:4px 0;display:flex;flex-direction:column;align-items:center;font-size:clamp(11px,2.6vmin,14px);font-weight:700}
#chars button b{font-size:clamp(28px,7vmin,46px);line-height:1.15;font-weight:400}
#chars button.on{border-color:var(--ink);background:var(--yellow);transform:translateY(-3px)}
.homebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.homebtns .bigbtn{font-size:clamp(20px,5.2vmin,32px)}
@media (max-aspect-ratio:1/1){ #chars{grid-template-columns:repeat(4,1fr)} }

/* map: wooden palette with paint wells */
#map{gap:6px}
.maphead{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:clamp(16px,4.2vmin,26px)}
.maphead b{font-size:1.5em;font-weight:400}
#tiles{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(6px,1.6vmin,14px);
  background:radial-gradient(ellipse at 30% 30%,#D9A36A,var(--wood) 60%,var(--wood2));border-radius:38px 38px 60px 38px;padding:clamp(8px,2vmin,16px);border:3px solid var(--ink)}
.tile{position:relative;border:3px solid var(--ink);border-radius:50% 46% 48% 52%/50% 52% 48% 50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px;min-height:0;overflow:hidden;text-align:center;box-shadow:inset 0 -8px 0 var(--well,#eee)}
.tile .num{position:absolute;top:8%;left:12%;font-family:var(--f-en);font-weight:700;font-size:clamp(14px,3.4vmin,20px);color:var(--soft)}
.tile .ic{font-size:clamp(22px,6vmin,44px);line-height:1}
.tile .nm{font-weight:900;font-size:clamp(12px,3.2vmin,19px);line-height:1.15}
.tile .sb{font-size:clamp(10px,2.5vmin,14px);color:var(--soft);font-weight:700}
.tile.done{background:#F2FFF5}
.tile.done .got{position:absolute;right:10%;top:6%;width:clamp(20px,5vmin,36px)}
.tile.next{background:#FFF7C9;animation:glow 1.3s ease-in-out infinite}
.tile .me{position:absolute;bottom:4%;right:12%;font-size:clamp(20px,5vmin,36px);animation:bob 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px var(--yellow),inset 0 -8px 0 var(--well,#eee)}}
.shelf{display:flex;align-items:center;gap:5px;justify-content:center;background:var(--panel);border:3px solid var(--ink);border-radius:16px;padding:4px 8px;font-weight:900;font-size:clamp(12px,3vmin,16px)}
.shelf .slot{width:clamp(26px,6.6vmin,46px);height:clamp(26px,6.6vmin,46px);border-radius:10px;background:#F6EEF2;display:grid;place-items:center;border:2px dashed var(--line);color:var(--soft);font-family:var(--f-en)}
.shelf .slot .pic{width:92%;height:92%}
.shelf .slot.have{border-style:solid;border-color:var(--ink);background:#fff}

/* game */
#gprog{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap;min-height:20px}
.dot{width:clamp(13px,3vmin,19px);height:clamp(13px,3vmin,19px);border-radius:50% 40% 55% 45%;border:2px solid var(--ink);background:var(--panel)}
.dot.f{background:var(--dc,var(--green))}.dot.c{background:var(--yellow);transform:scale(1.3)}
.dot:nth-child(6n+2){--dc:var(--red)}.dot:nth-child(6n+3){--dc:var(--orange)}.dot:nth-child(6n+4){--dc:var(--yellow)}.dot:nth-child(6n+5){--dc:var(--green)}.dot:nth-child(6n){--dc:var(--blue)}.dot:nth-child(6n+1){--dc:var(--purple)}
.sttitle{font-weight:900;font-size:clamp(13px,3.2vmin,17px);color:var(--soft);margin-right:6px}
#gins{text-align:center;font-weight:900;font-size:clamp(16px,4.2vmin,24px);line-height:1.25;min-height:1.25em}
#gdisp{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#gopts{display:flex;gap:clamp(8px,2vmin,16px);justify-content:center;align-items:stretch}
#gopts.txt{flex-direction:column;align-items:center}
@media (min-aspect-ratio:4/3){ #gopts.txt{flex-direction:row;flex-wrap:wrap} #gopts.txt .opt.txt{min-width:0;max-width:42vw;padding:12px 20px} #gopts.txt .opt.txt .in{font-size:clamp(17px,4.4vmin,30px)} }
.gfoot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.gfoot button{border:3px solid var(--ink);background:var(--panel);border-radius:999px;padding:6px 16px;font-weight:900;font-size:clamp(15px,3.8vmin,20px);box-shadow:0 4px 0 var(--ink)}
.gfoot button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#again{background:#F3EAFF}

/* paint-blob options */
.opt{position:relative;border:3px solid var(--ink);background:var(--panel);box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;cursor:pointer;transition:transform .12s,opacity .2s;border-radius:46% 54% 50% 50%/56% 48% 52% 44%}
.opt::before{content:"";position:absolute;top:-3px;left:18%;width:22%;height:20%;background:var(--cap,var(--red));border:3px solid var(--ink);border-top:0;border-radius:0 0 50% 50%;z-index:1}
.opt:nth-child(1){--cap:var(--red)}.opt:nth-child(2){--cap:var(--blue)}.opt:nth-child(3){--cap:var(--green)}.opt:nth-child(4){--cap:var(--purple)}
.opt .in{position:relative;z-index:2;display:flex;align-items:center;justify-content:center}
.opt.pic{width:clamp(90px,27vmin,210px);aspect-ratio:1/1;max-width:31vw}
.opt.pic .in{width:100%;height:100%;padding:16%;box-sizing:border-box}
.opt.pic .pic{width:100%;height:100%}
.opt.let{width:clamp(80px,22vmin,170px);aspect-ratio:1/1;max-width:30vw}
.opt.let .in{font-family:var(--f-en);font-weight:700;font-size:clamp(44px,13vmin,100px);line-height:1}
.opt.txt{min-width:min(78vw,250px);padding:16px 28px;border-radius:999px}
.opt.txt::before{display:none}.opt.txt{border-left:14px solid var(--cap)}
.opt.txt .in{font-family:var(--f-en);font-weight:700;font-size:clamp(20px,5.2vmin,34px);line-height:1.1;letter-spacing:.5px}
.opt .ear{position:absolute;z-index:3;right:4px;top:-8px;font-size:13px;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 7px;line-height:1.5}
.opt.hl{transform:translateY(-6px) scale(1.05);box-shadow:0 10px 0 var(--ink)}
.opt.dim{opacity:.4}
.opt.right{background:#DFF8E6;transform:scale(1.08)}
.opt.hint{animation:hint 1s ease-in-out infinite}
.opt.hint::after{content:"👇";position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:28px;z-index:4}
@keyframes hint{50%{box-shadow:0 0 0 7px var(--yellow),0 5px 0 var(--ink)}}
.opt:active{transform:translateY(3px)}

/* displays */
.pic{display:block}
.dispwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;height:100%;width:100%}
.word{font-family:var(--f-en);font-weight:700;font-size:clamp(34px,10vmin,84px);line-height:1;letter-spacing:2px}
.blank{display:inline-block;min-width:.6em;border-bottom:6px solid var(--red);color:var(--red);text-align:center}
.sent{font-family:var(--f-en);font-weight:700;font-size:clamp(24px,6.5vmin,52px);line-height:1.2;text-align:center;background:var(--panel);border:3px solid var(--ink);border-radius:22px;padding:.25em .7em}
.sent small{display:block;font-size:.85em}
.zhmean{font-weight:900;font-size:clamp(18px,5vmin,32px);color:var(--soft)}
.easel{height:100%;max-height:46vmin;aspect-ratio:1/1;position:relative}
.easel .board{position:absolute;inset:0 6% 10% 6%;background:#fff;border:4px solid var(--ink);border-radius:10px;display:grid;place-items:center;box-shadow:6px 6px 0 var(--wood)}
.easel .board .pic{width:80%;height:80%}
.easel .leg{position:absolute;bottom:0;width:6%;height:20%;background:var(--wood2);border:3px solid var(--ink);border-radius:4px}
.balloon{height:100%;max-height:44vmin;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center}
.balloon .bb{width:78%;aspect-ratio:1/1.12;border:4px solid var(--ink);border-radius:50% 50% 46% 46%/52% 52% 48% 48%;background:radial-gradient(circle at 32% 28%,#fff9 0 12%,transparent 13%),var(--bcol,var(--pink));display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:clamp(46px,13vmin,110px);color:#fff;-webkit-text-stroke:3px var(--ink)}
.balloon .bb.pop{animation:pop .5s}
.balloon .str{flex:1;width:3px;background:var(--ink)}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.rainbowbox{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:100%;position:relative}
.rainbowbox .arc{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);width:min(92%,520px);aspect-ratio:2/1;border-radius:999px 999px 0 0;background:radial-gradient(circle at 50% 100%,transparent 0 38%,var(--purple) 38% 44%,var(--blue) 44% 50%,var(--green) 50% 56%,var(--yellow) 56% 62%,var(--orange) 62% 68%,var(--red) 68% 74%,transparent 74%);opacity:.45}
.rainbowbox .pic{position:relative;height:min(58%,30vmin);width:auto;animation:pop .6s}
.rainbowbox .word{position:relative}
.palette{position:relative;height:100%;max-height:46vmin;aspect-ratio:5/4;background:var(--wood);border:4px solid var(--ink);border-radius:50% 46% 40% 54%/56% 48% 52% 44%;display:grid;place-items:center}
.palette::after{content:"";position:absolute;right:16%;bottom:18%;width:14%;aspect-ratio:1;border-radius:50%;background:var(--bg);border:3px solid var(--ink)}
.palette .pic{width:52%;height:auto}
.palette .label{position:absolute;bottom:-4%;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--panel);border:3px solid var(--ink);border-radius:10px;padding:0 14px;font-family:var(--f-en);font-weight:700;font-size:clamp(22px,6vmin,42px);white-space:nowrap}
.toyshow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;height:100%}
.toyshow .stage{height:min(100%,40vmin);aspect-ratio:1/1;background:var(--panel);border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 -14px 0 #F3E3EC}
.toyshow .stage .pic{width:72%;height:72%}
.bub{font-family:var(--f-en);font-size:clamp(18px,4.6vmin,30px);background:#FFF7C9;border:3px solid var(--ink);border-radius:16px;padding:2px 12px;white-space:nowrap;font-weight:700}
.sc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vmin;height:100%;width:100%}
.scpic{display:flex;align-items:center;justify-content:center;gap:2vmin;font-size:clamp(46px,13vmin,100px);line-height:1;background:var(--panel);border:3px solid var(--ink);border-radius:24px;padding:1.5vmin 3vmin;max-width:100%;box-sizing:border-box;flex-wrap:wrap}
.scpic .pic{height:1.1em;width:auto}
.cap{font-weight:900;font-size:clamp(18px,5vmin,30px);text-align:center}

/* learn card */
.lcard{background:var(--panel);border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:3vmin;padding:2vmin 4vmin;height:100%;max-height:60vmin;box-sizing:border-box;max-width:100%}
.lcard .pic{height:min(100%,34vmin);width:auto}
.lcard .lw{display:flex;flex-direction:column;align-items:flex-start;gap:1vmin}
.lcard .word span{display:inline-block;transition:transform .15s,color .15s}
.lcard .word span.hl{color:var(--red);transform:translateY(-8px) scale(1.2)}
.lcard .word.hl{color:var(--blue)}
@media (max-aspect-ratio:1/1){ .lcard{flex-direction:column;height:auto} .lcard .lw{align-items:center} }

/* paint-drop spelling */
.spell{display:flex;flex-direction:column;align-items:center;gap:1.4vmin;height:100%;width:100%}
.spelltop{display:flex;align-items:center;gap:3vmin}
.spelltop .pic{height:clamp(56px,15vmin,110px);width:auto}
.slots{display:flex;gap:6px}
.slots span{width:clamp(36px,9vmin,64px);height:clamp(44px,11vmin,76px);border:3px solid var(--ink);border-radius:12px;background:var(--panel);display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:clamp(28px,7.5vmin,54px)}
.slots span.f{background:var(--sc,var(--yellow));color:#fff;-webkit-text-stroke:2px var(--ink);animation:pop .4s}
.drops{flex:1;min-height:0;width:min(96%,640px);border:4px dashed var(--line);border-radius:26px;background:#fff8;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:clamp(8px,2vmin,16px);padding:10px;box-sizing:border-box}
.drop{width:clamp(52px,13vmin,92px);aspect-ratio:1;border:3px solid var(--ink);border-radius:50% 0 50% 50%;transform:rotate(-45deg);background:var(--dc);display:grid;place-items:center;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .55s ease,opacity .3s}
.drop b{transform:rotate(45deg);font-family:var(--f-en);font-weight:700;font-size:clamp(28px,7.5vmin,52px);color:#fff;-webkit-text-stroke:2px var(--ink)}
.drop.dim{opacity:.4}
.drop.gone{visibility:hidden}
.drop.hint{animation:hintd 1s infinite}
@keyframes hintd{50%{box-shadow:0 0 0 7px var(--yellow)}}

/* boss + teams */
.bossbar{display:flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(13px,3.3vmin,18px)}
.bossbar .pic{height:clamp(44px,10vmin,72px);width:auto}
.teams{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.team{border:3px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:900;font-size:clamp(13px,3.3vmin,18px);background:var(--panel);display:flex;align-items:center;gap:6px}
.team.cur{transform:scale(1.12);box-shadow:0 0 0 4px var(--yellow)}
.team .sc2{font-family:var(--f-en);font-size:1.2em}

/* overlays */
.ov{position:fixed;inset:0;background:#2B2340cc;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.ovbox{background:var(--panel);border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);padding:clamp(14px,3vmin,28px);text-align:center;display:grid;gap:10px;justify-items:center;max-width:560px;width:100%;max-height:100%;overflow:auto;box-sizing:border-box}
.ovt{font-weight:900;font-size:clamp(28px,8vmin,54px);color:var(--purple)}
.ovpic .pic{width:clamp(100px,28vmin,190px);height:auto;animation:pop .7s}
.ovs{font-weight:900;font-size:clamp(17px,4.4vmin,26px)}
.ovbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ovbtns button{border:3px solid var(--ink);border-radius:999px;padding:8px 20px;font-weight:900;font-size:clamp(17px,4.4vmin,24px);background:var(--panel);box-shadow:0 4px 0 var(--ink)}
.ovbtns button.go{background:var(--green);color:#fff}
.teamsel button{font-size:clamp(20px,5vmin,30px)!important;min-width:3.5em}
.podium{display:grid;gap:6px;width:100%}
.podium div{display:flex;justify-content:space-between;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-weight:900;font-size:clamp(17px,4.4vmin,24px)}
#pauseOv{z-index:40}#pauseOv .ovt{color:var(--blue)}

#praise{pointer-events:none;position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;font-family:var(--f-en);font-weight:700;font-size:clamp(40px,12vmin,96px);color:var(--yellow);-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink);opacity:0;white-space:nowrap}

let hlEl=null;

function stopTalk(){T.tok++;if(hasTTS&&!justUnlocked()){try{speechSynthesis.cancel()}catch(e){}}clearHL()}
function talk(items,done){
  if(S.paused)return;
  stopTalk();const tok=T.tok;let i=0;
  const step=()=>{
    if(tok!==T.tok)return;
    if(i>=items.length){clearHL();if(done)done();return}
    const it=items[i++];
    if(it.p){setTimeout(step,it.p/Math.max(.6,T.rate));return}
    if(it.ins&&!S.voice){step();return}
    clearHL();
    if(it.hl){const el=typeof it.hl==='function'?it.hl():it.hl;if(el){el.classList.add('hl');hlEl=el}}
    if(!hasTTS||!it.t){setTimeout(step,500);return}
    const u=new SpeechSynthesisUtterance(it.t);
    u.lang=it.l==='zh'?'zh-TW':'en-US';
    u.rate=it.l==='zh'?Math.min(1.25,T.rate*1.05+0.12):T.rate;
    let fin=false;
    const end=()=>{if(fin)return;fin=true;clearTimeout(to);if(tok!==T.tok)return;setTimeout(step,it.l==='zh'?140:300/Math.max(.6,T.rate))};
    u.onend=end;u.onerror=end;
    const to=setTimeout(end,2200+it.t.length*(it.l==='zh'?340:130)/u.rate);
    try{speechSynthesis.speak(u)}catch(e){end()}
  };
  if(justUnlocked())step();else setTimeout(step,70);/* 剛點完畫面：馬上唸，iPhone 才會出聲 */
}

/* ===== 和 English-1-abc 同一套：手機聲音解鎖、LINE 換到瀏覽器 =====
   iPhone 只有在「手指放開（touchend）或點一下（click）」的那一瞬間，才允許網頁開始發出聲音；
   按下（pointerdown）不算數。所以第一次點畫面時，在這一瞬間把語音、音效都先打開。
   剛打開聲音的 0.6 秒內不要取消語音，iPhone 會因此失去聲音。 */
const XUA=navigator.userAgent,XLINE=/\bLine\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(XUA);
let unlockAt=0,audioUnlocked=false,needUnlock=false,stayHere=false;
function gestureUnlock(){if(audioUnlocked)return;audioUnlocked=true;unlockAt=performance.now();
  try{const a=ac();if(a){if(a.state!=='running')a.resume();const bf=a.createBuffer(1,1,22050),src=a.createBufferSource();src.buffer=bf;src.connect(a.destination);src.start(0);}}catch(e){}
  try{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}}catch(e){}}
const justUnlocked=()=>performance.now()-unlockAt<600;
['touchend','click','keydown'].forEach(t=>document.addEventListener(t,gestureUnlock,{capture:true,passive:true}));
/* 開到瀏覽器時，網址帶著「要回到哪裡」：go=start 直接進地圖，名字和好朋友也一起帶過去 */
const XKEYS=['go','nm','av','openExternalBrowser'];
function extUrl(extra){const u=new URL(location.href.split('#')[0]);XKEYS.forEach(k=>u.searchParams.delete(k));
  if(extra)for(const [k,v] of Object.entries(extra))if(v!==undefined&&v!==null&&v!=='')u.searchParams.set(k,v);return u.toString();}
const toChrome=u=>{location.href='intent://'+u.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(u)+';end';};
function openExt(extra){const u=extUrl(extra);
  if(/\bLine\//i.test(XUA)){location.href=u+(u.indexOf('?')<0?'?':'&')+'openExternalBrowser=1';return;}
  if(/Android/i.test(XUA)){toChrome(u);return;}
  extHelp(u);}
/* 沒辦法自動跳到瀏覽器時（例如 iPhone 的 Facebook、或 LINE 沒有反應），告訴大人怎麼做 */
function extHelp(u){const ios=/iPhone|iPad|iPod/i.test(XUA);
  const m=document.createElement('div');m.className='xwm';
  m.innerHTML=`<div class="xwb"><div style="font-size:3rem">🌐</div><h2>請用瀏覽器開啟</h2><div class="xwt">${ios?'請按畫面右下角或右上角的「⋯」或「分享」，<br>選「用 Safari 開啟」或「以預設瀏覽器開啟」。':'請按右上角的「⋮」，選「用瀏覽器開啟」。'}<br>也可以按「複製網址」，貼到 Safari 或 Chrome。</div><div><button class="xg" data-x="c">複製網址</button><button class="xy" data-x="x">先在這裡玩</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('[data-x="c"]').onclick=e=>copyUrl(u,e.currentTarget);
  m.querySelector('[data-x="x"]').onclick=()=>{stayHere=true;m.remove();};}
function copyUrl(u,btn){const ok=()=>{if(btn)btn.textContent='網址已複製';};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(ok,fb);return;}}catch(e){}
  fb();function fb(){try{const t=document.createElement('textarea');t.value=u;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();ok();}catch(e){if(btn)btn.textContent='請手動複製網址';}}}
/* 在 LINE 裡按「開始闖關」：換到瀏覽器（有聲音、畫面不會亂跑）；選「先在這裡玩」就留在 LINE */
const goExt=(nm,av)=>{if(XLINE&&!stayHere){openExt({go:'start',nm,av});return true;}return false;};
function bootParams(){let q;try{q=new URLSearchParams(location.search);}catch(e){return {};}
  const r={go:q.get('go'),nm:q.get('nm'),av:q.get('av'),failed:XLINE&&q.get('openExternalBrowser')!==null};
  try{const u=new URL(location.href);XKEYS.forEach(k=>u.searchParams.delete(k));history.replaceState(null,'',u.toString());}catch(e){}
  if(r.failed){const ex={};['go','nm','av'].forEach(k=>{if(r[k]!==null)ex[k]=r[k];});r.url=extUrl(ex);}
  return r;}
/* 從 LINE 換過來的瀏覽器，要等小朋友第一次點畫面才能出聲音：點到時再唸一次現在的說明 */
document.addEventListener('click',e=>{if(!needUnlock)return;needUnlock=false;gestureUnlock();
  if(!(e.target.closest&&e.target.closest('button,a,input'))){if(S.screen==='map'){stopTalk();openMap();}else if(S.screen==='home')openHome();};},{capture:true});
function tone(f,d,type,when,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const t=a.currentTime+(when||0);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,when,freq,vol){const a=ac();if(!a)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||2000;const g=a.createGain();const t=a.currentTime+(when||0);g.gain.setValueAtTime(vol||.3,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f).connect(g).connect(a.destination);s.start(t)}
const SFX={
  chime(){const m=rnd([[523,659,784,1047],[587,740,880,1175],[659,784,988,1319],[392,523,659,784]]);m.forEach((f,i)=>tone(f,.25,'triangle',i*.08,.16))},
  clap(){for(let i=0;i<22;i++)noise(.06,i*.05+Math.random()*.03,1500+Math.random()*1500,.25)},
  boom(){noise(.5,0,600,.35);[0,.12,.22].forEach(t=>tone(1200+Math.random()*800,.12,'square',.25+t,.05))},
  splash(){noise(.25,0,900,.3);tone(880,.1,'sine',.05,.12);tone(1320,.12,'sine',.15,.1)},
  bloop(){tone(330,.12,'sine',0,.2);tone(660,.18,'sine',.1,.18);tone(990,.2,'sine',.2,.14)},
  no(){tone(220,.18,'triangle',0,.14);tone(175,.25,'triangle',.16,.12)},
  fanfare(){[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',i*.13,.17))}
};

/* ---------- celebration canvas ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],fxOn=false;
const COLS=['#E8322B','#FF8A1F','#FFD21F','#2BAA4A','#2F7DF6','#8B4FD8','#FF8CC6'];
function fit(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener('resize',fit);fit();
function burst(mode,big){
  const W_=cv.width,H=cv.height,n=big?2:1;
  if(mode==='confetti')for(let i=0;i<90*n;i++)parts.push({k:'r',x:Math.random()*W_,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,c:rnd(COLS),life:200});
  if(mode==='fire')for(let b=0;b<2+n;b++){const ox=W_*(.2+Math.random()*.6),oy=H*(.15+Math.random()*.35);for(let i=0;i<40;i++){const a=Math.PI*2*i/40,s=2+Math.random()*3;parts.push({k:'c',x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:rnd(COLS),life:60+Math.random()*20,g:.05})}}
  if(mode==='paint')for(let i=0;i<30*n;i++){parts.push({k:'p',x:W_/2+(Math.random()-.5)*W_*.3,y:H*.45,vx:(Math.random()-.5)*12,vy:-(4+Math.random()*7),g:.3,r:6+Math.random()*12,c:rnd(COLS),life:120})}
  if(mode==='bubble')for(let i=0;i<20*n;i++)parts.push({k:'b',x:Math.random()*W_,y:H+30+Math.random()*80,vx:(Math.random()-.5)*.8,vy:-(2+Math.random()*2.5),c:rnd(COLS),life:240,r:10+Math.random()*18});
  if(!fxOn){fxOn=true;requestAnimationFrame(loop)}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life-->0&&p.y<cv.height+80&&p.y>-200);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;if(p.g)p.vy+=p.g;
    if(p.k==='r'){cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.y/20+p.r);cx.fillRect(-5,-3,10,6);cx.restore()}
    else if(p.k==='c'){cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,3,0,7);cx.fill();cx.globalAlpha=1}
    else if(p.k==='p'){cx.fillStyle=p.c;cx.beginPath();cx.ellipse(p.x,p.y,p.r,p.r*.8,p.vx/10,0,7);cx.fill()}
    else if(p.k==='b'){cx.strokeStyle=p.c;cx.lineWidth=3;cx.globalAlpha=.8;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.stroke();cx.globalAlpha=1}}
  if(parts.length)requestAnimationFrame(loop);else{fxOn=false;cx.clearRect(0,0,cv.width,cv.height)}
}
const PRAISE=['Great!','Yay!','Good job!','Super!','Cool!','好厲害！','答對了！','Wow!'];

}

const PH1=[['vest','v',['b','w']],['van','v',['f','b']],['watch','w',['v','m']],['wig','w',['v','b']],['umbrella','u',['a','n']],['up','u',['a','o']],['yoyo','y',['g','j'],'yo-yo'],['fox','x',['z','v'],null,'end'],['six','x',['z','k'],null,'end']];

const PH3=[['van',['pan','fan']],['wig',['pig','fig']],['vest',['best','west']],['zip',['sip','tip']]];
function phonQs(n){
  const pool=shuffle([].concat(pick(PH1,4).map(x=>['first',x]),pick(PH2,1).map(x=>['mid',x]),pick(PH3,2).map(x=>['word',x])));
  return pool.slice(0,n).map(([t,x])=>{
    if(t==='word'){const [w,d]=x;
      return {key:'phw',ins:'聽一聽，你聽到的是哪一個英文？',insS:'聽到哪一個英文？',askEn:[E(w),W(600),E(w)],
        disp:()=>`<div class="rainbowbox"><div class="arc"></div><div class="word" style="font-size:clamp(60px,18vmin,140px)">?</div></div>`,kind:'txt',
        opts:shuffle([{html:w,ok:true}].concat(d.map(v=>({html:v}))))};
    }
    const [k,ans,d,shown,pos]=x;const w=shown||k;
    let blankWord;
    if(t==='mid'){blankWord=w[0]+'<span class="blank" id="blk">?</span>'+w.slice(2)}
    else if(pos==='end'){blankWord=w.slice(0,-1)+'<span class="blank" id="blk">?</span>'}
    else if(k==='yoyo'){blankWord='<span class="blank" id="blk">?</span>o-yo'}
    else{blankWord='<span class="blank" id="blk">?</span>'+w.slice(1)}
    const askZh=t==='mid'?'中間少了哪一個字母？':pos==='end'?'最後一個字母是什麼？':'第一個字母是什麼？';
    return {key:'ph'+(pos||t),ins:'聽聽看這個英文，'+askZh+'點一點',insS:askZh,askEn:[E(w),W(600),E(w)],
      disp:()=>`<div class="rainbowbox"><div class="arc"></div>${PICS[k]}<div class="word">${blankWord}</div></div>`,kind:'let',auto:true,
      opts:shuffle([{html:ans,say:LT(ans),ok:true}].concat(d.map(v=>({html:v,say:LT(v)})))),
      onOk:()=>{const b=$('#blk');b.textContent=ans;b.style.color='var(--green)'}};
  });
}

  let wrong=0,done=false,nag=0;

  tgt.onclick=()=>{if(done||S.ci!==ci)return;done=true;stopTalk();clearTimeout(S.autoT);tgt.classList.remove('ask');tgt.classList.add('good');if(!wrong){S.stars++;updStars()}cheer();

function playCard(){

  S.qs=shuffle(TRACE_W).slice(0,2);S.qi=0;S.q=null;const first=!S.seen.trace;S.seen.trace=1;
  const step=()=>{

    const [w,zh]=S.qs[S.qi];

    $('#gopts').className='';$('#gopts').innerHTML='';

    const sp=it=>new Promise(r=>{if(S.paused)return r();talk([it],r)});
    WT.word(host,w,{pic:`<span class="wtp">${trPic(w)}</span>`,zhw:zh,nm:LT,first:first&&S.qi===0,
      en:t=>sp(E(t)),zh:t=>sp(Z(t,{ins:true})),mean:t=>sp(Z(t)),stop:stopTalk,pop:()=>SFX.bloop(),
      good:()=>{S.stars++;updStars();cheer()},paused:()=>S.paused,alive:()=>tok===S.trTok&&S.screen==='game'&&!S.paused,

/* ---------- station flow ---------- */
function startStation(i){
  if(ST[i].story){startStory(i);return}
  S.traceStep=null;S.trTok=(S.trTok||0)+1;stopTalk();S.mode='solo';S.si=i;S.qi=0;S.lock=false;S.boss=!!ST[i].boss||i===10;S.bossFix=0;
  show('game');restoreFoot();
  const play=qs=>{S.qs=qs;nextQ()};
  switch(i-1){
    case 0:runCards(colCards(),'認識顏色',()=>stationClear());$('#cSkip').hidden=true;break;
    case 1:play(shuffle(letterQs(4).concat(caseQs(2))));break;
    case 2:runCards(phonCards(),'先認識',()=>play(phonQs(6)));break;
    case 3:play(listenColQs(6));break;
    case 4:play(readColQs(6));break;
    case 5:play(spellQs(4));break;
    case 6:runCards(wcCards(),'先認識',()=>play(shuffle(colorTalkQs(5).concat([spaceQ()]))));break;
    case 7:runCards(scnCards(),'先認識',()=>play(sceneQs(6)));break;
    case 8:traceStation();break;
    case 9:play(mixQs(8));break;
  }
}
function bossCols(){return DCOL.map((c,i)=>i<S.bossFix?c:null).map(c=>c||'#C4C0CC')}
function progHTML(){

  return `<span class="sttitle">${ST[S.si].n}</span>`+S.qs.map((_,i)=>`<span class="dot ${i<S.qi?'f':i===S.qi?'c':''}"></span>`).join('');
}
function nextQ(){
  S.lock=false;S.wrong=0;

  const q=S.qs[S.qi];S.q=q;

function optEl(i){return document.querySelector('#gopts .opt[data-i="'+i+'"]')}

/* ---------- paint-drop spelling ---------- */
function renderSpell(q){
  const word=q.c,letters=word.split('');
  const pool='abcdfghjkmnoqstvwxz'.split('').filter(c=>letters.indexOf(c)<0);
  const drops=shuffle(letters.concat(pick(pool,word.length>4?2:3)));
  S.sp={word,letters,idx:0,wrong:0,anyWrong:false};
  $('#gins').textContent='點顏料滴，把字母一個一個放進格子';
  $('#gopts').className='';$('#gopts').innerHTML='';
  const dc=Object.values(C);
  $('#gdisp').innerHTML=`<div class="spell"><div class="spelltop">${splat(C[word])}<div class="slots" id="slots">${letters.map(()=>'<span></span>').join('')}</div></div>
    <div class="drops" id="drops">${drops.map((c,i)=>`<div class="drop" role="button" tabindex="0" data-c="${c}" style="--dc:${dc[i%dc.length]}"><b>${c}</b></div>`).join('')}</div></div>`;
  checkFit();spellSay(false,true);
}
function spellSay(again,first){
  const c=S.sp;if(!c)return;const need=c.letters[c.idx];const seq=[];
  if(first){const long=!S.seen.spell;S.seen.spell=1;seq.push(Z(long?'看顏色，拼出這個英文。點一下顏料滴，字母就會飛進格子裡。':'拼出這個顏色',{ins:true}),W(250))}
  if(first||again){seq.push(E(c.word),W(300),Z(CZ[c.word]),W(300));seq.push(...spell(c.word));seq.push(E(c.word),W(400))}
  if(need)seq.push(Z(c.idx===0?'請點':'下一個，請點',{ins:true}),E(LT(need)));
  talk(seq);
}
$('#gdisp').addEventListener('click',e=>{const b=e.target.closest('.drop');if(b)tapDrop(b)});
$('#gdisp').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const b=e.target.closest('.drop');if(b){e.preventDefault();tapDrop(b)}}});
function tapDrop(b){
  const c=S.sp;if(S.lock||S.paused||!c||b.classList.contains('gone'))return;
  const need=c.letters[c.idx];
  if(b.dataset.c!==need){
    S.lock=true;c.wrong++;c.anyWrong=true;stopTalk();SFX.no();b.classList.add('dim');setTimeout(()=>b.classList.remove('dim'),900);
    if(c.wrong>=2)document.querySelectorAll('#drops .drop').forEach(x=>{if(x.dataset.c===need&&!x.classList.contains('gone'))x.classList.add('hint')});
    talk([Z('不是這個，請點',{ins:true}),E(LT(need))]);

  }

    if(Date.now()<SH.sndUntil)return;playSfx(null)};
  $s('#shText').innerHTML='<div class="shLine"><span class="shNo '+(pg.n?'':'star')+'">'+(pg.n||'★')+'</span><span class="shWho">'+whoIcon(pg.w)+'</span><div><div class="shEn">'+pg.en.split(' ').map(function(w){return '<span class="shW">'+w+'</span>'}).join(' ')+'</div><div class="shZh">'+pg.zh+'</div></div></div><div id="shTip">💡 '+pg.tip+'</div>';
  $$s('#shText .shW').forEach(function(sp){sp.onclick=function(e){e.stopPropagation();SH.ptok++;hush();var w=sp.textContent.replace(/[.,!?]/g,'');sp.classList.add('shOn');say([{t:w,lang:'en',r:.8}],function(){sp.classList.remove('shOn')})}});
  $s('#shPrev').disabled=i===0;$s('#shNext').textContent=i===SH.pages.length-1?'看完了':'下一頁';
  if(!SH.paused)read()}
function go(d){var n=SH.page+d;if(n<0)return;if(n>=SH.pages.length){close();SH.opt.onDone&&SH.opt.onDone();return}showPage(n)}
function close(){SH.closed=true;SH.ptok++;hush();var r=$s('#shRoot');if(r)r.hidden=true}
window.StoryHouse={
  open:function(opt){build();SH.opt=opt;SH.pages=opt.pages;SH.closed=false;SH.paused=false;$s('#shPause').hidden=true;
    $s('#shBack').textContent=opt.backText||'回闖關地圖';$s('#shRoot').hidden=false;audioWake();pickVoices();showPage(0)},
  close:close,isOpen:function(){var r=$s('#shRoot');return !!(r&&!r.hidden)},_SH:SH,_SFX:SFX,_tip:tipItems
};
})();

</script>
